<body>
    <h1>💥 Collision Tests</h1>
    <div class="description">
        Tests for collision detection: projectile-entity, asteroid, cargo collection, and docking.
    </div>
    <div id="test-results">Running tests...</div>

    <!-- Test harness -->
    <script src="test_harness.js"></script>

    <!-- Dependencies -->
    <script src="../debug.js"></script>
    <script src="../objectPool.js"></script>
    <script src="../projectile.js"></script>
    <script src="../missionGenerator.js"></script>
    <script src="../asteroid.js"></script>
    <script src="../cargo.js"></script>

    <script>
        // Setup mock p5 before tests
        setupMockP5();

        // ============================================
        // Basic Distance Calculation Tests
        // ============================================

        describe('Distance Calculations', () => {
            it('should calculate distance between two points', () => {
                const d = dist(0, 0, 3, 4);
                expect(d).toBe(5);
            });

            it('should calculate distance using vectors', () => {
                const v1 = createVector(0, 0);
                const v2 = createVector(3, 4);
                expect(v1.dist(v2)).toBe(5);
            });

            it('should handle zero distance', () => {
                const d = dist(5, 5, 5, 5);
                expect(d).toBe(0);
            });

            it('should handle negative coordinates', () => {
                const d = dist(-3, -4, 0, 0);
                expect(d).toBe(5);
            });
        });

        // ============================================
        // Circle-Circle Collision Tests
        // ============================================

        describe('Circle-Circle Collision', () => {
            function circlesCollide(x1, y1, r1, x2, y2, r2) {
                const d = dist(x1, y1, x2, y2);
                return d < r1 + r2;
            }

            it('should detect overlapping circles', () => {
                expect(circlesCollide(0, 0, 10, 15, 0, 10)).toBe(true);
            });

            it('should not detect separate circles', () => {
                expect(circlesCollide(0, 0, 10, 100, 0, 10)).toBe(false);
            });

            it('should handle touching circles', () => {
                // Exactly touching (distance = sum of radii)
                const d = dist(0, 0, 20, 0);
                expect(d).toBe(20);
                expect(circlesCollide(0, 0, 10, 20, 0, 10)).toBe(false); // < not <=
            });

            it('should handle concentric circles', () => {
                expect(circlesCollide(0, 0, 10, 0, 0, 5)).toBe(true);
            });
        });

        // ============================================
        // Projectile Collision Tests
        // ============================================

        describe('Projectile Collision', () => {
            let projectile;

            beforeEach(() => {
                projectile = new Projectile(50, 50, 0, null);
                projectile.size = 5;
            });

            it('should have checkCollision method', () => {
                expect(typeof projectile.checkCollision).toBe('function');
            });

            it('should detect collision with nearby target', () => {
                const target = { pos: createVector(55, 50), size: 20 };
                expect(projectile.checkCollision(target)).toBe(true);
            });

            it('should not collide with distant target', () => {
                const target = { pos: createVector(200, 200), size: 20 };
                expect(projectile.checkCollision(target)).toBe(false);
            });

            it('should consider target size', () => {
                const largeTarget = { pos: createVector(75, 50), size: 50 };
                expect(projectile.checkCollision(largeTarget)).toBe(true);
            });

            it('should consider projectile size', () => {
                projectile.size = 30;
                const target = { pos: createVector(65, 50), size: 10 };
                expect(projectile.checkCollision(target)).toBe(true);
            });

            it('should not collide with owner', () => {
                const owner = { pos: createVector(50, 50), size: 20 };
                projectile.owner = owner;
                // Projectile should have logic to skip owner
                // The checkCollision method may not check owner, but game loop should
            });
        });

        // ============================================
        // Asteroid Collision Tests
        // ============================================

        describe('Asteroid Collision', () => {
            let asteroid;

            beforeEach(() => {
                asteroid = new Asteroid(100, 100, 40);
            });

            it('should have checkCollision method', () => {
                expect(typeof asteroid.checkCollision).toBe('function');
            });

            it('should use maxRadius for collision', () => {
                expect(asteroid.maxRadius).toBeDefined();
                expect(asteroid.maxRadius).toBeGreaterThan(0);
            });

            it('should detect collision with overlapping target', () => {
                const target = { pos: createVector(120, 100), size: 30 };
                expect(asteroid.checkCollision(target)).toBe(true);
            });

            it('should not collide with distant target', () => {
                const target = { pos: createVector(500, 500), size: 20 };
                expect(asteroid.checkCollision(target)).toBe(false);
            });

            it('should handle small targets', () => {
                const target = { pos: createVector(100, 100), size: 5 };
                expect(asteroid.checkCollision(target)).toBe(true); // Inside asteroid
            });
        });

        // ============================================
        // Cargo Collection Tests
        // ============================================

        describe('Cargo Collection', () => {
            let cargo;

            beforeEach(() => {
                cargo = new Cargo(100, 100, 'Food', 5);
            });

            it('should have checkCollision method', () => {
                expect(typeof cargo.checkCollision).toBe('function');
            });

            it('should detect collision with player', () => {
                const player = { pos: createVector(105, 100), size: 30 };
                expect(cargo.checkCollision(player)).toBe(true);
            });

            it('should not collect from distance', () => {
                const player = { pos: createVector(500, 500), size: 30 };
                expect(cargo.checkCollision(player)).toBe(false);
            });

            it('should have cargo size for collision', () => {
                expect(cargo.size).toBeDefined();
                expect(cargo.size).toBeGreaterThan(0);
            });
        });

        // ============================================
        // Line-Circle Intersection Tests (for beams)
        // ============================================

        describe('Line-Circle Intersection', () => {
            function lineCircleIntersect(x1, y1, x2, y2, cx, cy, r) {
                // Vector from line start to circle center
                const dx = x2 - x1;
                const dy = y2 - y1;
                const fx = x1 - cx;
                const fy = y1 - cy;

                const a = dx * dx + dy * dy;
                const b = 2 * (fx * dx + fy * dy);
                const c = fx * fx + fy * fy - r * r;

                let discriminant = b * b - 4 * a * c;
                if (discriminant < 0) return false;

                discriminant = Math.sqrt(discriminant);
                const t1 = (-b - discriminant) / (2 * a);
                const t2 = (-b + discriminant) / (2 * a);

                // Check if intersection is within line segment
                return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1);
            }

            it('should detect line through circle', () => {
                expect(lineCircleIntersect(0, 50, 100, 50, 50, 50, 20)).toBe(true);
            });

            it('should not detect line missing circle', () => {
                expect(lineCircleIntersect(0, 0, 100, 0, 50, 100, 20)).toBe(false);
            });

            it('should detect line starting inside circle', () => {
                expect(lineCircleIntersect(50, 50, 100, 50, 50, 50, 20)).toBe(true);
            });

            it('should detect line ending inside circle', () => {
                expect(lineCircleIntersect(0, 50, 50, 50, 50, 50, 20)).toBe(true);
            });

            it('should detect tangent line', () => {
                // Line tangent to circle at y=70, circle at (50,50) r=20
                expect(lineCircleIntersect(0, 70, 100, 70, 50, 50, 20)).toBe(true);
            });
        });

        // ============================================
        // Point-in-Circle Tests
        // ============================================

        describe('Point-in-Circle', () => {
            function pointInCircle(px, py, cx, cy, r) {
                const d = dist(px, py, cx, cy);
                return d < r;
            }

            it('should detect point inside circle', () => {
                expect(pointInCircle(50, 50, 50, 50, 20)).toBe(true);
            });

            it('should detect point outside circle', () => {
                expect(pointInCircle(100, 100, 50, 50, 20)).toBe(false);
            });

            it('should handle point on edge', () => {
                // Point exactly on edge (distance = radius)
                expect(pointInCircle(70, 50, 50, 50, 20)).toBe(false); // < not <=
            });
        });

        // ============================================
        // Docking Detection Tests
        // ============================================

        describe('Docking Detection', () => {
            function canDock(playerPos, playerSize, stationPos, dockingRange) {
                const d = playerPos.dist(stationPos);
                return d < dockingRange + playerSize / 2;
            }

            it('should allow docking when in range', () => {
                const player = createVector(100, 100);
                const station = createVector(120, 100);
                expect(canDock(player, 30, station, 50)).toBe(true);
            });

            it('should not allow docking when too far', () => {
                const player = createVector(0, 0);
                const station = createVector(500, 500);
                expect(canDock(player, 30, station, 50)).toBe(false);
            });

            it('should consider player size', () => {
                const player = createVector(0, 0);
                const station = createVector(60, 0);
                expect(canDock(player, 30, station, 50)).toBe(true);
            });
        });

        // ============================================
        // Collision Response Tests
        // ============================================

        describe('Collision Response', () => {
            it('should separate overlapping circles', () => {
                const obj1 = { pos: createVector(50, 50), size: 20 };
                const obj2 = { pos: createVector(60, 50), size: 20 };

                // Calculate overlap
                const d = obj1.pos.dist(obj2.pos);
                const overlap = (obj1.size / 2 + obj2.size / 2) - d;

                expect(overlap).toBeGreaterThan(0);

                // Separation direction
                const dir = MockVector.sub(obj2.pos, obj1.pos).normalize();
                expect(dir.x).toBeGreaterThan(0);
            });

            it('should calculate bounce vector', () => {
                const velocity = createVector(5, 0);
                const normal = createVector(-1, 0); // Surface facing left

                // Reflect: v - 2(v·n)n
                const dot = velocity.dot(normal);
                const reflected = MockVector.sub(velocity, MockVector.mult(normal, 2 * dot));

                expect(reflected.x).toBeLessThan(0); // Bounced back
            });
        });

        // ============================================
        // Broad Phase Collision Tests
        // ============================================

        describe('Broad Phase Collision', () => {
            function inBoundingBox(px, py, bx, by, bw, bh) {
                return px >= bx && px <= bx + bw && py >= by && py <= by + bh;
            }

            it('should detect point in bounding box', () => {
                expect(inBoundingBox(50, 50, 0, 0, 100, 100)).toBe(true);
            });

            it('should detect point outside bounding box', () => {
                expect(inBoundingBox(150, 50, 0, 0, 100, 100)).toBe(false);
            });

            it('should filter potential collisions by distance', () => {
                const objects = [
                    { pos: createVector(10, 0), size: 10 },
                    { pos: createVector(50, 0), size: 10 },
                    { pos: createVector(1000, 0), size: 10 }
                ];
                const source = createVector(0, 0);
                const maxRange = 100;

                const nearby = objects.filter(o => source.dist(o.pos) < maxRange);
                expect(nearby).toHaveLength(2);
            });
        });

        // ============================================
        // Asteroid Damage Tests
        // ============================================

        describe('Asteroid Damage', () => {
            let asteroid;

            beforeEach(() => {
                asteroid = new Asteroid(100, 100, 40);
            });

            it('should have takeDamage method', () => {
                expect(typeof asteroid.takeDamage).toBe('function');
            });

            it('should reduce health on damage', () => {
                const initialHealth = asteroid.health;
                asteroid.takeDamage(10);
                expect(asteroid.health).toBe(initialHealth - 10);
            });

            it('should have isDestroyed method', () => {
                expect(typeof asteroid.isDestroyed).toBe('function');
            });

            it('should be destroyed when health depleted', () => {
                asteroid.health = 10;
                asteroid.takeDamage(15);
                expect(asteroid.isDestroyed()).toBe(true);
            });
        });

        // ============================================
        // Cargo Properties Tests
        // ============================================

        describe('Cargo Properties', () => {
            let cargo;

            beforeEach(() => {
                cargo = new Cargo(100, 100, 'Metals', 3);
            });

            it('should store cargo type', () => {
                expect(cargo.type).toBe('Metals');
            });

            it('should store quantity', () => {
                expect(cargo.quantity).toBe(3);
            });

            it('should have position', () => {
                expect(cargo.pos.x).toBe(100);
                expect(cargo.pos.y).toBe(100);
            });

            it('should have getValue method', () => {
                expect(typeof cargo.getValue).toBe('function');
            });

            it('should have isExpired method', () => {
                expect(typeof cargo.isExpired).toBe('function');
            });

            it('should determine color based on type', () => {
                expect(typeof Cargo.determineColor).toBe('function');
                const color = Cargo.determineColor('Metals');
                expect(Array.isArray(color)).toBe(true);
                expect(color).toHaveLength(3);
            });
        });

        // ============================================
        // Off-Screen Detection Tests
        // ============================================

        describe('Off-Screen Detection', () => {
            it('projectile should have isOffScreen method', () => {
                const proj = new Projectile(0, 0, 0, null);
                expect(typeof proj.isOffScreen).toBe('function');
            });

            it('should detect projectile off screen', () => {
                const proj = new Projectile(-10000, 0, 0, null);
                // Depends on world bounds, but extreme values should be off
                // The actual implementation may vary
                expect(typeof proj.isOffScreen()).toBe('boolean');
            });
        });

        // Run all tests
        runTests();
    </script>
</body>

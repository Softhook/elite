        // Setup mock p5 before tests

        // Mock player for mission tests
        function createMockPlayer(options = {}) {
            return {
                pos: createVector(0, 0),
                credits: options.credits || 5000,
                cargo: options.cargo || [],
                cargoCapacity: options.cargoCapacity || 50,
                activeMission: null,
                wantedLevel: 0,
                eliteScore: options.eliteScore || 100,
                personalRecords: { kills: { total: 0 } },
                addCredits(amount) { this.credits += Math.floor(amount); },
                hasCargo(name, qty) {
                    const item = this.cargo.find(c => c.name === name);
                    return item && item.quantity >= qty;
                }
            };
        }

        // Mock system for mission tests
        function createMockSystem(options = {}) {
            return {
                name: options.name || 'Test System',
                index: options.index || 0,
                systemIndex: options.index || 0,
                economyType: options.economyType || 'Industrial',
                securityLevel: options.securityLevel || 'Medium',
                techLevel: options.techLevel || 5,
                connectedSystemIndices: options.connectedSystemIndices || [],
                station: options.station || { name: 'Test Station', pos: createVector(500, 500) }
            };
        }

        // Mock galaxy for mission generation
        function createMockGalaxy(numSystems = 4) {
            const systems = [];
            for (let i = 0; i < numSystems; i++) {
                // Build connected system indices - connect to adjacent systems
                const connected = [];
                if (i > 0) connected.push(i - 1);
                if (i < numSystems - 1) connected.push(i + 1);
                // Also connect to some systems further away for more routing options
                if (i + 2 < numSystems) connected.push(i + 2);

                systems.push(createMockSystem({
                    name: `System ${i}`,
                    index: i,
                    economyType: ['Industrial', 'Agricultural', 'Mining', 'Service'][i % 4],
                    connectedSystemIndices: connected
                }));
            }
            return {
                systems,
                getSystemByIndex(idx) { return this.systems[idx]; },
                getJumpDistance(from, to) { return Math.abs(to - from); }
            };
        }

                expect(FACTION_PATROL_TYPES.has(mission.type)).toBe(true);

            it('should track scan progress for patrol missions', () => {
                const mission = new Mission({
                    id: 202,
                    title: 'Imperial Patrol',
                    type: MISSION_TYPE.IMPERIAL_PATROL,
                    targetCount: 3,
                    rewardCredits: 1500
                });
                mission.status = 'Active';
                mission.progressCount = 0;
                mission._scannedShipIds = new Set();

                // Simulate scans (each unique ship adds progress)
                mission._scannedShipIds.add('ship1');
                mission.progressCount++;
                expect(mission.progressCount).toBe(1);

                mission._scannedShipIds.add('ship2');
                mission.progressCount++;
                expect(mission.progressCount).toBe(2);

                mission._scannedShipIds.add('ship3');
                mission.progressCount++;
                expect(mission.progressCount).toBe(3);

                expect(mission.progressCount >= mission.targetCount).toBe(true);
            });

            it('should not count duplicate scans', () => {
                const mission = new Mission({
                    id: 203,
                    title: 'Military Defense',
                    type: MISSION_TYPE.MILITARY_DEFENSE,
                    targetCount: 3,
                    rewardCredits: 1500
                });
                mission.status = 'Active';
                mission.progressCount = 0;
                mission._scannedShipIds = new Set();

                // Scan same ship twice - should only count once
                const shipId = 'ship123';
                if (!mission._scannedShipIds.has(shipId)) {

                    mission.progressCount++;
                }

        // ============================================
        // MissionGenerator Faction Mission Tests
        // ============================================

        describe('MissionGenerator Faction Missions', () => {
            let system;
            let station;
            let galaxy;
            let player;

            beforeEach(() => {
                galaxy = createMockGalaxy(8);
                system = galaxy.systems[0];
                station = system.station;
                player = createMockPlayer();
                player.playerFaction = 'SEPARATIST';
                player.getFactionRank = () => 1;
            });

            it('should generate supply mission with destinationStation', () => {
                // Force the random selection to 'supply' type
                const origRandom = window.random;
                let callCount = 0;
                window.random = (arr) => {
                    if (Array.isArray(arr)) {
                        // First call selects mission type
                        if (callCount === 0) {
                            callCount++;
                            return 'supply';
                        }
                        // Other calls for cargo selection
                        return arr[0];
                    }
                    // For numeric ranges
                    if (typeof arr === 'number') {
                        return arr;
                    }
                    return origRandom(arr);
                };

                try {
                    const context = {
                        originSystem: system,
                        originStation: station,
                        galaxy: galaxy,
                        player: player
                    };
                    // Call the internal method directly
                    const mission = MissionGenerator._createSeparatistMission(
                        system, station, galaxy, player, 1.0
                    );
                    if (mission && mission.type === MISSION_TYPE.SEPARATIST_SUPPLY) {
                        expect(mission.destinationSystem).toBeTruthy();
                        expect(mission.destinationStation).toBeTruthy();
                    }
                } finally {
                    window.random = origRandom;
                }
            });
        });

        // Run all tests
        runTests();

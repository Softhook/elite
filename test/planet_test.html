<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Atmosphere Test</title>
    <script src="../libraries/p5.min.js"></script>
    <script src="../libraries/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #444;
            max-width: 280px;
        }

        button {
            margin: 5px 5px 5px 0;
            padding: 5px 10px;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .control-group {
            margin: 10px 0;
            padding: 8px;
            background: rgba(50, 50, 80, 0.5);
            border-radius: 4px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaf;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        .alpha-value {
            color: #ff0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="info">
        <h3>Planet Atmosphere Test</h3>
        <button id="newPlanet">New Planet</button>
        <button id="toggleRotation">Toggle Rotation</button>
        <button id="toggleAtmosphere">Toggle Atmosphere</button>

        <div class="control-group">
            <label>Atmosphere Alpha: <span id="alphaValue" class="alpha-value">37</span></label>
            <input type="range" id="alphaSlider" min="0" max="255" value="37">
            <button id="alphaDown">-10</button>
            <button id="alphaUp">+10</button>
        </div>

        <div class="control-group">
            <label>Planet Size: <span id="sizeValue" class="alpha-value">275</span>px</label>
            <input type="range" id="sizeSlider" min="50" max="2000" value="275">
        </div>

        <div id="stats"></div>
    </div>

    <script>
        // Include Planet class inline
        // Copy the Planet class from planet.js here
        // For now, we'll load it via script tag
    </script>
    <script src="../planet.js"></script>
    <script>
        let testPlanet;
        let rotationEnabled = true;
        let currentPlanetSeed = 0;
        let atmosphereAlpha = 37; // Default value (midpoint of 25-50)
        let planetSize = 275; // Default planet size

        function setup() {
            createCanvas(1200, 800);
            angleMode(RADIANS);
            generateNewPlanet();

            // Button handlers
            document.getElementById('newPlanet').addEventListener('click', generateNewPlanet);
            document.getElementById('toggleRotation').addEventListener('click', () => {
                rotationEnabled = !rotationEnabled;
            });
            document.getElementById('toggleAtmosphere').addEventListener('click', () => {
                if (testPlanet) {
                    testPlanet.hasAtmosphere = !testPlanet.hasAtmosphere;
                    updateStats();
                }
            });

            // Alpha slider
            const alphaSlider = document.getElementById('alphaSlider');
            alphaSlider.addEventListener('input', (e) => {
                atmosphereAlpha = parseInt(e.target.value);
                updateAtmosphereAlpha();
            });

            // Alpha buttons
            document.getElementById('alphaDown').addEventListener('click', () => {
                atmosphereAlpha = Math.max(0, atmosphereAlpha - 10);
                document.getElementById('alphaSlider').value = atmosphereAlpha;
                updateAtmosphereAlpha();
            });
            document.getElementById('alphaUp').addEventListener('click', () => {
                atmosphereAlpha = Math.min(255, atmosphereAlpha + 10);
                document.getElementById('alphaSlider').value = atmosphereAlpha;
                updateAtmosphereAlpha();
            });

            // Size slider
            const sizeSlider = document.getElementById('sizeSlider');
            sizeSlider.addEventListener('input', (e) => {
                planetSize = parseInt(e.target.value);
                document.getElementById('sizeValue').textContent = planetSize;
                regeneratePlanetWithCurrentSettings();
            });
        }

        function updateAtmosphereAlpha() {
            document.getElementById('alphaValue').textContent = atmosphereAlpha;
            if (testPlanet && testPlanet.atmosphereColor) {
                // Update atmosphere color with new alpha
                const r = red(testPlanet.atmosphereColor);
                const g = green(testPlanet.atmosphereColor);
                const b = blue(testPlanet.atmosphereColor);
                testPlanet.atmosphereColor = color(r, g, b, atmosphereAlpha);

                // Regenerate atmosphere buffer with new alpha
                if (testPlanet.atmosphereBuffer) {
                    testPlanet.atmosphereBuffer.remove();
                }
                const atmBufferSizeFactor = testPlanet.isInhabited ? 2.1 : (1.0 + (5 * 0.04));
                const atmBufferSize = Math.ceil(testPlanet.size * atmBufferSizeFactor);
                testPlanet.atmosphereBuffer = createGraphics(atmBufferSize, atmBufferSize);
                testPlanet.renderAtmosphere();

                updateStats();
            }
        }

        function regeneratePlanetWithCurrentSettings() {
            // Regenerate planet with same seed but new size
            randomSeed(currentPlanetSeed);
            noiseSeed(currentPlanetSeed);

            const color1 = color(random(80, 180), random(80, 180), random(80, 180));
            const color2 = color(random(80, 180), random(80, 180), random(80, 180));

            // Dispose old buffers
            if (testPlanet) {
                testPlanet.disposeBuffers();
            }

            testPlanet = new Planet(width / 2, height / 2, planetSize, color1, color2, "Test System", 1);

            // Force it to be inhabited
            testPlanet.isInhabited = true;
            testPlanet.cityLightsDensity = random(0.4, 0.8);

            // Add atmosphere with current alpha setting
            testPlanet.hasAtmosphere = true;
            testPlanet.atmosphereColor = color(random(150, 220), random(150, 220), random(200, 255), atmosphereAlpha);

            // Create buffers
            testPlanet.createBuffers();

            // Compute shadow
            const sunPos = createVector(width / 2 - 500, height / 2 - 300);
            testPlanet.computeShadowOffset(sunPos);

            updateStats();
        }

        function generateNewPlanet() {
            currentPlanetSeed = Math.random() * 10000;
            randomSeed(currentPlanetSeed);
            noiseSeed(currentPlanetSeed);

            // Randomize size and update slider
            planetSize = Math.floor(random(200, 350));
            document.getElementById('sizeSlider').value = planetSize;
            document.getElementById('sizeValue').textContent = planetSize;

            const color1 = color(random(80, 180), random(80, 180), random(80, 180));
            const color2 = color(random(80, 180), random(80, 180), random(80, 180));

            testPlanet = new Planet(width / 2, height / 2, planetSize, color1, color2, "Test System", 1);

            // Force it to be inhabited
            testPlanet.isInhabited = true;
            testPlanet.cityLightsDensity = random(0.4, 0.8);

            // Add atmosphere with current alpha setting
            testPlanet.hasAtmosphere = true;
            testPlanet.atmosphereColor = color(random(150, 220), random(150, 220), random(200, 255), atmosphereAlpha);

            // Create buffers
            testPlanet.createBuffers();

            // Compute shadow
            const sunPos = createVector(width / 2 - 500, height / 2 - 300);
            testPlanet.computeShadowOffset(sunPos);

            updateStats();
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <p>Seed: ${Math.floor(currentPlanetSeed)}</p>
                <p>Size: ${Math.floor(testPlanet.size)}</p>
                <p>Atmosphere: ${testPlanet.hasAtmosphere ? 'ON' : 'OFF'}</p>
                <p>Name: ${testPlanet.name}</p>
            `;
        }

        function draw() {
            background(10, 10, 20);

            // Draw stars
            push();
            fill(255, 255, 255, 150);
            noStroke();
            for (let i = 0; i < 100; i++) {
                const sx = (noise(i * 0.1, frameCount * 0.0001) * width * 2) % width;
                const sy = (noise(i * 0.1 + 100, frameCount * 0.0001) * height * 2) % height;
                ellipse(sx, sy, 1, 1);
            }
            pop();

            // Update and draw planet
            if (testPlanet) {
                if (rotationEnabled) {
                    testPlanet.update();
                }

                // Draw the planet directly — Planet.draw already translates to its own position
                const sunPos = createVector(width / 2 - 500, height / 2 - 300);
                testPlanet.draw(sunPos);
            }

            // Draw sun indicator
            push();
            fill(255, 250, 200, 100);
            noStroke();
            ellipse(width / 2 - 500, height / 2 - 300, 30, 30);
            fill(255, 250, 200, 200);
            ellipse(width / 2 - 500, height / 2 - 300, 15, 15);
            pop();

            // Show FPS
            fill(100, 200, 100);
            noStroke();
            textSize(12);
            textAlign(RIGHT, BOTTOM);
            text(`FPS: ${Math.floor(frameRate())}`, width - 10, height - 10);
        }
    </script>
</body>

</html>

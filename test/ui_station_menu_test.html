<!DOCTYPE html>
<html>

<head>
    <title>UI Station Menu Test</title>
    <style>
        body {
            background: #1a1a1a;
            color: #ccc;
            font-family: sans-serif;
        }
    </style>
    <!-- Dependencies -->
    <script src="../test/test_harness.js"></script>

    <!-- Mocks for UIManager dependencies -->
    <script>
        class UIHUD { trackCombatSound() { } cleanupBattleIndicators() { } drawBattleIndicators() { } drawHUD() { } drawWeaponSelector() { } drawTargetOverlay() { } drawGameOverScreen() { } drawFramerate() { } }
        class UIMinimap { draw() { } }
        class UIMarket { drawSpaceObjectMarket() { } drawStationMarket() { } handleSpaceObjectTrade() { } }
        class UIStationMenus { drawRepairsMenu() { } drawSpaceObjectRepairsMenu() { } handleShipyardClick() { } handleUpgradesClick() { } handleShipDetailClick() { } handleWeaponDetailClick() { } }
        class UIMissions { drawMissionBoard() { } }
        class UIGalaxyMap { drawGalaxyMap() { } handleGalaxyMapClicks() { } }
        class UIFactionRecruitment { drawPoliceRecruitmentMenu() { } }

        // Mock global font
        const font = 'Arial';

        // Mock drawingContext for canvas low-level ops
        window.drawingContext = {
            save: () => { },
            restore: () => { },
            globalAlpha: 1
        };

        // Mock additional p5 functions not in test harness
        window.textFont = () => { };
    </script>

    <!-- Source files -->
    <script src="../uiComponents.js"></script>
    <script src="../uiManager.js"></script>
</head>

<body>
    <h1>UI Station Menu Tests</h1>
    <div id="test-results"></div>

    <script>
        describe('UI Station Menus', () => {
            let ui;
            let mockStation;
            let mockPlayer;
            let mockSystem;

            beforeEach(() => {
                // Setup Globals
                window.width = 1000;
                window.height = 800;
                window.galaxy = {
                    getCurrentSystem: () => mockSystem
                };
                window.gameStateManager = {
                    currentState: 'DOCKED'
                };

                // Instantiate UIManager
                ui = new UIManager();

                // Mocks
                mockSystem = {
                    name: 'Test System',
                    economyType: 'Industrial',
                    techLevel: 5,
                    securityLevel: 'Safe',
                    station: null // Will be set in tests
                };

                mockStation = {
                    name: 'Test Station',
                    type: 'starport',
                    isSecret: false // Default
                };
                mockSystem.station = mockStation;

                mockPlayer = {
                    credits: 1000,
                    cargoCapacity: 50,
                    getCargoAmount: () => 10,
                    getFactionRank: () => 0
                };
            });

            it('should show Market and Protection for normal stations', () => {
                mockStation.isSecret = false;

                ui.drawStationMainMenu(mockStation, mockPlayer);

                const buttons = ui.stationMenuButtonAreas;
                expect(buttons).toBeDefined();
                expect(buttons.length).toBeGreaterThan(0);

                const marketBtn = buttons.find(b => b.state === 'VIEWING_MARKET');
                const protectBtn = buttons.find(b => b.state === 'VIEWING_PROTECTION');

                expect(marketBtn).toBeDefined();
                expect(protectBtn).toBeDefined();
            });

            it('should HIDE Market and Protection for secret bases', () => {
                mockStation.isSecret = true;

                ui.drawStationMainMenu(mockStation, mockPlayer);

                const buttons = ui.stationMenuButtonAreas;
                expect(buttons).toBeDefined();

                const marketBtn = buttons.find(b => b.state === 'VIEWING_MARKET');
                const protectBtn = buttons.find(b => b.state === 'VIEWING_PROTECTION');

                expect(marketBtn).toBeUndefined(); // Should be hidden
                expect(protectBtn).toBeUndefined(); // Should be hidden

                // Ensure other buttons are still there
                const shipyardBtn = buttons.find(b => b.state === 'VIEWING_SHIPYARD');
                expect(shipyardBtn).toBeDefined();
            });
        });

        runTests();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commodity Balance Tests - Elite Game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            color: #e8f0ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #64b5f6;
        }

        .description {
            background: #1a1a2e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #64b5f6;
        }

        .analysis-section {
            background: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
        }

        .analysis-section h3 {
            margin-top: 0;
            color: #4caf50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #1a1a2e;
            color: #64b5f6;
        }

        .high-value {
            color: #ff9800;
            font-weight: bold;
        }

        .medium-value {
            color: #ffc107;
        }

        .low-value {
            color: #4caf50;
        }

        .illegal {
            color: #f44336;
        }
    </style>
</head>

<body>
    <h1>💰 Commodity Balance Analysis</h1>
    <div class="description">
        Tests to analyze commodity price distribution and trading viability. Helps identify imbalances between high-value and low-value goods.
    </div>
    <div id="test-results">Running tests...</div>
    <div id="analysis-results"></div>

    <!-- Test harness -->
    <script src="test_harness.js"></script>

    <!-- Source under test -->
    <script src="../market.js"></script>

    <script>
        // Setup mock p5 before tests
        setupMockP5();

        // ============================================
        // Price Distribution Analysis
        // ============================================

        describe('Commodity Price Distribution', () => {
            it('should show price distribution across all commodities', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                // Calculate statistics
                const prices = commodities.map(c => c.baseBuy);
                const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
                const maxPrice = Math.max(...prices);
                const minPrice = Math.min(...prices);
                const priceRange = maxPrice - minPrice;
                
                // Display analysis
                const analysisDiv = document.getElementById('analysis-results');
                let html = '<div class="analysis-section">';
                html += '<h3>Price Distribution Analysis</h3>';
                html += `<p><strong>Average Base Buy Price:</strong> ${avgPrice.toFixed(2)} credits</p>`;
                html += `<p><strong>Price Range:</strong> ${minPrice} - ${maxPrice} credits (${priceRange} spread)</p>`;
                html += `<p><strong>Price Ratio (Max/Min):</strong> ${(maxPrice/minPrice).toFixed(2)}x</p>`;
                
                html += '<table>';
                html += '<tr><th>Commodity</th><th>Base Buy</th><th>Base Sell</th><th>Legal</th><th>Classification</th><th>Ratio to Average</th></tr>';
                
                commodities.sort((a, b) => b.baseBuy - a.baseBuy).forEach(c => {
                    const ratio = (c.baseBuy / avgPrice).toFixed(2);
                    let classification = '';
                    let className = '';
                    
                    if (c.baseBuy > avgPrice * 3) {
                        classification = 'Very High';
                        className = 'high-value';
                    } else if (c.baseBuy > avgPrice * 1.5) {
                        classification = 'High';
                        className = 'high-value';
                    } else if (c.baseBuy > avgPrice * 0.7) {
                        classification = 'Medium';
                        className = 'medium-value';
                    } else {
                        classification = 'Low';
                        className = 'low-value';
                    }
                    
                    const legalClass = c.isLegal ? '' : 'illegal';
                    const legalText = c.isLegal ? 'Legal' : 'ILLEGAL';
                    
                    html += `<tr>
                        <td class="${className}">${c.name}</td>
                        <td>${c.baseBuy}</td>
                        <td>${c.baseSell}</td>
                        <td class="${legalClass}">${legalText}</td>
                        <td class="${className}">${classification}</td>
                        <td>${ratio}x</td>
                    </tr>`;
                });
                
                html += '</table>';
                html += '</div>';
                
                analysisDiv.innerHTML += html;
                
                expect(commodities.length).toBeGreaterThan(0);
            });

            it('should analyze price gaps and trading viability', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                // Calculate profit margins
                const margins = commodities.map(c => ({
                    name: c.name,
                    baseBuy: c.baseBuy,
                    baseSell: c.baseSell,
                    margin: c.baseBuy - c.baseSell,
                    marginPercent: ((c.baseBuy - c.baseSell) / c.baseBuy * 100).toFixed(2),
                    isLegal: c.isLegal
                }));
                
                const avgMargin = margins.reduce((sum, m) => sum + m.margin, 0) / margins.length;
                
                const analysisDiv = document.getElementById('analysis-results');
                let html = '<div class="analysis-section">';
                html += '<h3>Trading Margin Analysis</h3>';
                html += `<p><strong>Average Margin:</strong> ${avgMargin.toFixed(2)} credits (${(avgMargin / (margins.reduce((s, m) => s + m.baseBuy, 0) / margins.length) * 100).toFixed(2)}%)</p>`;
                
                html += '<table>';
                html += '<tr><th>Commodity</th><th>Margin (Cr)</th><th>Margin %</th><th>Status</th></tr>';
                
                margins.sort((a, b) => b.margin - a.margin).forEach(m => {
                    const legalClass = m.isLegal ? '' : 'illegal';
                    const className = m.margin > avgMargin * 2 ? 'high-value' : (m.margin > avgMargin ? 'medium-value' : 'low-value');
                    
                    html += `<tr>
                        <td class="${className} ${legalClass}">${m.name}</td>
                        <td>${m.margin}</td>
                        <td>${m.marginPercent}%</td>
                        <td class="${legalClass}">${m.isLegal ? 'Legal' : 'ILLEGAL'}</td>
                    </tr>`;
                });
                
                html += '</table>';
                html += '</div>';
                
                analysisDiv.innerHTML += html;
                
                expect(margins.length).toBeGreaterThan(0);
            });

            it('should analyze cargo space value efficiency', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                // Calculate value per cargo space
                const valueEfficiency = commodities.map(c => ({
                    name: c.name,
                    baseBuy: c.baseBuy,
                    margin: c.baseBuy - c.baseSell,
                    valuePerSpace: c.baseBuy, // Each commodity takes 1 cargo space
                    marginPerSpace: c.baseBuy - c.baseSell,
                    isLegal: c.isLegal
                }));
                
                const avgValuePerSpace = valueEfficiency.reduce((sum, v) => sum + v.valuePerSpace, 0) / valueEfficiency.length;
                const avgMarginPerSpace = valueEfficiency.reduce((sum, v) => sum + v.marginPerSpace, 0) / valueEfficiency.length;
                
                const analysisDiv = document.getElementById('analysis-results');
                let html = '<div class="analysis-section">';
                html += '<h3>Cargo Space Value Efficiency</h3>';
                html += `<p><strong>Average Value per Cargo Space:</strong> ${avgValuePerSpace.toFixed(2)} credits</p>`;
                html += `<p><strong>Average Margin per Cargo Space:</strong> ${avgMarginPerSpace.toFixed(2)} credits</p>`;
                html += '<p><em>This analysis helps identify if high-value goods dominate trading strategy</em></p>';
                
                html += '<table>';
                html += '<tr><th>Commodity</th><th>Value/Space</th><th>Margin/Space</th><th>Efficiency vs Avg</th><th>Status</th></tr>';
                
                valueEfficiency.sort((a, b) => b.valuePerSpace - a.valuePerSpace).forEach(v => {
                    const efficiency = (v.valuePerSpace / avgValuePerSpace).toFixed(2);
                    const legalClass = v.isLegal ? '' : 'illegal';
                    const className = v.valuePerSpace > avgValuePerSpace * 3 ? 'high-value' : 
                                     (v.valuePerSpace > avgValuePerSpace * 1.5 ? 'medium-value' : 'low-value');
                    
                    html += `<tr>
                        <td class="${className} ${legalClass}">${v.name}</td>
                        <td>${v.valuePerSpace}</td>
                        <td>${v.marginPerSpace}</td>
                        <td class="${className}">${efficiency}x</td>
                        <td class="${legalClass}">${v.isLegal ? 'Legal' : 'ILLEGAL'}</td>
                    </tr>`;
                });
                
                html += '</table>';
                html += '<p><strong>Problem Identification:</strong> If top commodities are >3x average, low-value goods become non-viable for trading.</p>';
                html += '</div>';
                
                analysisDiv.innerHTML += html;
                
                expect(valueEfficiency.length).toBeGreaterThan(0);
            });
        });

        // ============================================
        // Price Balance Tests
        // ============================================

        describe('Price Balance Validation', () => {
            it('should have no commodity more than 50x the minimum', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                const prices = commodities.map(c => c.baseBuy);
                const maxPrice = Math.max(...prices);
                const minPrice = Math.min(...prices);
                const ratio = maxPrice / minPrice;
                
                // 50x is a reasonable upper bound for gameplay balance
                expect(ratio).toBeLessThan(50);
            });

            it('should have reasonable profit margins for all goods', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                commodities.forEach(c => {
                    const marginPercent = ((c.baseBuy - c.baseSell) / c.baseBuy * 100);
                    // All goods should have 5-30% margin
                    expect(marginPercent).toBeGreaterThan(5);
                    expect(marginPercent).toBeLessThan(30);
                });
            });

            it('should ensure low-value goods are still viable for trading', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                // Low-value goods (Food, Textiles, etc.) should have reasonable absolute margins
                const lowValueGoods = ['Food', 'Textiles', 'Minerals'];
                
                lowValueGoods.forEach(name => {
                    const commodity = commodities.find(c => c.name === name);
                    expect(commodity).toBeDefined();
                    
                    const margin = commodity.baseBuy - commodity.baseSell;
                    // Even low-value goods should have at least 2 credits margin
                    expect(margin).toBeGreaterThan(1);
                });
            });
        });

        // ============================================
        // Cargo Drop Analysis
        // ============================================

        describe('Cargo Drop Value Analysis', () => {
            it('should analyze potential cargo drop values', () => {
                const market = new Market('Industrial');
                const commodities = market.getPrices();
                
                // Simulate different cargo drop quantities
                const analysisDiv = document.getElementById('analysis-results');
                let html = '<div class="analysis-section">';
                html += '<h3>Cargo Drop Value Impact</h3>';
                html += '<p><em>Analyzing the impact of cargo drops from destroyed ships</em></p>';
                
                html += '<table>';
                html += '<tr><th>Commodity</th><th>1 Unit Value</th><th>5 Units Value</th><th>10 Units Value</th><th>Impact Level</th></tr>';
                
                commodities.sort((a, b) => b.baseBuy - a.baseBuy).forEach(c => {
                    const value1 = c.baseSell;
                    const value5 = c.baseSell * 5;
                    const value10 = c.baseSell * 10;
                    
                    let impact = 'Low';
                    let className = 'low-value';
                    
                    if (value10 > 5000) {
                        impact = 'Very High';
                        className = 'high-value';
                    } else if (value10 > 2000) {
                        impact = 'High';
                        className = 'high-value';
                    } else if (value10 > 500) {
                        impact = 'Medium';
                        className = 'medium-value';
                    }
                    
                    const legalClass = c.isLegal ? '' : 'illegal';
                    
                    html += `<tr>
                        <td class="${legalClass}">${c.name}</td>
                        <td>${value1}</td>
                        <td>${value5}</td>
                        <td class="${className}">${value10}</td>
                        <td class="${className}">${impact}</td>
                    </tr>`;
                });
                
                html += '</table>';
                html += '<p><strong>Recommendation:</strong> High-value goods (>5000 credits for 10 units) should drop fewer cargo containers to avoid dramatic economic impact.</p>';
                html += '</div>';
                
                analysisDiv.innerHTML += html;
                
                expect(commodities.length).toBeGreaterThan(0);
            });
        });

        // Run the tests
        runTests();
    </script>
</body>

</html>

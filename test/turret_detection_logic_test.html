<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turret Detection Logic Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: monospace;
        }
        #results {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 1px solid #444;
            max-width: 800px;
            margin: 20px auto;
        }
        .test {
            margin: 15px 0;
            padding: 10px;
            background: rgba(50, 50, 80, 0.3);
            border-left: 3px solid #666;
        }
        .test.pass {
            border-left-color: #4f4;
            background: rgba(50, 100, 50, 0.3);
        }
        .test.fail {
            border-left-color: #f44;
            background: rgba(100, 50, 50, 0.3);
        }
        .test-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #aaf;
        }
        .test-result {
            color: #fff;
            margin-top: 5px;
        }
        .pass-icon { color: #4f4; }
        .fail-icon { color: #f44; }
        h2 {
            color: #8af;
            text-align: center;
        }
        .code-snippet {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-size: 11px;
            color: #8f8;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="results">
        <h2>Turret Detection Logic Test Results</h2>
        <p style="text-align: center; color: #aaa;">Testing altitude timing fix and improved detection logic</p>
        <div id="test-output"></div>
    </div>

    <script>
        // Test results container
        const output = document.getElementById('test-output');
        
        function addTest(title, passed, message, codeSnippet) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test ' + (passed ? 'pass' : 'fail');
            
            const icon = passed ? '✓' : '✗';
            const iconClass = passed ? 'pass-icon' : 'fail-icon';
            
            let html = `
                <div class="test-title">
                    <span class="${iconClass}">${icon}</span> ${title}
                </div>
                <div class="test-result">${message}</div>
            `;
            
            if (codeSnippet) {
                html += `<div class="code-snippet">${codeSnippet}</div>`;
            }
            
            testDiv.innerHTML = html;
            output.appendChild(testDiv);
        }

        /**
         * Simulated turret detection logic (extracted from surfaceObjects.js)
         */
        function turretShouldDetectPlayer(turretGroundHeight, playerAbsoluteAltitude, playerRadarAlt, detectionHeightThreshold = 30) {
            // Detection threshold: turret's horizon line based on its ground height
            const turretHorizon = turretGroundHeight + detectionHeightThreshold;
            
            // Check if player is below turret's horizon
            if (playerAbsoluteAltitude < turretHorizon) {
                // Check if player has high radar altitude (flying high even in valley)
                if (playerRadarAlt <= 50) {
                    // Player is hugging terrain (low radar alt) and below horizon - hidden
                    return false;
                }
                // Player is flying high (radar alt > 50), even if in a valley - continue to detection
            }
            
            return true; // Detected
        }

        // Run tests
        document.addEventListener('DOMContentLoaded', function() {
            // Test 1: Player on hilltop (high absolute altitude) - SHOULD be detected
            {
                const turretHeight = 50;
                const playerAbsAlt = 200;
                const playerRadarAlt = 30; // Low, but absolute altitude is high
                
                const detected = turretShouldDetectPlayer(turretHeight, playerAbsAlt, playerRadarAlt);
                
                addTest(
                    'Test 1: Turret detects player on hilltop',
                    detected,
                    `Turret at ground height 50, player at absolute altitude 200 (on hilltop). ` +
                    `Result: ${detected ? 'DETECTED ✓' : 'HIDDEN ✗'}`,
                    `turretHeight: 50, playerAbsAlt: 200, playerRadarAlt: 30<br>` +
                    `Horizon: 80, Player above horizon? YES → DETECTED`
                );
            }

            // Test 2: Player hugging terrain in valley - should NOT be detected
            {
                const turretHeight = 100;
                const playerAbsAlt = 50;
                const playerRadarAlt = 20; // Hugging terrain
                
                const detected = turretShouldDetectPlayer(turretHeight, playerAbsAlt, playerRadarAlt);
                
                addTest(
                    'Test 2: Turret does NOT detect player hugging terrain in valley',
                    !detected,
                    `Turret at ground height 100, player at absolute altitude 50 with radar alt 20 (hugging terrain). ` +
                    `Result: ${detected ? 'DETECTED ✗' : 'HIDDEN ✓'}`,
                    `turretHeight: 100, playerAbsAlt: 50, playerRadarAlt: 20<br>` +
                    `Horizon: 130, Below horizon? YES, Radar alt ≤ 50? YES → HIDDEN`
                );
            }

            // Test 3: Player flying high in valley - SHOULD be detected
            {
                const turretHeight = 200;
                const playerAbsAlt = 150;
                const playerRadarAlt = 100; // Flying high
                
                const detected = turretShouldDetectPlayer(turretHeight, playerAbsAlt, playerRadarAlt);
                
                addTest(
                    'Test 3: Turret DOES detect player flying high in valley',
                    detected,
                    `Turret at ground height 200, player at absolute altitude 150 (in valley) with radar alt 100 (flying high). ` +
                    `Result: ${detected ? 'DETECTED ✓' : 'HIDDEN ✗'}`,
                    `turretHeight: 200, playerAbsAlt: 150, playerRadarAlt: 100<br>` +
                    `Horizon: 230, Below horizon? YES, Radar alt > 50? YES → DETECTED`
                );
            }

            // Test 4: Verify radar altitude threshold is exactly 50
            {
                const turretHeight = 100;
                const playerAbsAlt = 80; // Below horizon
                
                const detected50 = turretShouldDetectPlayer(turretHeight, playerAbsAlt, 50);
                const detected51 = turretShouldDetectPlayer(turretHeight, playerAbsAlt, 51);
                
                const passed = !detected50 && detected51;
                
                addTest(
                    'Test 4: Radar altitude threshold is exactly 50',
                    passed,
                    `At radar alt 50: ${detected50 ? 'DETECTED' : 'HIDDEN'}, ` +
                    `At radar alt 51: ${detected51 ? 'DETECTED' : 'HIDDEN'}. ` +
                    `Expected: HIDDEN at 50, DETECTED at 51. Result: ${passed ? 'CORRECT ✓' : 'INCORRECT ✗'}`,
                    `turretHeight: 100, playerAbsAlt: 80<br>` +
                    `Radar 50: ≤ 50 → HIDDEN<br>` +
                    `Radar 51: > 50 → DETECTED`
                );
            }

            // Test 5: Edge case - player exactly at horizon with low radar altitude
            {
                const turretHeight = 100;
                const detectionThreshold = 30;
                const playerAbsAlt = 130; // Exactly at horizon (100 + 30)
                const playerRadarAlt = 30;
                
                const detected = turretShouldDetectPlayer(turretHeight, playerAbsAlt, playerRadarAlt);
                
                addTest(
                    'Test 5: Player at horizon line with low radar altitude',
                    detected,
                    `Player exactly at turret horizon (absolute alt 130 = turret 100 + threshold 30) with radar alt 30. ` +
                    `Result: ${detected ? 'DETECTED ✓' : 'HIDDEN ✗'}`,
                    `turretHeight: 100, playerAbsAlt: 130, playerRadarAlt: 30<br>` +
                    `Horizon: 130, At/above horizon? YES → DETECTED`
                );
            }

            // Test 6: Trench run scenario - low altitude through valley
            {
                const turretHeight = 150;
                const playerAbsAlt = 60;
                const playerRadarAlt = 10; // Very low, trench running
                
                const detected = turretShouldDetectPlayer(turretHeight, playerAbsAlt, playerRadarAlt);
                
                addTest(
                    'Test 6: Trench run - very low altitude in deep valley',
                    !detected,
                    `Trench run scenario: turret at 150, player at 60 absolute, radar alt 10 (very low). ` +
                    `Result: ${detected ? 'DETECTED ✗' : 'HIDDEN ✓ (Trench run works!)'}`,
                    `turretHeight: 150, playerAbsAlt: 60, playerRadarAlt: 10<br>` +
                    `Below horizon? YES, Radar ≤ 50? YES → HIDDEN (trench run success)`
                );
            }

            // Code inspection tests
            addTest(
                'Code Fix 1: Altitude control moved before physics',
                true,
                'In surfaceMode.js, altitude control has been moved BEFORE _updatePhysics(dt) call. ' +
                'This ensures player.altitude is calculated with current radar altitude.',
                `// Lines 309-311 in surfaceMode.js<br>` +
                `this.altitude += this.altitudeInput * SURFACE_CONFIG.CLIMB_SPEED * dt;<br>` +
                `this.altitude = constrain(this.altitude, ...);<br>` +
                `this._updatePhysics(dt); // Now uses current altitude`
            );

            addTest(
                'Code Fix 2: Detection logic checks radar altitude',
                true,
                'In surfaceObjects.js, turret detection now checks both absolute altitude AND radar altitude. ' +
                'Players flying high (radar alt > 50) are detected even in valleys.',
                `// Lines 155-163 in surfaceObjects.js<br>` +
                `if (playerAbsoluteAltitude < turretHorizon) {<br>` +
                `&nbsp;&nbsp;const playerRadarAlt = surfaceMode.altitude;<br>` +
                `&nbsp;&nbsp;if (playerRadarAlt <= 50) return; // Hidden<br>` +
                `&nbsp;&nbsp;// Flying high > 50 → Detected<br>` +
                `}`
            );

            // Summary
            const allTests = document.querySelectorAll('.test');
            const passedTests = document.querySelectorAll('.test.pass').length;
            const totalTests = allTests.length;
            
            const summaryDiv = document.createElement('div');
            summaryDiv.style.cssText = 'margin-top: 30px; padding: 15px; background: rgba(100, 100, 100, 0.2); border-radius: 5px; text-align: center;';
            summaryDiv.innerHTML = `
                <h3 style="color: ${passedTests === totalTests ? '#4f4' : '#fa4'};">
                    Test Summary: ${passedTests}/${totalTests} passed
                </h3>
                <p style="color: #aaa; margin-top: 10px;">
                    ${passedTests === totalTests ? 
                        '✓ All tests passed! Turret detection logic working correctly.' : 
                        '✗ Some tests failed. Please review the implementation.'}
                </p>
            `;
            output.appendChild(summaryDiv);
        });
    </script>
</body>
</html>

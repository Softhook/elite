        Tests for spatial partitioning (grid-based spatial hash) to optimize collision detection and entity queries.

    <script>
        // Setup mock p5 before tests
        setupMockP5();

        // Using the REAL SpatialHash from spatialHash.js
        // This ensures tests validate the actual production code
        // ============================================

        // ============================================
        // MOCK ENTITY FACTORY
        // ============================================

        function createMockEntity(x, y, size = 20) {
            return {
                pos: createVector(x, y),
                size: size,
                id: Math.random().toString(36).substr(2, 9)
            };
        }

        function createMockEntities(count, areaSize = 5000) {
            const entities = [];
            for (let i = 0; i < count; i++) {
                entities.push(createMockEntity(
                    (Math.random() - 0.5) * areaSize,
                    (Math.random() - 0.5) * areaSize,
                    20 + Math.random() * 30
                ));
            }
            return entities;
        }

        function createClusteredEntities(clusterCount, entitiesPerCluster, clusterRadius = 300) {
            const entities = [];
            for (let c = 0; c < clusterCount; c++) {
                const cx = (Math.random() - 0.5) * 5000;
                const cy = (Math.random() - 0.5) * 5000;
                for (let i = 0; i < entitiesPerCluster; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * clusterRadius;
                    entities.push(createMockEntity(
                        cx + Math.cos(angle) * dist,
                        cy + Math.sin(angle) * dist
                    ));
                }
            }
            return entities;
        }

        /**
         * Create a realistic game scenario with mixed entity types and distributions
         * Based on real game config:
         * - 15-30 enemies (clustered in combat zones)
         * - 45 asteroids (scattered + asteroid belts)
         * - 20-50 projectiles (clustered near combat)
         * - 5-15 cargo items (near destroyed ships)
         * - World size ~5000px (despawn radius)
         */
        function createRealisticGameScenario() {
            const entities = [];
            const WORLD_SIZE = 5000;

            // Simulate player at center
            const playerX = 0;
            const playerY = 0;

            // === ENEMIES (20 ships) ===
            // Combat zone 1: Near player (main battle)
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 200 + Math.random() * 600; // 200-800px from player
                entities.push({
                    pos: createVector(playerX + Math.cos(angle) * dist, playerY + Math.sin(angle) * dist),
                    size: 40 + Math.random() * 40, // Ships 40-80px
                    type: 'enemy',
                    id: 'enemy_' + i
                });
            }
            // Combat zone 2: Secondary battle (off-screen)
            const battleX = 1500, battleY = 1200;
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 400;
                entities.push({
                    pos: createVector(battleX + Math.cos(angle) * dist, battleY + Math.sin(angle) * dist),
                    size: 40 + Math.random() * 40,
                    type: 'enemy',
                    id: 'enemy_battle_' + i
                });
            }
            // Patrol ships (scattered)
            for (let i = 0; i < 6; i++) {
                entities.push({
                    pos: createVector((Math.random() - 0.5) * WORLD_SIZE, (Math.random() - 0.5) * WORLD_SIZE),
                    size: 35 + Math.random() * 30,
                    type: 'enemy',
                    id: 'patrol_' + i
                });
            }

            // === ASTEROIDS (45 total) ===
            // Asteroid belt (clustered)
            const beltCenterX = -800, beltCenterY = 500;
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 500;
                entities.push({
                    pos: createVector(beltCenterX + Math.cos(angle) * dist, beltCenterY + Math.sin(angle) * dist),
                    size: 20 + Math.random() * 80, // Asteroids 20-100px
                    type: 'asteroid',
                    id: 'asteroid_belt_' + i
                });
            }
            // Scattered asteroids
            for (let i = 0; i < 20; i++) {
                entities.push({
                    pos: createVector((Math.random() - 0.5) * WORLD_SIZE, (Math.random() - 0.5) * WORLD_SIZE),
                    size: 20 + Math.random() * 60,
                    type: 'asteroid',
                    id: 'asteroid_' + i
                });
            }

                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 500;
                entities.push({
                    pos: createVector(playerX + Math.cos(angle) * dist, playerY + Math.sin(angle) * dist),
                    size: 3 + Math.random() * 5, // Small projectiles
                    type: 'projectile',
                    id: 'proj_' + i
                });

                const dist = Math.random() * 300;
                entities.push({
                    pos: createVector(battleX + Math.cos(angle) * dist, battleY + Math.sin(angle) * dist),

                    type: 'projectile',
                    id: 'proj_battle_' + i

                    pos: createVector(playerX + (Math.random() - 0.5) * 800, playerY + (Math.random() - 0.5) * 800),

                    type: 'cargo',
                    id: 'cargo_' + i

            }

            return entities;

                const hash = new SpatialHash(200);

                hash.insert(entity);
                expect(hash.entityCount).toBe(1);
            });

                const hash = new SpatialHash(200);

                hash.insertAll(createMockEntities(10));

                hash.insert(null);
                hash.insert(undefined);
                hash.insert({});  // no pos
                expect(hash.entityCount).toBe(0);

        describe('SpatialHash - Spatial Queries', () => {

            let entities;

            beforeEach(() => {
                hash = new SpatialHash(200);
                entities = [
                    createMockEntity(0, 0),      // Center
                    createMockEntity(100, 0),   // Nearby
                    createMockEntity(150, 150), // Nearby
                    createMockEntity(1000, 1000), // Far
                    createMockEntity(-500, -500), // Far opposite
                ];
                hash.insertAll(entities);
            });

            it('should find nearby entities', () => {
                const nearby = hash.getNearby(0, 0, 200);
                // Should find entities in nearby cells (may include extras)
                expect(nearby.length).toBeGreaterThan(0);
                expect(nearby).toContain(entities[0]);
            });

            it('should not find far entities in small radius query', () => {
                const nearby = hash.getNearby(0, 0, 50);
                // Entity at (1000, 1000) should not be in nearby cells
                expect(nearby).not.toContain(entities[3]);
            });

            it('should find entities in their own cell', () => {
                const nearby = hash.getNearby(1000, 1000, 50);
                expect(nearby).toContain(entities[3]);
            });

            it('should return empty array for empty region', () => {
                const nearby = hash.getNearby(5000, 5000, 100);
                expect(nearby).toHaveLength(0);
            });

            it('should use filtered query for accurate results', () => {
                const filtered = hash.getNearbyFiltered(0, 0, 120);
                // Only entities within 120 units
                expect(filtered).toContain(entities[0]); // at 0,0
                expect(filtered).toContain(entities[1]); // at 100,0 (dist=100)
                expect(filtered).not.toContain(entities[2]); // at 150,150 (dist=~212)
            });
        });

                const hash = new SpatialHash(100);

                // Entity at (50, 50) should be in cell (0, 0)

                hash.insert(e1);

                // Entity at (350, 50) should be in cell (3, 0) - far enough to not be in adjacent cells
                const e2 = createMockEntity(350, 50);
                hash.insert(e2);

                // Query near e1 - should find e1
                const nearby1 = hash.getNearby(50, 50, 10);
                expect(nearby1).toContain(e1);

                // e2 is 3 cells away, so small radius query should not find it
                // Note: getNearby checks adjacent cells, so we need entities far apart
                expect(nearby1).not.toContain(e2);

                // Query near e2 - should find e2 but not e1
                const nearby2 = hash.getNearby(350, 50, 10);
                expect(nearby2).toContain(e2);
                expect(nearby2).not.toContain(e1);
            });

                hash.insert(e2);

                const nearby = hash.getNearby(-50, -50, 50);
                expect(nearby).toContain(e2);
                expect(nearby).not.toContain(e1);
            });

                // Entities exactly on boundaries

                const e2 = createMockEntity(0, 100);  // On Y boundary
                const e3 = createMockEntity(100, 100); // On corner

                hash.insertAll([e1, e2, e3]);
                expect(hash.entityCount).toBe(3);

                // All should be findable
                expect(hash.getNearby(100, 0, 50)).toContain(e1);
                expect(hash.getNearby(0, 100, 50)).toContain(e2);
                expect(hash.getNearby(100, 100, 50)).toContain(e3);
            });
        });

        // ============================================
        // COLLISION DETECTION CORRECTNESS TESTS
        // ============================================

        describe('Collision Detection - Brute Force vs Spatial Hash', () => {
            function bruteForceCollisionCheck(entity, allEntities, radius) {
                const results = [];
                for (const other of allEntities) {
                    if (other === entity) continue;
                    const dx = other.pos.x - entity.pos.x;
                    const dy = other.pos.y - entity.pos.y;
                    const distSq = dx * dx + dy * dy;
                    const combinedRadius = (entity.size + other.size) / 2;
                    if (distSq <= combinedRadius * combinedRadius) {
                        results.push(other);
                    }
                }
                return results;
            }

            function spatialHashCollisionCheck(entity, spatialHash, radius) {
                const nearby = spatialHash.getNearby(entity.pos.x, entity.pos.y, radius);
                const results = [];
                for (const other of nearby) {
                    if (other === entity) continue;
                    const dx = other.pos.x - entity.pos.x;
                    const dy = other.pos.y - entity.pos.y;
                    const distSq = dx * dx + dy * dy;
                    const combinedRadius = (entity.size + other.size) / 2;
                    if (distSq <= combinedRadius * combinedRadius) {
                        results.push(other);
                    }
                }
                return results;
            }

            it('should find same collisions as brute force (sparse)', () => {
                const entities = createMockEntities(50, 2000);
                const hash = new SpatialHash(200);
                hash.insertAll(entities);

                // Check a few random entities
                for (let i = 0; i < 5; i++) {
                    const testEntity = entities[Math.floor(Math.random() * entities.length)];
                    const bruteResults = bruteForceCollisionCheck(testEntity, entities, 200);
                    const hashResults = spatialHashCollisionCheck(testEntity, hash, 200);

                    // Sort by id for comparison
                    bruteResults.sort((a, b) => a.id.localeCompare(b.id));
                    hashResults.sort((a, b) => a.id.localeCompare(b.id));

                    expect(hashResults.length).toBe(bruteResults.length);
                }
            });

            it('should find same collisions as brute force (clustered)', () => {
                const entities = createClusteredEntities(5, 10, 100);
                const hash = new SpatialHash(200);
                hash.insertAll(entities);

                for (let i = 0; i < 5; i++) {
                    const testEntity = entities[Math.floor(Math.random() * entities.length)];
                    const bruteResults = bruteForceCollisionCheck(testEntity, entities, 200);
                    const hashResults = spatialHashCollisionCheck(testEntity, hash, 200);

                    bruteResults.sort((a, b) => a.id.localeCompare(b.id));
                    hashResults.sort((a, b) => a.id.localeCompare(b.id));

                    expect(hashResults.length).toBe(bruteResults.length);
                }
            });
        });

            // Warmup
            for (let i = 0; i < 10; i++) fn();

            const start = performance.now();
            for (let i = 0; i < iterations; i++) {
                fn();
            }
            const elapsed = performance.now() - start;
            return elapsed / iterations;
        }

        // ============================================
        // CELL SIZE OPTIMIZATION TESTS
        // ============================================
        describe('Cell Size Optimization', () => {
            const cellSizeResults = {};

            it('should benchmark cell size 50 (100 entities)', () => {

        // ============================================
        // REALISTIC GAME SCENARIO BENCHMARKS

        describe('Realistic Game Scenario Benchmarks', () => {
            const realisticResults = {};

            // This test simulates actual game collision detection patterns:
            // - 105 mixed entities (20 enemies, 45 asteroids, 30 projectiles, 10 cargo)
            // - Clustered distribution (combat zones, asteroid belts)
            // - REALISTIC QUERY PATTERN (based on actual game code):
            //   - 1x player collision query (130px)
            //   - 20x enemy targeting queries (600px each)
            //   - 20x enemy-asteroid collision (140px each)
            //   - 45x asteroid-asteroid collision (160px each)
            //   - 30x projectile-asteroid collision (80px each)
            //   - 30x projectile-spaceObject collision (100px each)

            function runRealisticBenchmark(cellSize) {
                const entities = createRealisticGameScenario();
                const hash = new SpatialHash(cellSize);
                hash.insertAll(entities);

                let queryCount = 0;

                // 1x Player collision query (radius 130px)
                const playerNearby = hash.getNearby(0, 0, 130);
                for (const e of playerNearby) {
                    if (e.type === 'enemy' || e.type === 'asteroid') {
                        queryCount++;
                    }
                }

                // 20x Enemy targeting queries (radius 600px each)
                // 20x Enemy-asteroid collision (radius 140px each)
                for (const e of entities) {
                    if (e.type === 'enemy') {
                        // Targeting query - large radius
                        const targets = hash.getNearby(e.pos.x, e.pos.y, 600);
                        queryCount += targets.length;

                        // Collision query - small radius
                        const collisions = hash.getNearby(e.pos.x, e.pos.y, 140);
                        queryCount += collisions.length;
                    }
                }

                // 45x Asteroid-asteroid collision (radius 160px each)
                for (const e of entities) {
                    if (e.type === 'asteroid') {
                        const nearby = hash.getNearby(e.pos.x, e.pos.y, 160);
                        queryCount += nearby.length;
                    }
                }

                // 30x Projectile collision checks (radius 80px each)
                for (const e of entities) {
                    if (e.type === 'projectile') {
                        const hits = hash.getNearby(e.pos.x, e.pos.y, 80);
                        queryCount += hits.length;
                    }
                }

                return queryCount;
            }

            it('should benchmark realistic scenario with 100px cells', () => {
                const time = benchmark('real100', () => runRealisticBenchmark(100));
                realisticResults['100px'] = time;
                expect(time).toBeGreaterThan(0);
            });

            it('should benchmark realistic scenario with 150px cells', () => {
                const time = benchmark('real150', () => runRealisticBenchmark(150));

                expect(nearby.length).toBeGreaterThanOrEqual(entities.length * 0.8);
            });

            it('should handle entities moving between cells', () => {
                const hash = new SpatialHash(100);
                const e = createMockEntity(50, 50);
                hash.insert(e);

                // Simulate movement - entity now at new position
                e.pos.x = 150;
                e.pos.y = 150;

                // Old hash data is stale - this is expected!
                // In real usage, hash is rebuilt each frame
                const nearbyOld = hash.getNearby(50, 50, 50);
                expect(nearbyOld).toContain(e); // Still in old cell

                // Rebuild hash
                hash.clear();
                hash.insert(e);

                const nearbyNew = hash.getNearby(150, 150, 50);
                expect(nearbyNew).toContain(e); // Now in new cell
            });
        });

                html += '<p>Average time per frame for collision detection:</p>';

                // Include all entity counts now
                const scenarios = ['10 entities', '25 entities', '50 entities', '100 entities', '200 entities'];

                for (const scenario of scenarios) {
                    const brute = benchmarkResults.bruteForce[scenario];
                    const hash = benchmarkResults.spatialHash[scenario];

                    if (brute && hash) {
                        const speedup = brute / hash;
                        const speedupClass = speedup > 1 ? 'speedup' : 'slower';
                        const speedupText = speedup > 1
                            ? `${speedup.toFixed(1)}x faster`
                            : `${(1 / speedup).toFixed(1)}x slower`;

                        html += `
                            <div class="metric">
                                <span class="metric-label">${scenario}</span>
                                <span class="metric-value">
                                    Brute: ${brute.toFixed(3)}ms | 
                                    Hash: ${hash.toFixed(3)}ms | 
                                    <span class="${speedupClass}">${speedupText}</span>
                                </span>
                            </div>
                        `;
                    }
                }

                // Cell size optimization results
                if (window.cellSizeResults && Object.keys(window.cellSizeResults).length > 0) {

                    html += '<p>Finding the optimal cell size for best performance:</p>';

                    const cellSizes = ['50px', '100px', '150px', '200px', '300px', '400px'];
                    let bestSize = null;
                    let bestTime = Infinity;

                    for (const size of cellSizes) {
                        const time = window.cellSizeResults[size];
                        if (time && time < bestTime) {
                            bestTime = time;
                            bestSize = size;
                        }
                    }

                    for (const size of cellSizes) {
                        const time = window.cellSizeResults[size];
                        if (time) {
                            const isBest = size === bestSize;
                            const bestMarker = isBest ? ' ⭐ BEST' : '';

                                <div class="metric">
                                    <span class="metric-label">Cell size: ${size}</span>
                                    <span class="metric-value ${isBest ? 'speedup' : ''}">

                }

                    html += '<p>Simulates actual game queries per frame: 1x player (130px), 20x enemy targeting (600px),<br>';
                    html += '20x enemy collision (140px), 45x asteroid collision (160px), 30x projectile (80px).</p>';

                    const realSizes = ['100px', '150px', '200px', '250px', '300px', '350px', '400px', '500px', '600px', '800px', '1000px', '1500px'];
                    let bestRealSize = null;
                    let bestRealTime = Infinity;

                    for (const size of realSizes) {
                        const time = window.realisticResults[size];
                        if (time && time < bestRealTime) {
                            bestRealTime = time;
                            bestRealSize = size;
                        }
                    }

                    for (const size of realSizes) {
                        const time = window.realisticResults[size];
                        if (time) {
                            const isBest = size === bestRealSize;
                            const bestMarker = isBest ? ' ⭐ RECOMMENDED' : '';
                            html += `
                                <div class="metric">
                                    <span class="metric-label">Cell size: ${size}</span>
                                    <span class="metric-value ${isBest ? 'speedup' : ''}">
                                        ${time.toFixed(3)}ms${bestMarker}
                                    </span>
                                </div>
                            `;
                        }
                    }
                }

                html += `
                    <br>
                    <p><strong>Note:</strong> Speedup increases with entity count. 
                    At 100+ entities, spatial hash is significantly faster.
                    For small entity counts (&lt;25), the overhead may negate benefits.</p>
                `;

                benchDiv.innerHTML = html;
            }, 100);

            return results;
        }

        runAllTests();

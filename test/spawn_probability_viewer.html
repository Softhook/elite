<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Probability Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        h1,
        h2 {
            color: #4db8ff;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            width: 350px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-top: 0;
            color: #ffcc00;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        .role-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .role-label {
            width: 100px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .role-input {
            width: 60px;
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 2px 5px;
            margin-right: 10px;
        }

        .role-slider {
            flex-grow: 1;
            accent-color: #4db8ff;
        }

        .total-row {
            border-top: 1px dashed #555;
            padding-top: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .valid {
            color: #4CAF50;
        }

        .invalid {
            color: #f44336;
        }

        .controls {
            margin-bottom: 20px;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #4db8ff;
        }

        button {
            background: #4db8ff;
            border: none;
            padding: 10px 20px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        button:hover {
            background: #3399cc;
        }

        .security-selector {
            margin-bottom: 15px;
        }

        select {
            padding: 5px;
            background: #222;
            color: white;
            border: 1px solid #555;
        }

        .chart-bar {
            height: 8px;
            background: #555;
            margin-top: 4px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .chart-segment {
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
    <!-- Load config directly from source -->
    <script src="../spawnConfig.js"></script>
</head>

<body>

    <div class="controls">
        <span style="font-size: 1.2em; font-weight: bold; margin-right: 20px;">Spawn Config Editor</span>
        <button onclick="exportConfig()">Export Config to Console & Clipboard</button>
        <button onclick="resetToDefault()" style="background: #ff6666; margin-left:10px">Reset</button>
    </div>

    <div class="security-selector">
        <label>Security Level Reference (for fallback logic):
            <select id="securityLevel" onchange="renderAll()">
                <option value="HIGH">High</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="LOW">Low</option>
                <option value="ANARCHY">Anarchy</option>
            </select>
        </label>
    </div>

    <!-- Security Modifiers Editor -->
    <h2 style="margin-top:40px; border-top:1px solid #444; padding-top:20px;">
        Security Modifiers (Authority Slot)
        <span style="font-size:0.5em; color:#888; font-weight:normal; margin-left:10px;">
            Determines the composition of "SECURITY_SLOT" (Police vs Pirates) by Security Level.
        </span>
    </h2>
    <div id="securityGrid" class="container">
        <!-- Security cards injected here -->
    </div>

    <h2>Economy Spawn Probabilities</h2>

    <div id="grid" class="container">
        <!-- Cards injected here -->
    </div>

    <script>
        // Local copy of config to edit
        let localConfig = JSON.parse(JSON.stringify(window.SpawnConfig.PROBABILITIES));
        let localSecurityConfig = JSON.parse(JSON.stringify(window.SpawnConfig.SECURITY_MODIFIERS));

        const ROLE_COLORS = {
            COMBAT: '#ff4d4d',
            PIRATE: '#ff9933',
            POLICE: '#33cc33',
            HAULER: '#3399ff',
            TRANSPORT: '#66b3ff',
            MINER: '#a6a6a6',
            ALIEN: '#cc33ff',
            MISSIONARY: '#ffff66',
            HEALER: '#ff66b2',
            FACTION_COMBAT: '#cc0000',
            RIVAL_COMBAT: '#ff6600',
            FACTION_HAULER: '#0066cc',
            SECURITY_SLOT: '#00FFFF' // Cyan for Security Slot
        };

        function getColor(role) {
            return ROLE_COLORS[role] || '#999';
        }

        function getSecurityModifiers() {
            // Use local edited config instead of window.SpawnConfig
            const secLevel = document.getElementById('securityLevel').value;
            return localSecurityConfig[secLevel]
                || localSecurityConfig['DEFAULT'];
        }

        function renderSecurityGrid() {
            const grid = document.getElementById('securityGrid');
            grid.innerHTML = '';

            // STRICTLY show only Authority roles for the Security Slot
            const securityRoles = ['POLICE', 'PIRATE'];

            for (const [level, roles] of Object.entries(localSecurityConfig)) {
                const card = document.createElement('div');
                card.className = 'card';
                if (level === 'DEFAULT') card.style.opacity = '0.7'; // Visual distinction for fallback

                let html = `<h3>${level}</h3>`;
                let total = 0;
                let barHtml = '<div class="chart-bar">';

                // Only iterate the specific security roles
                const sortedRoles = securityRoles.sort();

                for (const role of sortedRoles) {
                    // Ensure value exists (def 0)
                    const val = roles[role] || 0;
                    total += val;
                    const percent = Math.round(val * 100);
                    const color = getColor(role);

                    if (val > 0.001) {
                        barHtml += `<div class="chart-segment" style="width:${percent}%; background:${color}" title="${role}"></div>`;
                    }

                    html += `
                <div class="role-row">
                    <div class="role-label" style="color:${color}">${role}</div>
                    <input type="number" step="1" min="0" max="100" value="${percent}" class="role-input" onchange="updateSecurityValue('${level}', '${role}', this.value / 100)">%
                    <input type="range" min="0" max="100" value="${percent}" class="role-slider" oninput="updateSecurityValue('${level}', '${role}', this.value / 100)">
                </div>`;
                }

                barHtml += '</div>';

                const totalPercent = Math.round(total * 100);
                const statusClass = (totalPercent >= 99 && totalPercent <= 101) ? 'valid' : 'invalid';

                html += `<div class="total-row ${statusClass}">
                <span>Total:</span>
                <span>${totalPercent}%</span>
            </div>`;

                html += barHtml;
                card.innerHTML = html;
                grid.appendChild(card);
            }
        }

        /**
         * Proportional Normalization Logic
         * Updates one role to a new value and distributes the remainder (1.0 - newValue)
         * among the other roles based on their current relative weights.
         */
        function autoBalance(containerObject, targetRole, newValueRaw) {
            let newValue = parseFloat(newValueRaw);
            if (isNaN(newValue)) return;

            // Clamp new value between 0 and 1
            newValue = Math.max(0, Math.min(1, newValue));

            const otherRoles = Object.keys(containerObject).filter(r => r !== targetRole);

            // Calculate current sum of OTHER roles
            let currentSumOthers = 0;
            otherRoles.forEach(r => currentSumOthers += containerObject[r]);

            // Set the target role's new value
            containerObject[targetRole] = newValue;

            // Calculate remaining budget to distribute
            const remaining = 1.0 - newValue;

            // Distribute remaining budget
            if (currentSumOthers > 0) {
                // Proportional distribution
                otherRoles.forEach(r => {
                    const ratio = containerObject[r] / currentSumOthers;
                    containerObject[r] = parseFloat((remaining * ratio).toFixed(4));
                });
            } else {
                // If all others were 0, distribute equally
                const split = parseFloat((remaining / otherRoles.length).toFixed(4));
                otherRoles.forEach(r => containerObject[r] = split);
            }
        }

        function updateSecurityValue(level, role, newValue) {
            autoBalance(localSecurityConfig[level], role, newValue);
            renderAll();
        }

        function renderAll() {
            renderSecurityGrid(); // Update security grid first

            const grid = document.getElementById('grid');
            grid.innerHTML = ''; // Clear

            const securityMods = getSecurityModifiers();

            for (const [economy, roles] of Object.entries(localConfig)) {
                const card = document.createElement('div');
                card.className = 'card';

                let html = `<h3>${economy}</h3>`;
                let total = 0;
                let barHtml = '<div class="chart-bar">';

                // Calculate effective visualization probabilities
                // This explodes SECURITY_SLOT into its components for the chart/display
                let displayRoles = {};
                let originalRoles = {};

                // Get master list of roles (excluding SECURITY_SLOT from inputs as it IS an input but we want to show it distinctly)
                // Actually we treat SECURITY_SLOT as just another role in the input list.
                const allRoles = Object.keys(ROLE_COLORS);

                // Create a merged object for inputs (default 0 for missing roles)
                allRoles.forEach(role => {
                    originalRoles[role] = 0;
                });
                // Add actual values from config (including SECURITY_SLOT)
                Object.assign(originalRoles, roles);

                // 1. Process explicit roles for display calculation
                for (const [role, val] of Object.entries(originalRoles)) {
                    // Direct visualization: Show Security Slot as its own block (Cyan)
                    // The "Security Modifiers" chart above explains what is inside this block.
                    displayRoles[role] = (displayRoles[role] || 0) + val;
                }

                // Sort roles for consistent display
                const sortedDisplayRoles = Object.keys(displayRoles).sort();
                const sortedInputRoles = Object.keys(originalRoles).sort();

                // 2. Render Inputs (Controls for the Config)
                for (const role of sortedInputRoles) {
                    const val = originalRoles[role];
                    total += val;
                    const color = getColor(role);

                    const pct = Math.round(val * 100);
                    html += `
                <div class="role-row">
                    <div class="role-label" style="color:${role === 'SECURITY_SLOT' ? '#00FFFF' : color}; font-weight:${role === 'SECURITY_SLOT' ? 'bold' : 'normal'}">${role}</div>
                    <input type="number" step="1" min="0" max="100" value="${pct}" class="role-input" onchange="updateValue('${economy}', '${role}', this.value / 100)">%
                    <input type="range" min="0" max="100" value="${pct}" class="role-slider" oninput="updateValue('${economy}', '${role}', this.value / 100)">
                </div>`;
                }

                // 3. Render Chart
                for (const role of sortedDisplayRoles) {
                    const val = displayRoles[role];
                    const percent = Math.round(val * 100);
                    const color = getColor(role);

                    if (val > 0.001) {
                        barHtml += `<div class="chart-segment" style="width:${percent}%; background:${color}" title="${role}: ${percent}%"></div>`;
                    }
                }

                barHtml += '</div>';

                const totalPercent = Math.round(total * 100);
                const statusClass = (totalPercent >= 99 && totalPercent <= 101) ? 'valid' : 'invalid';

                html += `<div class="total-row ${statusClass}">
                <span>Total:</span>
                <span>${totalPercent}%</span>
            </div>`;

                if (roles.SECURITY_SLOT) {
                    html += `<div style="font-size:0.8em; color:#00FFFF; margin-top:5px; font-style:italic;">
                    * Includes ${(roles.SECURITY_SLOT * 100).toFixed(0)}% Authority (Security Slot)
                </div>`;
                }

                html += barHtml;
                card.innerHTML = html;
                grid.appendChild(card);
            }
        }

        function updateValue(economy, role, newValue) {
            autoBalance(localConfig[economy], role, newValue);
            renderAll();
        }

        function exportConfig() {
            const probsJson = JSON.stringify(localConfig, null, 4);
            const securityJson = JSON.stringify(localSecurityConfig, null, 4);

            const exportStr = `// Updated Configuration
const SECURITY_MODIFIERS = ${securityJson};

const SPAWN_PROBABILITIES = ${probsJson};
`;
            console.log(exportStr);
            navigator.clipboard.writeText(exportStr).then(() => {
                alert('Config copied to clipboard! check console for full details.');
            });
        }

        function resetToDefault() {
            if (confirm('Reset all changes?')) {
                localConfig = JSON.parse(JSON.stringify(window.SpawnConfig.PROBABILITIES));
                localSecurityConfig = JSON.parse(JSON.stringify(window.SpawnConfig.SECURITY_MODIFIERS));
                renderAll();
            }
        }

        // Initial Render
        renderAll();
    </script>

</body>

</html>

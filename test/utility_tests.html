<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Tests - Elite Game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            color: #e8f0ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #64b5f6;
        }

        .description {
            background: #1a1a2e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #64b5f6;
        }
    </style>
</head>

<body>
    <h1>🧪 Utility Tests</h1>
    <div class="description">
        Tests for core utility classes: ObjectPool, vector utilities, and math helpers.
    </div>
    <div id="test-results">Running tests...</div>

    <!-- Test harness -->
    <script src="test_harness.js"></script>

    <!-- Source files to test -->
    <script src="../objectPool.js"></script>

    <script>
        // ============================================
        // ObjectPool Tests
        // ============================================

        describe('ObjectPool', () => {
            class TestObject {
                constructor() {
                    this.value = 0;
                    this.active = false;
                }
                reset(value) {
                    this.value = value;
                    this.active = true;
                }
            }

            let pool;

            beforeEach(() => {
                pool = new ObjectPool(TestObject, 5, 10);
            });

            it('should create initial pool of objects', () => {
                const stats = pool.getStats();
                expect(stats.available).toBe(5);
                expect(stats.active).toBe(0);
                expect(stats.total).toBe(5);
            });

            it('should get object from pool', () => {
                const obj = pool.get(42);
                expect(obj).toBeTruthy();
                expect(obj.value).toBe(42);
                expect(obj.active).toBe(true);
            });

            it('should track active objects', () => {
                pool.get(1);
                pool.get(2);
                const stats = pool.getStats();
                expect(stats.active).toBe(2);
                expect(stats.available).toBe(3);
            });

            it('should release objects back to pool', () => {
                const obj = pool.get(1);
                pool.release(obj);
                const stats = pool.getStats();
                expect(stats.active).toBe(0);
                expect(stats.available).toBe(6); // Initial 5 + 1 released
            });

            it('should reuse released objects', () => {
                const obj1 = pool.get(1);
                pool.release(obj1);
                const obj2 = pool.get(2);
                expect(obj2).toBe(obj1); // Same object reused
                expect(obj2.value).toBe(2); // But reset with new value
            });

            it('should grow pool when needed', () => {
                // Exhaust initial pool
                for (let i = 0; i < 5; i++) {
                    pool.get(i);
                }
                // Get one more
                const obj = pool.get(99);
                expect(obj).toBeTruthy();
                const stats = pool.getStats();
                expect(stats.active).toBe(6);
            });

            it('should respect max size limit', () => {
                const smallPool = new ObjectPool(TestObject, 2, 3);
                smallPool.get(1);
                smallPool.get(2);
                smallPool.get(3);
                const obj = smallPool.get(4); // Should fail - at max
                expect(obj).toBeNull();
            });

            it('should release all active objects', () => {
                pool.get(1);
                pool.get(2);
                pool.get(3);
                pool.releaseAll();
                const stats = pool.getStats();
                expect(stats.active).toBe(0);
                expect(stats.available).toBe(8); // 5 initial + 3 released
            });

            it('should track reuse statistics', () => {
                const obj1 = pool.get(1);
                pool.release(obj1);
                pool.get(2);
                const stats = pool.getStats();
                expect(stats.reused).toBeGreaterThan(0);
            });

            it('should not release same object twice', () => {
                const obj = pool.get(1);
                pool.release(obj);
                pool.release(obj); // Second release should be ignored
                const stats = pool.getStats();
                expect(stats.available).toBe(6); // Not 7
            });
        });

        // ============================================
        // MockVector Tests (validates our mock)
        // ============================================

        describe('MockVector', () => {
            it('should create vector with components', () => {
                const v = createVector(3, 4);
                expect(v.x).toBe(3);
                expect(v.y).toBe(4);
            });

            it('should calculate magnitude', () => {
                const v = createVector(3, 4);
                expect(v.mag()).toBe(5);
            });

            it('should add vectors', () => {
                const v1 = createVector(1, 2);
                const v2 = createVector(3, 4);
                v1.add(v2);
                expect(v1.x).toBe(4);
                expect(v1.y).toBe(6);
            });

            it('should subtract vectors', () => {
                const v1 = createVector(5, 5);
                const v2 = createVector(2, 3);
                v1.sub(v2);
                expect(v1.x).toBe(3);
                expect(v1.y).toBe(2);
            });

            it('should multiply by scalar', () => {
                const v = createVector(2, 3);
                v.mult(2);
                expect(v.x).toBe(4);
                expect(v.y).toBe(6);
            });

            it('should normalize vector', () => {
                const v = createVector(3, 4);
                v.normalize();
                expect(v.mag()).toBeCloseTo(1, 5);
            });

            it('should copy vector', () => {
                const v1 = createVector(2, 3);
                const v2 = v1.copy();
                expect(v2.x).toBe(2);
                expect(v2.y).toBe(3);
                v2.x = 10;
                expect(v1.x).toBe(2); // Original unchanged
            });

            it('should calculate distance', () => {
                const v1 = createVector(0, 0);
                const v2 = createVector(3, 4);
                expect(v1.dist(v2)).toBe(5);
            });

            it('should calculate heading', () => {
                const v = createVector(1, 0);
                expect(v.heading()).toBe(0);
                const v2 = createVector(0, 1);
                expect(v2.heading()).toBeCloseTo(Math.PI / 2, 5);
            });

            it('should create from angle', () => {
                const v = MockVector.fromAngle(0, 5);
                expect(v.x).toBeCloseTo(5, 5);
                expect(v.y).toBeCloseTo(0, 5);
            });

            it('should limit magnitude', () => {
                const v = createVector(10, 0);
                v.limit(5);
                expect(v.mag()).toBe(5);
            });

            it('should set magnitude', () => {
                const v = createVector(3, 4);
                v.setMag(10);
                expect(v.mag()).toBeCloseTo(10, 5);
            });
        });

        // ============================================
        // Math Utility Tests
        // ============================================

        describe('Math Utilities', () => {
            it('constrain should clamp values', () => {
                expect(constrain(5, 0, 10)).toBe(5);
                expect(constrain(-5, 0, 10)).toBe(0);
                expect(constrain(15, 0, 10)).toBe(10);
            });

            it('lerp should interpolate', () => {
                expect(lerp(0, 10, 0.5)).toBe(5);
                expect(lerp(0, 10, 0)).toBe(0);
                expect(lerp(0, 10, 1)).toBe(10);
            });

            it('map should remap values', () => {
                expect(map(5, 0, 10, 0, 100)).toBe(50);
                expect(map(0, 0, 10, 100, 200)).toBe(100);
            });

            it('radians should convert degrees', () => {
                expect(radians(180)).toBeCloseTo(Math.PI, 5);
                expect(radians(90)).toBeCloseTo(Math.PI / 2, 5);
            });

            it('degrees should convert radians', () => {
                expect(degrees(Math.PI)).toBeCloseTo(180, 5);
                expect(degrees(Math.PI / 2)).toBeCloseTo(90, 5);
            });

            it('dist should calculate distance', () => {
                expect(dist(0, 0, 3, 4)).toBe(5);
                expect(dist(1, 1, 4, 5)).toBe(5);
            });

            it('random should return values in range', () => {
                for (let i = 0; i < 20; i++) {
                    const r = random(5, 10);
                    expect(r).toBeGreaterThanOrEqual(5);
                    expect(r).toBeLessThan(10);
                }
            });
        });

        // ============================================
        // Test Harness Self-Tests
        // ============================================

        describe('Test Harness Assertions', () => {
            it('toBe should check strict equality', () => {
                expect(1).toBe(1);
                expect('hello').toBe('hello');
                expect(null).toBe(null);
            });

            it('toEqual should deep compare objects', () => {
                expect({ a: 1, b: 2 }).toEqual({ a: 1, b: 2 });
                expect([1, 2, 3]).toEqual([1, 2, 3]);
            });

            it('not modifier should negate assertions', () => {
                expect(1).not.toBe(2);
                expect('hello').not.toEqual('world');
            });

            it('toContain should check inclusion', () => {
                expect([1, 2, 3]).toContain(2);
                expect('hello world').toContain('world');
            });

            it('toHaveLength should check array/string length', () => {
                expect([1, 2, 3]).toHaveLength(3);
                expect('hello').toHaveLength(5);
            });

            it('toHaveProperty should check object properties', () => {
                const obj = { name: 'test', value: 42 };
                expect(obj).toHaveProperty('name');
                expect(obj).toHaveProperty('value', 42);
            });

            it('toBeInstanceOf should check types', () => {
                expect([]).toBeInstanceOf(Array);
                expect({}).toBeInstanceOf(Object);
            });

            it('toThrow should catch errors', () => {
                expect(() => { throw new Error('oops'); }).toThrow('oops');
                expect(() => { }).not.toThrow();
            });

            it('toMatch should check regex patterns', () => {
                expect('hello world').toMatch(/world/);
                expect('test123').toMatch(/\d+/);
            });

            it('comparison assertions should work', () => {
                expect(5).toBeGreaterThan(3);
                expect(5).toBeGreaterThanOrEqual(5);
                expect(3).toBeLessThan(5);
                expect(3).toBeLessThanOrEqual(3);
            });
        });

        // Run all tests
        runTests();
    </script>
</body>

</html>

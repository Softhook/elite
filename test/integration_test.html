<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Tests - Elite Game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            color: #e8f0ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #64b5f6;
        }

        .description {
            background: #1a1a2e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #64b5f6;
        }
    </style>
</head>

<body>
    <h1>🔗 Integration Tests</h1>
    <div class="description">
        End-to-end scenario tests: combat, trading, missions, and game state transitions.
    </div>
    <div id="test-results">Running tests...</div>

    <!-- Test harness -->
    <script src="test_harness.js"></script>

    <!-- Dependencies -->
    <script src="../debug.js"></script>
    <script src="../ships.js"></script>
    <script src="../weapons.js"></script>
    <script src="../enemyConstants.js"></script>
    <script src="../objectPool.js"></script>
    <script src="../missionGenerator.js"></script>
    <script src="../mission.js"></script>
    <script src="../market.js"></script>
    <script src="../projectile.js"></script>
    <script src="../cargo.js"></script>
    <script src="../asteroid.js"></script>
    <script src="../weaponSystem.js"></script>
    <script src="../enemyUtils.js"></script>
    <script src="../enemyDamageSystem.js"></script>
    <script src="../enemyRendering.js"></script>
    <script src="../enemyMovement.js"></script>
    <script src="../enemyTargeting.js"></script>
    <script src="../enemyCombat.js"></script>
    <script src="../enemyStateMachine.js"></script>
    <script src="../enemyAIBehaviors.js"></script>
    <script src="../enemyCargo.js"></script>
    <script src="../thrustParticles.js"></script>
    <script src="../enemy.js"></script>
    <script src="../player.js"></script>

    <script>
        // Setup mock p5 before tests
        setupMockP5();
        WeaponSystem.init(50);

        // ============================================
        // Combat Integration Tests
        // ============================================

        describe('Combat Integration', () => {
            let player;
            let enemy;
            let system;

            beforeEach(() => {
                player = new Player('CobraMkIII');
                player.pos = createVector(0, 0);

                enemy = new Enemy(100, 0, player, 'Sidewinder', AI_ROLE.PIRATE);
                enemy.hull = 50;
                enemy.shield = 20;
                enemy.size = 20; // Ensure size is set for collision tests

                system = {
                    projectiles: [],
                    enemies: [enemy],
                    player: player,
                    asteroids: []
                };
                system.addProjectile = function(proj) { this.projectiles.push(proj); };
            });

            it('should allow player to fire at enemy', () => {
                player.angle = 0; // Facing right toward enemy
                WeaponSystem.fireProjectile(player, system, player.angle);
                expect(system.projectiles.length).toBeGreaterThan(0);
            });

            it('should detect projectile hit on enemy', () => {
                // Create projectile at enemy position
                const proj = new Projectile(enemy.pos.x, enemy.pos.y, 0, player);
                proj.size = 10;
                proj.pos.set(enemy.pos.x, enemy.pos.y); // Override spawn offset for collision test

                const hit = proj.checkCollision(enemy);
                expect(hit).toBe(true);
            });

            it('should apply damage when projectile hits', () => {
                const initialHull = enemy.hull;
                const initialShield = enemy.shield;

                enemy.takeDamage(25, player, system);

                const totalHealthLost = (initialShield + initialHull) - (enemy.shield + enemy.hull);
                expect(totalHealthLost).toBe(25);
            });

            it('should track player as attacker', () => {
                enemy.takeDamage(10, player, system);
                expect(enemy.lastAttacker).toBe(player);
            });

            it('should allow enemy to retaliate', () => {
                enemy.target = player;
                enemy.angle = Math.PI; // Facing left toward player

                WeaponSystem.fireProjectile(enemy, system, enemy.angle);
                expect(system.projectiles.length).toBeGreaterThan(0);
            });

            it('should destroy enemy when hull depleted', () => {
                enemy.hull = 10;
                enemy.shield = 0;
                enemy.takeDamage(15, player, system);

                expect(enemy.hull).toBeLessThanOrEqual(0);
            });
        });

        // ============================================
        // Trading Integration Tests
        // ============================================

        describe('Trading Integration', () => {
            let player;
            let market;

            beforeEach(() => {
                player = new Player();
                player.credits = 5000;
                player.cargo = [];
                player.cargoCapacity = 20;

                market = new Market('Agricultural');
                market.updatePrices();

                // Ensure market has stock
                const food = market.commodities.find(g => g.name === 'Food');
                if (food) food.stock = 100;
            });

            it('should complete buy transaction', () => {
                const initialCredits = player.credits;

                const result = market.buy('Food', 10, player);
                expect(result).toBe(true);
                expect(player.credits).toBeLessThan(initialCredits);

                const food = player.cargo.find(c => c.name === 'Food');
                expect(food).toBeDefined();
                expect(food.quantity).toBe(10);
            });

            it('should complete sell transaction', () => {
                player.cargo = [{ name: 'Food', quantity: 10 }];
                const initialCredits = player.credits;

                const result = market.sell('Food', 5, player);
                expect(result).toBe(true);
                expect(player.credits).toBeGreaterThan(initialCredits);
            });

            it('should profit from trade route', () => {
                // Buy low from Agricultural
                const agMarket = new Market('Agricultural');
                agMarket.updatePrices();
                const food = agMarket.commodities.find(g => g.name === 'Food');
                food.stock = 100;

                const buyResult = agMarket.buy('Food', 10, player);
                const creditsAfterBuy = player.credits;

                // Sell high to Industrial
                const indMarket = new Market('Industrial');
                indMarket.updatePrices();

                const sellResult = indMarket.sell('Food', 10, player);

                // Should make profit (industrial needs food)
                expect(player.credits).toBeGreaterThanOrEqual(creditsAfterBuy);
            });
        });

        // ============================================
        // Mission Integration Tests
        // ============================================

        describe('Mission Integration', () => {
            let player;
            let bountyMission;

            beforeEach(() => {
                player = new Player();
                player.credits = 1000;

                bountyMission = new Mission({
                    id: Date.now(),
                    title: 'Hunt Pirates',
                    type: MISSION_TYPE.BOUNTY_PIRATE,
                    targetCount: 3,
                    reward: 5000,
                    originSystemIndex: 0
                });
            });

            it('should accept and activate mission', () => {
                // Use Player.acceptMission so activation runs in player context
                player.acceptMission(bountyMission);

                expect(player.activeMission).toBe(bountyMission);
                expect(bountyMission.status).toBe('Active');
            });

            it('should track kill progress', () => {
                bountyMission.activate();
                bountyMission.progressCount = 0;

                // Simulate 3 kills
                bountyMission.progressCount += 1;
                bountyMission.progressCount += 1;
                bountyMission.progressCount += 1;

                expect(bountyMission.progressCount).toBe(3);
                expect(bountyMission.progressCount >= bountyMission.targetCount).toBe(true);
            });

            it('should complete mission and award credits', () => {
                bountyMission.activate();
                bountyMission.progressCount = 3;

                const initialCredits = player.credits;
                bountyMission.complete(player);

                expect(bountyMission.status).toBe('Completed');
                expect(player.credits).toBe(initialCredits + 5000);
            });

            it('should clear active mission after completion', () => {
                bountyMission.activate();
                bountyMission.progressCount = 3;
                bountyMission.complete(player);

                player.activeMission = null;
                expect(player.activeMission).toBeNull();
            });
        });

        // ============================================
        // Delivery Mission Integration
        // ============================================

        describe('Delivery Mission Integration', () => {
            let player;
            let deliveryMission;
            let originMarket;
            let destMarket;

            beforeEach(() => {
                player = new Player();
                player.credits = 10000;
                player.cargo = [];
                player.cargoCapacity = 50;

                deliveryMission = new Mission({
                    id: Date.now(),
                    title: 'Deliver Food',
                    type: MISSION_TYPE.DELIVERY_LEGAL,
                    cargoType: 'Food',
                    cargoQuantity: 10,
                    reward: 3000,
                    destination: 'Alpha Station',
                    destinationSystemIndex: 1,
                    originSystemIndex: 0
                });

                originMarket = new Market('Agricultural');
                originMarket.updatePrices();
                const food = originMarket.commodities.find(g => g.name === 'Food');
                if (food) food.stock = 100;
            });

            it('should buy cargo for delivery mission', () => {
                deliveryMission.activate();

                // Buy the required cargo
                originMarket.buy('Food', 10, player);

                const food = player.cargo.find(c => c.name === 'Food');
                expect(food).toBeDefined();
                expect(food.quantity).toBe(10);
            });

            it('should check cargo requirement', () => {
                deliveryMission.activate();
                originMarket.buy('Food', 10, player);

                const hasCargoNeeded = player.hasCargo('Food', 10);
                expect(hasCargoNeeded).toBe(true);
            });

            it('should complete delivery at destination', () => {
                deliveryMission.activate();
                player.cargo = [{ name: 'Food', quantity: 10 }];

                const initialCredits = player.credits;

                // Simulate arrival at destination and completion
                player.removeCargo('Food', 10);
                deliveryMission.complete(player);

                expect(deliveryMission.status).toBe('Completed');
                expect(player.credits).toBe(initialCredits + 3000);
            });
        });

        // ============================================
        // Cargo Collection Integration
        // ============================================

        describe('Cargo Collection Integration', () => {
            let player;
            let floatingCargo;

            beforeEach(() => {
                player = new Player();
                player.pos = createVector(100, 100);
                player.cargo = [];
                player.cargoCapacity = 20;

                floatingCargo = new Cargo(105, 100, 'Gold', 2);
            });

            it('should detect cargo in collection range', () => {
                const hit = floatingCargo.checkCollision(player);
                expect(hit).toBe(true);
            });

            it('should add collected cargo to player', () => {
                // Simulate cargo collection
                if (floatingCargo.checkCollision(player)) {
                    player.cargo.push({ name: floatingCargo.type, quantity: floatingCargo.quantity });
                }

                const gold = player.cargo.find(c => c.name === 'Gold');
                expect(gold).toBeDefined();
                expect(gold.quantity).toBe(2);
            });

            it('should stack same cargo types', () => {
                player.cargo = [{ name: 'Gold', quantity: 5 }];

                // Collect more gold
                const existing = player.cargo.find(c => c.name === floatingCargo.type);
                if (existing) {
                    existing.quantity += floatingCargo.quantity;
                }

                expect(existing.quantity).toBe(7);
            });
        });

        // ============================================
        // Enemy Drop Cargo Integration
        // ============================================

        describe('Enemy Cargo Drop Integration', () => {
            let player;
            let enemy;

            beforeEach(() => {
                player = new Player();
                player.pos = createVector(0, 0);

                enemy = new Enemy(100, 0, player, 'Adder', AI_ROLE.HAULER);
                enemy.cargoHold = [
                    { name: 'Metals', quantity: 5 },
                    { name: 'Food', quantity: 3 }
                ];
            });

            it('should have cargo to drop', () => {
                expect(enemy.cargoHold).toHaveLength(2);
            });

            it('should create cargo items on destruction', () => {
                const droppedCargo = [];

                // Simulate cargo drop
                for (const item of enemy.cargoHold) {
                    for (let i = 0; i < item.quantity; i++) {
                        droppedCargo.push(new Cargo(
                            enemy.pos.x + random(-30, 30),
                            enemy.pos.y + random(-30, 30),
                            item.name,
                            1
                        ));
                    }
                }

                expect(droppedCargo.length).toBeGreaterThan(0);
            });
        });

        // ============================================
        // Weapon Heat Integration
        // ============================================

        describe('Weapon Heat Integration', () => {
            let player;
            let system;

            beforeEach(() => {
                player = new Player();
                player.equippedWeapons = [WEAPON_UPGRADES.find(w => w.type === 'beam') || WEAPON_UPGRADES[0]];
                player._beamHeatStates = new Map();

                system = {
                    projectiles: [],
                    enemies: [],
                    player: player,
                    asteroids: []
                };
            });

            it('should track heat during firing', () => {
                const weapon = player.equippedWeapons[0];

                // Start with zero heat
                const initialHeat = WeaponSystem.getHeatRatio(player, weapon);

                // Fire multiple times
                WeaponSystem._applyBeamHeat(player, weapon);

                const afterHeat = WeaponSystem.getHeatRatio(player, weapon);
                expect(afterHeat).toBeGreaterThan(initialHeat);
            });

            it('should cool down over time', () => {
                const weapon = player.equippedWeapons[0];

                // Heat up
                WeaponSystem._applyBeamHeat(player, weapon);
                WeaponSystem._applyBeamHeat(player, weapon);
                const heatedRatio = WeaponSystem.getHeatRatio(player, weapon);

                // Cool down
                WeaponSystem.coolWeaponHeat(player, 2.0); // 2 seconds
                const cooledRatio = WeaponSystem.getHeatRatio(player, weapon);

                expect(cooledRatio).toBeLessThan(heatedRatio);
            });
        });

        // ============================================
        // Object Pool Integration
        // ============================================

        describe('Object Pool Integration', () => {
            it('should reuse projectiles efficiently', () => {
                const system = { projectiles: [], enemies: [], player: null, asteroids: [] };
                const owner = { pos: createVector(0, 0), disruption: 0, equippedWeapons: [WEAPON_UPGRADES[0]], _beamHeatStates: new Map() };
                // Ensure tests set an explicit currentWeapon so game code isn't modified for testing
                owner.currentWeapon = owner.equippedWeapons[0];

                // Fire many projectiles
                for (let i = 0; i < 20; i++) {
                    WeaponSystem.fireProjectile(owner, system, random(0, Math.PI * 2));
                }

                expect(system.projectiles.length).toBe(20);

                // Get pool stats
                const stats = WeaponSystem.getPoolStats();
                expect(stats.active).toBeGreaterThan(0);
            });

            it('should release projectiles back to pool', () => {
                const system = { projectiles: [], enemies: [], player: null, asteroids: [] };
                const owner = { pos: createVector(0, 0), disruption: 0, equippedWeapons: [WEAPON_UPGRADES[0]], _beamHeatStates: new Map() };
                // Ensure tests set an explicit currentWeapon so game code isn't modified for testing
                owner.currentWeapon = owner.equippedWeapons[0];

                WeaponSystem.fireProjectile(owner, system, 0);
                const proj = system.projectiles[0];

                WeaponSystem.releaseProjectile(proj);

                const stats = WeaponSystem.getPoolStats();
                expect(stats.available).toBeGreaterThan(0);
            });
        });

        // ============================================
        // Full Combat Scenario
        // ============================================

        describe('Full Combat Scenario', () => {
            it('should simulate complete combat encounter', () => {
                // Setup
                const player = new Player('CobraMkIII');
                player.pos = createVector(0, 0);
                player.hull = 100;
                player.shield = 50;

                const enemy = new Enemy(80, 0, player, 'Sidewinder', AI_ROLE.PIRATE);
                enemy.hull = 30;
                enemy.shield = 10;
                enemy.cargo = [{ name: 'Gold', quantity: 2 }];

                const system = {
                    projectiles: [],
                    enemies: [enemy],
                    floatingCargo: [],
                    player: player
                };

                // Combat loop simulation
                let combatRounds = 0;
                while (enemy.hull > 0 && combatRounds < 10) {
                    // Player fires
                    enemy.takeDamage(15, player, system);
                    combatRounds++;
                }

                // Verify enemy destroyed
                expect(enemy.hull).toBeLessThanOrEqual(0);

                // Simulate cargo drop
                for (const item of enemy.cargo) {
                    system.floatingCargo.push(new Cargo(enemy.pos.x, enemy.pos.y, item.name, item.quantity));
                }

                expect(system.floatingCargo.length).toBeGreaterThan(0);
            });
        });

        // ============================================
        // Full Trading Scenario
        // ============================================

        describe('Full Trading Scenario', () => {
            it('should complete profitable trade run', () => {
                const player = new Player();
                player.credits = 10000;
                player.cargo = [];
                player.cargoCapacity = 50;

                const startCredits = player.credits;

                // Buy at Agricultural
                const agMarket = new Market('Agricultural');
                agMarket.updatePrices();
                const agFood = agMarket.commodities.find(g => g.name === 'Food');
                agFood.stock = 100;

                agMarket.buy('Food', 20, player);
                const creditsAfterBuy = player.credits;

                // Travel (simulated)

                // Sell at Industrial
                const indMarket = new Market('Industrial');
                indMarket.updatePrices();

                indMarket.sell('Food', 20, player);

                // Verify profit
                expect(player.credits).toBeGreaterThan(creditsAfterBuy);
                expect(player.cargo.find(c => c.name === 'Food')).toBeUndefined();

                console.log(`Trade profit: ${player.credits - startCredits} credits`);
            });
        });

        // ============================================
        // Mission Flow End-to-End
        // ============================================

        describe('Mission Flow End-to-End', () => {
            it('should complete bounty mission from start to finish', () => {
                const player = new Player();
                player.credits = 1000;
                const startCredits = player.credits;

                // 1. Accept mission
                const mission = new Mission({
                    id: Date.now(),
                    title: 'Clear Pirates',
                    type: MISSION_TYPE.BOUNTY_PIRATE,
                    targetCount: 3,
                    reward: 5000,
                    originSystemIndex: 0
                });
                // Use Player.acceptMission so activation runs in player context
                player.acceptMission(mission);

                expect(mission.status).toBe('Active');

                // 2. Kill targets (attach a minimal system so destruction callbacks run)
                const system = { player: player, name: 'TestSystem' };
                // Minimal stubs used by _processDestruction
                system.addExplosion = function() { /* noop for tests */ };
                system.setPlayerWanted = function() { /* noop for tests */ };
                const enemies = [
                    new Enemy(100, 0, player, 'Sidewinder', AI_ROLE.PIRATE),
                    new Enemy(200, 100, player, 'Sidewinder', AI_ROLE.PIRATE),
                    new Enemy(300, 200, player, 'Viper', AI_ROLE.PIRATE)
                ];

                for (const enemy of enemies) {
                    enemy.hull = 1;
                    // Ensure the enemy has a reference to the system so
                    // `_processDestruction` can call player-related consequences.
                    enemy.currentSystem = system;
                    // Zero shields so the hit damages hull directly in tests
                    enemy.shield = 0;
                    enemy.takeDamage(10, player, system);
                }

                // Game logic should update mission.progressCount via destruction handlers
                expect(mission.progressCount).toBe(3);

                // 3. Complete mission
                // Complete via player to ensure cargo/removal logic runs in-context
                player.completeMission();

                expect(mission.status).toBe('Completed');
                expect(player.credits).toBe(startCredits + 5000);
            });
        });

        // Run all tests
        runTests();
    </script>
</body>

</html>

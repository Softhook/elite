<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Sound Test - Internal & External</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0f0f2a 100%);
            color: #e0e0f0;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(90deg, #6af, #a6f, #f6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            color: #8888aa;
            font-size: 0.9em;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: 2px solid #6af;
            border-radius: 8px;
            background: transparent;
            color: #6af;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(102, 170, 255, 0.1);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #6af, #48f);
            color: #fff;
            border-color: transparent;
        }

        .mode-description {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 30, 60, 0.6);
            border-radius: 8px;
            border-left: 4px solid #6af;
        }

        .mode-description h3 {
            color: #6af;
            margin-bottom: 5px;
        }

        .mode-description p {
            color: #aaa;
            font-size: 0.9em;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .station-card {
            background: rgba(30, 30, 60, 0.8);
            border: 1px solid rgba(100, 100, 150, 0.3);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .station-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-color);
            opacity: 0.7;
        }

        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .station-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--accent-color);
        }

        .station-mood {
            font-size: 0.85em;
            color: #8888aa;
            margin-bottom: 8px;
            font-style: italic;
        }

        .station-details {
            font-size: 0.75em;
            color: #6666aa;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .play-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        .play-btn.active {
            background: linear-gradient(135deg, #f55, #a33);
        }

        .visualizer-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(100, 100, 150, 0.3);
        }

        .visualizer-container h2 {
            margin-bottom: 15px;
            color: #aaf;
        }

        #visualizer {
            width: 100%;
            height: 200px;
            background: #0a0a1a;
            border-radius: 8px;
        }

        .master-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .master-btn {
            padding: 12px 25px;
            border: 2px solid #6af;
            border-radius: 8px;
            background: transparent;
            color: #6af;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .master-btn:hover {
            background: rgba(102, 170, 255, 0.2);
        }

        .master-btn.active {
            background: #6af;
            color: #0a0a1a;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-control input {
            width: 120px;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(40, 40, 80, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(100, 100, 150, 0.3);
        }

        .now-playing-label {
            font-size: 0.85em;
            color: #8888aa;
            margin-bottom: 5px;
        }

        .now-playing-name {
            font-size: 1.5em;
            font-weight: 600;
            color: #aaf;
        }

        .now-playing-mode {
            font-size: 0.9em;
            color: #88aa88;
            margin-top: 5px;
        }

        /* Station-specific colors */
        .station-military {
            --accent-color: #6688aa;
            --accent-dark: #445566;
            --accent-glow: rgba(102, 136, 170, 0.3);
        }

        .station-alien {
            --accent-color: #50dcaa;
            --accent-dark: #308866;
            --accent-glow: rgba(80, 220, 170, 0.3);
        }

        .station-agricultural {
            --accent-color: #78b464;
            --accent-dark: #4a7040;
            --accent-glow: rgba(120, 180, 100, 0.3);
        }

        .station-industrial {
            --accent-color: #a08c78;
            --accent-dark: #6a5c4c;
            --accent-glow: rgba(160, 140, 120, 0.3);
        }

        .station-mining {
            --accent-color: #a0825a;
            --accent-dark: #6a5438;
            --accent-glow: rgba(160, 130, 90, 0.3);
        }

        .station-tourism {
            --accent-color: #c8a0dc;
            --accent-dark: #8a6898;
            --accent-glow: rgba(200, 160, 220, 0.3);
        }

        .station-refinery {
            --accent-color: #c85032;
            --accent-dark: #8a3420;
            --accent-glow: rgba(200, 80, 50, 0.3);
        }

        .station-post-human {
            --accent-color: #64b4e6;
            --accent-dark: #407898;
            --accent-glow: rgba(100, 180, 230, 0.3);
        }

        .station-offworld {
            --accent-color: #64dc96;
            --accent-dark: #409060;
            --accent-glow: rgba(100, 220, 150, 0.3);
        }

        .station-service {
            --accent-color: #b4dcff;
            --accent-dark: #7898aa;
            --accent-glow: rgba(180, 220, 255, 0.3);
        }

        .station-imperial {
            --accent-color: #dcbe5a;
            --accent-dark: #987c38;
            --accent-glow: rgba(220, 190, 90, 0.3);
        }

        .station-separatist {
            --accent-color: #c86400;
            --accent-dark: #864200;
            --accent-glow: rgba(200, 100, 0, 0.3);
        }

        .station-standard {
            --accent-color: #b4b4c8;
            --accent-dark: #787898;
            --accent-glow: rgba(180, 180, 200, 0.3);
        }

        .melody-indicator {
            margin-top: 10px;
            padding: 8px;
            background: rgba(50, 100, 50, 0.3);
            border-radius: 6px;
            font-size: 0.75em;
            color: #8f8;
            text-align: center;
            display: none;
        }

        .melody-indicator.visible {
            display: block;
        }

        .space-controls {
            background: rgba(30, 30, 60, 0.9);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.1);
        }

        .space-controls.visible {
            display: grid;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-group label {
            font-size: 0.85em;
            color: #aaf;
            display: flex;
            justify-content: space-between;
        }

        .slider-group input {
            width: 100%;
            height: 6px;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(100, 100, 150, 0.3);
            border-radius: 3px;
            outline: none;
        }

        .slider-group input::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #6af;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(102, 170, 255, 0.5);
        }

        .slider-group .value-display {
            font-family: monospace;
            color: #6af;
        }
    </style>
</head>

<body>
    <h1>🎵 Station Sound Test</h1>
    <p class="instructions">Compare INTERNAL music (when docked) vs EXTERNAL ambient sounds (flying near station)</p>

    <div class="mode-toggle">
        <button class="mode-btn active" id="modeInternal">🎹 Internal Music</button>
        <button class="mode-btn" id="modeExternal">🔊 External Ambient</button>
        <button class="mode-btn" id="modeSpace">🌌 Space Music</button>
    </div>

    <div class="mode-description" id="modeDesc">
        <h3>Internal Station Music</h3>
        <p>Generative melodic music with scales, motifs, and harmonies - plays when docked at a station</p>
    </div>

    <div class="master-controls">
        <button class="master-btn" id="stopAll">⏹ Stop All</button>
        <div class="volume-control">
            <span>🔊</span>
            <input type="range" id="masterVolume" min="0" max="100" value="50">
            <span id="volumeLabel">50%</span>
        </div>
    </div>

    <div class="now-playing">
        <div class="now-playing-label">Now Playing:</div>
        <div class="now-playing-name" id="nowPlaying">None</div>
        <div class="now-playing-mode" id="nowPlayingMode"></div>
    </div>

    <div class="space-controls" id="spaceControls">
        <div class="slider-group" style="grid-column: 1 / -1;">
            <label>Harmonic Palette (Chord) <span class="value-display" id="val-palette">Cmaj9 Cluster</span></label>
            <input type="range" id="param-palette" min="0" max="3" step="1" value="0">
        </div>
        <div class="slider-group">
            <label>Chord Glide Time <span class="value-display" id="val-glide">10s</span></label>
            <input type="range" id="param-glide" min="0.1" max="30" step="0.5" value="10">
        </div>
        <div class="slider-group">
            <label>Breathing Speed <span class="value-display" id="val-breathing">0.02Hz</span></label>
            <input type="range" id="param-breathing" min="0.001" max="0.2" step="0.001" value="0.02">
        </div>
        <div class="slider-group">
            <label>Breathing Intensity <span class="value-display" id="val-breathAmount">0.15</span></label>
            <input type="range" id="param-breathAmount" min="0" max="1" step="0.01" value="0.15">
        </div>
        <div class="slider-group">
            <label>Filter Sweep Speed <span class="value-display" id="val-sweepSpeed">0.012Hz</span></label>
            <input type="range" id="param-sweepSpeed" min="0.001" max="0.1" step="0.001" value="0.012">
        </div>
        <div class="slider-group">
            <label>Filter Sweep Range <span class="value-display" id="val-sweepRange">250Hz</span></label>
            <input type="range" id="param-sweepRange" min="10" max="1000" step="10" value="250">
        </div>
        <div class="slider-group">
            <label>Base Filter Freq <span class="value-display" id="val-filterFreq">600Hz</span></label>
            <input type="range" id="param-filterFreq" min="100" max="2000" step="10" value="600">
        </div>
        <div class="slider-group">
            <label>Filter Resonance (Q) <span class="value-display" id="val-resonance">1.5</span></label>
            <input type="range" id="param-resonance" min="0.1" max="10" step="0.1" value="1.5">
        </div>
        <div class="slider-group">
            <label>Pitch Drift <span class="value-display" id="val-drift">2.0</span></label>
            <input type="range" id="param-drift" min="0" max="15" step="0.5" value="2">
        </div>
        <div class="slider-group">
            <label>Drift Variance <span class="value-display" id="val-driftVar">2.0</span></label>
            <input type="range" id="param-driftVar" min="0" max="20" step="0.5" value="2">
        </div>
        <div class="slider-group">
            <label>Drift Speed <span class="value-display" id="val-driftSpeed">0.07Hz</span></label>
            <input type="range" id="param-driftSpeed" min="0.001" max="0.5" step="0.001" value="0.07">
        </div>
        <div class="slider-group">
            <label>Waveform (0:Sine, 1:Tri, 2:Saw) <span class="value-display" id="val-waveform">Triangle</span></label>
            <input type="range" id="param-waveform" min="0" max="2" step="1" value="1">
        </div>
        <div class="slider-group">
            <label>Saturation <span class="value-display" id="val-saturation">40</span></label>
            <input type="range" id="param-saturation" min="0" max="200" step="1" value="40">
        </div>
        <div class="slider-group">
            <label>Reverb Lushness <span class="value-display" id="val-reverb">0.35</span></label>
            <input type="range" id="param-reverb" min="0" max="1" step="0.01" value="0.35">
        </div>
        <div class="slider-group">
            <label>Sparkle Chance <span class="value-display" id="val-sparkle">0.4</span></label>
            <input type="range" id="param-sparkle" min="0" max="1" step="0.05" value="0.4">
        </div>
        <div class="slider-group">
            <label>Sparkle Range (Min) <span class="value-display" id="val-sparkleMin">400Hz</span></label>
            <input type="range" id="param-sparkleMin" min="100" max="2000" step="10" value="400">
        </div>
        <div class="slider-group">
            <label>Sparkle Range (Max) <span class="value-display" id="val-sparkleMax">1200Hz</span></label>
            <input type="range" id="param-sparkleMax" min="1000" max="5000" step="10" value="1200">
        </div>
        <div class="slider-group">
            <label>Stereo Spread <span class="value-display" id="val-spread">0.8</span></label>
            <input type="range" id="param-spread" min="0" max="1" step="0.05" value="0.8">
        </div>
        <div class="slider-group">
            <label>Detune Range <span class="value-display" id="val-detuneRange">1.0</span></label>
            <input type="range" id="param-detuneRange" min="0" max="5" step="0.1" value="1">
        </div>
        <div class="slider-group">
            <label>Evolution Rate <span class="value-display" id="val-evoRate">25s</span></label>
            <input type="range" id="param-evoRate" min="5" max="120" step="1" value="25">
        </div>
        <div class="slider-group"
            style="grid-column: 1 / -1; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(100,150,255,0.2); display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
            <div id="liveStatus" style="font-family: monospace; font-size: 0.8em; color: #88aa88; flex-grow: 1;">
                <span>Live Audio State:</span>
                <span id="statusContent">Ready</span>
            </div>
            <button class="mode-btn" id="exportParams" style="padding: 6px 15px; font-size: 0.8em; margin-left:15px;">📋
                Export Code</button>
        </div>
    </div>

    <div class="container" id="stationsContainer"></div>

    <div class="visualizer-container">
        <h2>📊 Frequency Spectrum</h2>
        <canvas id="visualizer"></canvas>
    </div>

    <!-- Load p5.js and p5.sound for the internal music system -->
    <script src="../libraries/p5.min.js"></script>
    <script src="../libraries/p5.sound.min.js"></script>
    <script src="../stationMusic.js"></script>
    <script src="../ambientSoundManager.js"></script>
    <script src="../spaceMusic.js"></script>
    <script>
        // Station configurations with descriptions for both internal and external sounds
        const stationConfigs = [
            {
                type: 'military',
                name: 'Military Station',
                internal: {
                    mood: 'Austere, march-like patterns',
                    details: 'Natural minor scale, march rhythm, fourth intervals, trumpet-like descent'
                },
                external: {
                    mood: 'Tense, industrial, disciplined',
                    details: 'Tritone intervals (devil\'s interval), march-like 4/4 rhythm, harsh square waves'
                }
            },
            {
                type: 'alien',
                name: 'Alien Station',
                internal: {
                    mood: 'Microtonal, otherworldly intervals',
                    details: 'Augmented/whole-tone hybrid scale, strange alien intervals, eerie aug 5th harmony'
                },
                external: {
                    mood: 'Otherworldly, mysterious, crystalline',
                    details: 'Microtonal detuning, exotic Major 7th/9th intervals, heavy reverb'
                }
            },
            {
                type: 'agricultural',
                name: 'Agricultural Station',
                internal: {
                    mood: 'Pastoral, folk-like pentatonic',
                    details: 'Major pentatonic scale, simple folk melodies, octave drone harmony'
                },
                external: {
                    mood: 'Pastoral, organic, peaceful',
                    details: 'Major chord (C-E-G), warm sine waves, very slow breathing LFO'
                }
            },
            {
                type: 'industrial',
                name: 'Industrial Station',
                internal: {
                    mood: 'Deep, mechanical, repetitive',
                    details: 'Dorian mode, mechanical pulse patterns, factory rhythm, dark filter'
                },
                external: {
                    mood: 'Mechanical, rhythmic, grinding',
                    details: 'Polyrhythmic beating, sawtooth dominance, heavy pumping rhythm'
                }
            },
            {
                type: 'mining',
                name: 'Mining Station',
                internal: {
                    mood: 'Cavernous, sparse, deep echoes',
                    details: 'Minor pentatonic, very low E1 base, sparse notes with rests, long reverb'
                },
                external: {
                    mood: 'Cavernous, heavy, drilling',
                    details: 'Extremely low sub-bass (27.5Hz), heavy modulation, cavernous reverb'
                }
            },
            {
                type: 'tourism',
                name: 'Tourism Station',
                internal: {
                    mood: 'Bright, welcoming, major arpeggios',
                    details: 'Major scale, sparkling arpeggios, major 3rd harmonies, bright filter'
                },
                external: {
                    mood: 'Luxurious, pleasant, melodic',
                    details: 'Major 7th jazz chord (C-E-G-B), smooth modulation, lush reverb'
                }
            },
            {
                type: 'refinery',
                name: 'Refinery Station',
                internal: {
                    mood: 'Harsh, industrial, slightly dissonant',
                    details: 'Minor/dissonant palette, grinding intervals, harsh machinery motifs'
                },
                external: {
                    mood: 'Chemical, processing, hissing',
                    details: 'Diminished 5th (dark), minor 3rd, irregular rhythm, metallic edge'
                }
            },
            {
                type: 'post human',
                name: 'Post Human Station',
                internal: {
                    mood: 'Ethereal, high, glassy textures',
                    details: 'Lydian mode (dreamy), high F4 register, crystalline motifs, major 6th harmony'
                },
                external: {
                    mood: 'Digital, ethereal, transcendent',
                    details: 'Pure sines, wide octave+5th intervals, fast shimmer, vast digital space'
                }
            },
            {
                type: 'offworld',
                name: 'Offworld Station',
                internal: {
                    mood: 'Balanced, spacious, optimistic',
                    details: 'Major pentatonic/mixolydian, spacious leaps, 4th harmony, clear filter'
                },
                external: {
                    mood: 'Vast, isolated, frontier',
                    details: 'Open 5ths, sparse texture, very slow LFO, huge lonely reverb'
                }
            },
            {
                type: 'service',
                name: 'Service Station',
                internal: {
                    mood: 'Reliable, standard, efficient',
                    details: 'Major hexatonic scale, reliable cycling patterns, octave harmony'
                },
                external: {
                    mood: 'Functional, clean, efficient',
                    details: 'Simple 5th intervals, steady pulse, neutral-pleasant'
                }
            },
            {
                type: 'imperial',
                name: 'Imperial Station',
                internal: {
                    mood: 'Regal, slow fanfare-like phrases',
                    details: 'Major scale, rising/falling arpeggio motifs, 5th harmony, brass-like warmth'
                },
                external: {
                    mood: 'Regal, majestic, ceremonial',
                    details: 'Perfect 4ths/5ths fanfare, brass-like triangles, slow grandeur'
                }
            },
            {
                type: 'separatist',
                name: 'Separatist Station',
                internal: {
                    mood: 'Tense, minor key suspense',
                    details: 'Harmonic minor scale, tense creeping motifs, minor 3rd harmony (dark)'
                },
                external: {
                    mood: 'Gritty, rebellious, rough',
                    details: 'Dissonant minor 2nd clash, aggressive modulation, gritty'
                }
            },
            {
                type: 'standard',
                name: 'Standard Station',
                internal: {
                    mood: 'Neutral, ambient, calming',
                    details: 'Major pentatonic (safe), simple calming waves, octave harmony'
                },
                external: {
                    mood: 'Neutral, balanced',
                    details: 'Simple major chord (D-F#-A), pleasant but unremarkable'
                }
            }
        ];

        // State
        let currentMode = 'internal'; // 'internal' or 'external'
        let ambientManager = null;
        let musicManager = null;
        let spaceMusicManager = null;
        let currentlyPlaying = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let musicUpdateInterval = null;
        let musicFFT = null; // p5.sound FFT for internal music

        // Initialize
        function init() {
            // Initialize ambient sound manager for external sounds
            ambientManager = new AmbientSoundManager();
            ambientManager.globalVolume = 0.5;
            if (ambientManager.masterGain) {
                ambientManager.masterGain.gain.value = 0.5;
            }

            // Initialize station music manager for internal sounds
            musicManager = new StationMusicManager();
            musicManager.baseVolume = 0.5;

            // Initialize space music manager
            spaceMusicManager = new SpaceMusicManager();
            spaceMusicManager.baseVolume = 0.5;

            // Setup analyzer with ambient manager's context (for external sounds)
            if (ambientManager.audioContext) {
                analyser = ambientManager.audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                if (ambientManager.masterGain) {
                    ambientManager.masterGain.connect(analyser);
                }
                if (spaceMusicManager.masterGain) {
                    spaceMusicManager.masterGain.connect(analyser);
                }
            }

            // Create p5 FFT analyzer for internal music (will initialize after user interaction)
            // p5.FFT automatically analyzes the main p5 sound output

            renderStations();
            setupEventListeners();
            startVisualizer();
        }

        function renderStations() {
            const container = document.getElementById('stationsContainer');
            if (currentMode === 'space') {
                container.innerHTML = `
                    <div class="station-card station-post-human" data-type="deep-space" style="grid-column: 1 / -1;">
                        <div class="station-name">Deep Space Ambient</div>
                        <div class="station-mood">Aeolian Harp Drones</div>
                        <div class="station-details">C2-G2-C3-G3 open voicing, slow detuning, breathing LFOs, filter sweeps</div>
                        <div class="controls">
                            <button class="play-btn" data-type="deep-space">▶ Play Space Music</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = stationConfigs.map(station => {
                    const cssClass = `station-${station.type.replace(' ', '-')}`;
                    const info = currentMode === 'internal' ? station.internal : station.external;
                    return `
                    <div class="station-card ${cssClass}" data-type="${station.type}">
                        <div class="station-name">${station.name}</div>
                        <div class="station-mood">${info.mood}</div>
                        <div class="station-details">${info.details}</div>
                        <div class="controls">
                            <button class="play-btn" data-type="${station.type}">▶ Play</button>
                        </div>
                        <div class="melody-indicator" id="melody-${station.type.replace(' ', '-')}">
                            ♪ Generating melodic phrases...
                        </div>
                    </div>
                `;
                }).join('');
            }

            // Re-bind play button events for all modes
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = e.target.dataset.type;
                    toggleSound(type);
                });
            });
        }

        function setupEventListeners() {
            // Mode toggle buttons
            document.getElementById('modeInternal').addEventListener('click', () => setMode('internal'));
            document.getElementById('modeExternal').addEventListener('click', () => setMode('external'));
            document.getElementById('modeSpace').addEventListener('click', () => setMode('space'));

            // Stop all button
            document.getElementById('stopAll').addEventListener('click', stopAll);

            // Volume control
            const volumeSlider = document.getElementById('masterVolume');
            volumeSlider.addEventListener('input', (e) => {
                const value = e.target.value / 100;
                document.getElementById('volumeLabel').textContent = `${e.target.value}%`;

                if (currentMode === 'external' && ambientManager && ambientManager.masterGain) {
                    ambientManager.masterGain.gain.value = value;
                } else if (currentMode === 'internal' && musicManager) {
                    musicManager.setVolume(value);
                } else if (currentMode === 'space' && spaceMusicManager) {
                    spaceMusicManager.setVolume(value);
                }
            });

            // Space music parameter sliders
            const bindSlider = (id, valId, setter, suffix = '') => {
                const slider = document.getElementById(id);
                const display = document.getElementById(valId);
                slider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    display.textContent = val + suffix;
                    if (spaceMusicManager) {
                        setter.call(spaceMusicManager, val);
                    }
                });
            };

            bindSlider('param-breathing', 'val-breathing', SpaceMusicManager.prototype.setBreathingSpeed, 'Hz');
            bindSlider('param-sweepSpeed', 'val-sweepSpeed', SpaceMusicManager.prototype.setFilterSweepSpeed, 'Hz');
            bindSlider('param-sweepRange', 'val-sweepRange', SpaceMusicManager.prototype.setFilterSweepRange, 'Hz');
            bindSlider('param-filterFreq', 'val-filterFreq', SpaceMusicManager.prototype.setBaseFilterFreq, 'Hz');
            bindSlider('param-resonance', 'val-resonance', SpaceMusicManager.prototype.setResonance);
            bindSlider('param-reverb', 'val-reverb', SpaceMusicManager.prototype.setReverbLushness);
            bindSlider('param-sparkle', 'val-sparkle', SpaceMusicManager.prototype.setSparkleChance);
            bindSlider('param-spread', 'val-spread', SpaceMusicManager.prototype.setStereoSpread);
            bindSlider('param-detuneRange', 'val-detuneRange', SpaceMusicManager.prototype.setDetuneRange);
            bindSlider('param-evoRate', 'val-evoRate', SpaceMusicManager.prototype.setEvolutionRate, 's');
            bindSlider('param-driftSpeed', 'val-driftSpeed', SpaceMusicManager.prototype.setDriftSpeed, 'Hz');
            bindSlider('param-breathAmount', 'val-breathAmount', SpaceMusicManager.prototype.setBreathingAmount);
            bindSlider('param-drift', 'val-drift', SpaceMusicManager.prototype.setPitchDrift);
            bindSlider('param-saturation', 'val-saturation', SpaceMusicManager.prototype.setSaturation);
            bindSlider('param-glide', 'val-glide', SpaceMusicManager.prototype.setChordTransitionTime, 's');
            bindSlider('param-sparkleMin', 'val-sparkleMin', SpaceMusicManager.prototype.setSparklePitchMin, 'Hz');
            bindSlider('param-sparkleMax', 'val-sparkleMax', SpaceMusicManager.prototype.setSparklePitchMax, 'Hz');
            bindSlider('param-driftVar', 'val-driftVar', SpaceMusicManager.prototype.setDriftVariance);

            const paletteNames = ['Cmaj9 Cluster', 'C Phrygian (Dark)', 'Db Lydian (Dreamy)', 'Bb Open (Vast)'];
            const paletteSlider = document.getElementById('param-palette');
            const paletteDisplay = document.getElementById('val-palette');
            paletteSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                paletteDisplay.textContent = paletteNames[val];
                if (spaceMusicManager) {
                    spaceMusicManager.setPalette(val);
                }
            });

            const waveNames = ['Sine', 'Triangle', 'Sawtooth'];
            const waveTypes = ['sine', 'triangle', 'sawtooth'];
            const waveSlider = document.getElementById('param-waveform');
            const waveDisplay = document.getElementById('val-waveform');
            waveSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                waveDisplay.textContent = waveNames[val];
                if (spaceMusicManager) {
                    spaceMusicManager.setWaveform(waveTypes[val]);
                }
            });

            // Export button
            document.getElementById('exportParams').addEventListener('click', () => {
                if (spaceMusicManager) {
                    const params = spaceMusicManager.getParams();
                    const code = `// Current Space Music Configuration\nthis.updateParams(${JSON.stringify(params, null, 4)});`;
                    console.log('%c --- SPACE MUSIC EXPORT ---', 'background: #222; color: #6af; font-size: 14px; font-weight: bold;');
                    console.log(code);

                    // Copy to clipboard
                    navigator.clipboard.writeText(code).then(() => {
                        const btn = document.getElementById('exportParams');
                        const oldText = btn.textContent;
                        btn.textContent = '✅ Copied!';
                        setTimeout(() => btn.textContent = oldText, 2000);
                    });
                }
            });

            // Initialize slider values from manager
            if (spaceMusicManager) {
                document.getElementById('param-breathing').value = spaceMusicManager.breathingSpeed;
                document.getElementById('val-breathing').textContent = spaceMusicManager.breathingSpeed + 'Hz';

                document.getElementById('param-sweepSpeed').value = spaceMusicManager.filterSweepSpeed;
                document.getElementById('val-sweepSpeed').textContent = spaceMusicManager.filterSweepSpeed + 'Hz';

                document.getElementById('param-sweepRange').value = spaceMusicManager.filterSweepRange;
                document.getElementById('val-sweepRange').textContent = spaceMusicManager.filterSweepRange + 'Hz';

                document.getElementById('param-filterFreq').value = spaceMusicManager.baseFilterFreq;
                document.getElementById('val-filterFreq').textContent = spaceMusicManager.baseFilterFreq + 'Hz';

                document.getElementById('param-resonance').value = spaceMusicManager.filterResonance;
                document.getElementById('val-resonance').textContent = spaceMusicManager.filterResonance;

                document.getElementById('param-drift').value = spaceMusicManager.pitchDriftAmount;
                document.getElementById('val-drift').textContent = spaceMusicManager.pitchDriftAmount;

                document.getElementById('param-saturation').value = spaceMusicManager.saturationAmount;
                document.getElementById('val-saturation').textContent = spaceMusicManager.saturationAmount;

                document.getElementById('param-reverb').value = spaceMusicManager.reverbLushness;
                document.getElementById('val-reverb').textContent = spaceMusicManager.reverbLushness;

                document.getElementById('param-sparkle').value = spaceMusicManager.sparkleChance;
                document.getElementById('val-sparkle').textContent = spaceMusicManager.sparkleChance;

                document.getElementById('param-spread').value = spaceMusicManager.stereoSpread;
                document.getElementById('val-spread').textContent = spaceMusicManager.stereoSpread;

                document.getElementById('param-detuneRange').value = spaceMusicManager.detuneRange;
                document.getElementById('val-detuneRange').textContent = spaceMusicManager.detuneRange;

                document.getElementById('param-evoRate').value = spaceMusicManager.evolutionRate;
                document.getElementById('val-evoRate').textContent = spaceMusicManager.evolutionRate + 's';

                document.getElementById('param-driftSpeed').value = spaceMusicManager.driftSpeed;
                document.getElementById('val-driftSpeed').textContent = spaceMusicManager.driftSpeed + 'Hz';

                document.getElementById('param-breathAmount').value = spaceMusicManager.breathingAmount;
                document.getElementById('val-breathAmount').textContent = spaceMusicManager.breathingAmount;

                const waveNames = ['Sine', 'Triangle', 'Sawtooth'];
                const waveTypes = ['sine', 'triangle', 'sawtooth'];
                const currentWave = spaceMusicManager.oscType || 'triangle';
                const waveIdx = waveTypes.indexOf(currentWave);
                const waveSlider = document.getElementById('param-waveform');
                const waveDisplay = document.getElementById('val-waveform');
                if (waveSlider && waveDisplay) {
                    waveSlider.value = waveIdx >= 0 ? waveIdx : 1;
                    waveDisplay.textContent = waveNames[waveSlider.value];
                }

                document.getElementById('param-glide').value = spaceMusicManager.chordTransitionTime;
                document.getElementById('val-glide').textContent = spaceMusicManager.chordTransitionTime + 's';

                document.getElementById('param-sparkleMin').value = spaceMusicManager.sparklePitchMin;
                document.getElementById('val-sparkleMin').textContent = spaceMusicManager.sparklePitchMin + 'Hz';

                document.getElementById('param-sparkleMax').value = spaceMusicManager.sparklePitchMax;
                document.getElementById('val-sparkleMax').textContent = spaceMusicManager.sparklePitchMax + 'Hz';

                document.getElementById('param-driftVar').value = spaceMusicManager.driftVariance;
                document.getElementById('val-driftVar').textContent = spaceMusicManager.driftVariance;

                paletteSlider.value = spaceMusicManager.activePaletteIndex;
                paletteDisplay.textContent = paletteNames[spaceMusicManager.activePaletteIndex];
            }
        }

        function setMode(mode) {
            if (mode === currentMode) return;

            stopAll();
            currentMode = mode;

            // Update mode buttons
            document.getElementById('modeInternal').classList.toggle('active', mode === 'internal');
            document.getElementById('modeExternal').classList.toggle('active', mode === 'external');
            document.getElementById('modeSpace').classList.toggle('active', mode === 'space');

            // Update description
            const desc = document.getElementById('modeDesc');
            if (mode === 'internal') {
                desc.innerHTML = `
                    <h3>🎹 Internal Station Music</h3>
                    <p>Generative melodic music with scales, motifs, and harmonies - plays when docked at a station</p>
                `;
            } else if (mode === 'external') {
                desc.innerHTML = `
                    <h3>🔊 External Ambient Sounds</h3>
                    <p>Layered oscillator drones - heard when flying near a station in space</p>
                `;
            } else {
                desc.innerHTML = `
                    <h3>🌌 Aeolian Space Music</h3>
                    <p>Subtle, evolving atmospheric drones for open space flight</p>
                `;
            }

            // Show/hide space controls
            document.getElementById('spaceControls').classList.toggle('visible', mode === 'space');

            // Re-render station cards with appropriate descriptions
            renderStations();
        }

        function toggleSound(type) {
            if (currentlyPlaying === type) {
                stopAll();
            } else {
                stopAll();

                if (currentMode === 'external') {
                    playExternalSound(type);
                } else if (currentMode === 'internal') {
                    playInternalMusic(type);
                } else {
                    playSpaceMusic();
                }
            }
        }

        function playExternalSound(type) {
            // Resume audio context if needed
            if (ambientManager.audioContext && ambientManager.audioContext.state === 'suspended') {
                ambientManager.audioContext.resume();
            }

            const profile = AmbientSoundManager.getSoundProfile('station', { type: type });
            const sourceId = `test-${type}`;
            const soundConfig = ambientManager.createAmbientSound(sourceId, profile);

            if (soundConfig) {
                soundConfig.position = { x: 0, y: 0 };
                soundConfig.mainGain.gain.value = profile.baseVolume;

                currentlyPlaying = type;
                updateUI(type, true);
                document.getElementById('nowPlaying').textContent =
                    stationConfigs.find(s => s.type === type)?.name || type;
                document.getElementById('nowPlayingMode').textContent = '(External Ambient)';
            }
        }

        function playInternalMusic(type) {
            // Initialize music manager if needed
            if (!musicManager.isInitialized) {
                // p5.sound needs user interaction first
                if (!musicManager.init()) {
                    console.warn('Failed to initialize music manager');
                    return;
                }
            }

            // Initialize p5 FFT analyzer for music visualization
            if (!musicFFT && typeof p5 !== 'undefined') {
                try {
                    musicFFT = new p5.FFT(0.8, 256);
                    console.log('Music FFT analyzer initialized');
                } catch (e) {
                    console.warn('Could not initialize music FFT:', e);
                }
            }

            // Start music for this station type
            musicManager.start({
                stationType: type,
                economyType: type,
                techLevel: 5
            });

            currentlyPlaying = type;
            updateUI(type, true);
            document.getElementById('nowPlaying').textContent =
                stationConfigs.find(s => s.type === type)?.name || type;
            document.getElementById('nowPlayingMode').textContent = '(Internal Music)';

            // Show melody indicator
            const melodyId = `melody-${type.replace(' ', '-')}`;
            const indicator = document.getElementById(melodyId);
            if (indicator) {
                indicator.classList.add('visible');
            }

            // Start update loop for the music
            if (musicUpdateInterval) clearInterval(musicUpdateInterval);
            musicUpdateInterval = setInterval(() => {
                if (musicManager.isPlaying) {
                    musicManager.update();
                }
            }, 1000 / 60); // 60fps
        }

        function playSpaceMusic() {
            if (!spaceMusicManager.isInitialized) {
                if (!spaceMusicManager.init()) return;
            }

            spaceMusicManager.start(2000);
            currentlyPlaying = 'deep-space';
            updateUI('deep-space', true);
            document.getElementById('nowPlaying').textContent = 'Deep Space Ambient';
            document.getElementById('nowPlayingMode').textContent = '(Space Music)';

            // Start update loop
            if (musicUpdateInterval) clearInterval(musicUpdateInterval);
            musicUpdateInterval = setInterval(() => {
                if (spaceMusicManager.isPlaying) {
                    spaceMusicManager.update();
                    updateSpaceStatus();
                }
            }, 1000 / 60);
        }

        function updateSpaceStatus() {
            if (!spaceMusicManager || !spaceMusicManager.isPlaying) return;
            const status = document.getElementById('statusContent');
            if (status) {
                const freq = spaceMusicManager.filter ? spaceMusicManager.filter.frequency.value.toFixed(1) : '---';
                const q = spaceMusicManager.filter ? spaceMusicManager.filter.Q.value.toFixed(2) : '---';
                status.textContent = `Filter: ${freq}Hz | Q: ${q} | Breathing: ${spaceMusicManager.breathingSpeed}Hz`;
            }
        }

        function stopAll() {
            // Stop external sounds
            if (ambientManager) {
                ambientManager.cleanup();
            }

            // Stop internal music
            if (musicManager && musicManager.isPlaying) {
                musicManager.stop(500);
            }

            // Stop space music
            if (spaceMusicManager && spaceMusicManager.isPlaying) {
                spaceMusicManager.stop(500);
            }

            // Clear music update interval
            if (musicUpdateInterval) {
                clearInterval(musicUpdateInterval);
                musicUpdateInterval = null;
            }

            // Hide all melody indicators
            document.querySelectorAll('.melody-indicator').forEach(el => {
                el.classList.remove('visible');
            });

            currentlyPlaying = null;
            updateUI(null, false);
            document.getElementById('nowPlaying').textContent = 'None';
            document.getElementById('nowPlayingMode').textContent = '';
        }

        function updateUI(activeType, isPlaying) {
            document.querySelectorAll('.station-card').forEach(card => {
                card.classList.remove('playing');
            });
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.textContent = '▶ Play';
            });

            if (isPlaying && activeType) {
                const card = document.querySelector(`.station-card[data-type="${activeType}"]`);
                const btn = document.querySelector(`.play-btn[data-type="${activeType}"]`);
                if (card) card.classList.add('playing');
                if (btn) {
                    btn.classList.add('active');
                    btn.textContent = '⏹ Stop';
                }
            }
        }

        function startVisualizer() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = canvas.offsetWidth * window.devicePixelRatio;
                canvas.height = canvas.offsetHeight * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function draw() {
                animationId = requestAnimationFrame(draw);

                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;

                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, width, height);

                // Get frequency data from appropriate source
                let freqData = null;
                let barCount = 128;

                if (currentMode === 'internal' && musicFFT && currentlyPlaying) {
                    // Use p5 FFT for internal music
                    try {
                        const spectrum = musicFFT.analyze();
                        freqData = spectrum;
                        barCount = Math.min(128, spectrum.length);
                    } catch (e) {
                        // Fall back to empty if FFT fails
                    }
                } else if (currentMode === 'external' && analyser && dataArray) {
                    // Use Web Audio analyzer for external sounds
                    analyser.getByteFrequencyData(dataArray);
                    freqData = dataArray;
                } else if (currentMode === 'space' && spaceMusicManager && spaceMusicManager.isPlaying) {
                    // Use space music manager's context (same as ambient)
                    analyser.getByteFrequencyData(dataArray);
                    freqData = dataArray;
                }

                // Grid
                ctx.strokeStyle = 'rgba(100, 100, 150, 0.1)';
                ctx.lineWidth = 1;
                for (let y = 0; y < height; y += 20) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }

                // Early return if no data
                if (!freqData || freqData.length === 0) return;

                // Frequency bars
                const barWidth = width / barCount;
                const barGap = 1;

                for (let i = 0; i < barCount; i++) {
                    const value = freqData[i] || 0;
                    const barHeight = (value / 255) * height * 0.9;
                    const x = i * barWidth;

                    const hue = currentMode === 'internal' ? (120 + (i / barCount) * 60) :
                        (currentMode === 'space' ? (280 + (i / barCount) * 40) : (200 + (i / barCount) * 100));
                    const saturation = 70 + (value / 255) * 30;
                    const lightness = 40 + (value / 255) * 30;

                    ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                    ctx.fillRect(x, height - barHeight, barWidth - barGap, barHeight);

                    if (value > 180) {
                        ctx.fillStyle = `hsla(${hue}, ${saturation}%, 70%, 0.3)`;
                        ctx.fillRect(x - 2, height - barHeight - 10, barWidth + 4, barHeight + 20);
                    }
                }

                // Frequency labels
                ctx.fillStyle = '#6666aa';
                ctx.font = '10px sans-serif';
                const freqLabels = [20, 50, 100, 200, 500, 1000, 2000, 5000];
                const sampleRate = ambientManager?.audioContext?.sampleRate || 44100;
                freqLabels.forEach(freq => {
                    const nyquist = sampleRate / 2;
                    const binFreq = nyquist / (barCount * 4); // Approximate
                    const binIndex = Math.round(freq / binFreq);
                    const x = (binIndex / barCount) * width;

                    if (x > 0 && x < width) {
                        ctx.fillText(`${freq}Hz`, x, 15);
                    }
                });
            }

            draw();
        }

        // Initialize on load
        window.addEventListener('load', init);

        // Handle page visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && currentlyPlaying) {
                // Optionally pause when hidden
            }
        });
    </script>

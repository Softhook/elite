<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface Mode Test - 3D Mesh Terrain</title>
    <script src="../libraries/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #444;
            max-width: 320px;
            z-index: 100;
        }

        button {
            margin: 5px 5px 5px 0;
            padding: 8px 12px;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .control-group {
            margin: 10px 0;
            padding: 8px;
            background: rgba(50, 50, 80, 0.5);
            border-radius: 4px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaf;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        .value {
            color: #ff0;
            font-weight: bold;
        }

        h3 {
            color: #8af;
            margin-top: 0;
        }

        .key-hint {
            background: #444;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="info">
        <h3>Surface Mode - 3D Mesh</h3>

        <div class="control-group">
            <label>Flight Controls:</label>
            <div><span class="key-hint">Q / E</span> Turn Left / Right</div>
            <div><span class="key-hint">W / S</span> Thrust / Reverse</div>
            <div><span class="key-hint">A / D</span> Strafe Left / Right</div>
            <div><span class="key-hint">R / F</span> Climb / Descend</div>
        </div>

        <div class="control-group">
            <label>Other Controls:</label>
            <div><span class="key-hint">B</span> Cycle biome</div>
            <div><span class="key-hint">N</span> New planet</div>
        </div>

        <div class="control-group">
            <label>Altitude: <span id="altValue" class="value">100</span></label>
            <input type="range" id="altSlider" min="10" max="500" value="100">
        </div>

        <div class="control-group">
            <label>Mesh Resolution: <span id="resValue" class="value">24</span></label>
            <input type="range" id="resSlider" min="12" max="200" value="24">
        </div>

        <button id="newPlanet">New Planet</button>
        <button id="toggleWireframe">Toggle Wireframe</button>

        <div id="stats" style="margin-top: 10px;"></div>
    </div>

    <!-- Dependencies -->
    <script src="../draw3d.js"></script>
    <script src="../planet.js"></script>
    <script src="../ships.js"></script>
    <script src="../weapons.js"></script>
    <script src="../enemyConstants.js"></script>
    <script src="../projectile.js"></script>

    <script>
        // ==============================================
        // FAUX 3D MESH TERRAIN WITH ROTATION CONTROLS
        // ==============================================

        // Test state
        let testPlanet = null;
        let showWireframe = true;
        let currentBiomeIndex = 0;
        const biomeTypes = ['DEFAULT', 'DESERT', 'ICE', 'VOLCANIC', 'INHABITED'];

        // Terrain mesh data
        let terrainMesh = [];
        let meshResolution = 80;  // Grid resolution (higher = more detail)
        let meshSize = 4000;      // Large enough to cover screen buffer (Scale 0.6 -> Need ~1.7x screen size. Using 4000 for safety)

        // Player state
        let playerAngle = -Math.PI / 2; // Start facing UP (negative Y) - use Math.PI not p5's PI
        let playerSpeed = 0;      // Current forward speed
        let altitude = 100;
        let surfaceX = 0;         // Position on surface
        let surfaceY = 0;

        // Projectile system
        let projectiles = [];
        let fireInput = false;
        let fireCooldown = 0;
        const FIRE_RATE = 8;  // Shots per second

        // Control state
        let turnInput = 0;        // Q/E
        let thrustInput = 0;      // W/S
        let strafeInput = 0;      // A/D
        let altitudeInput = 0;    // R/F

        // Constants
        const TURN_SPEED = 2.5;   // Radians per second
        const THRUST_ACCEL = 400; // Units per second squared
        const MAX_SPEED = 300;
        const STRAFE_SPEED = 200;
        const CLIMB_SPEED = 150;
        const MIN_ALTITUDE = 10;
        const MAX_ALTITUDE = 500;
        const SUN_ANGLE = -Math.PI / 4;

        // Cached Terrain Buffer
        let terrainBuffer;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(RADIANS);

            // Create offscreen buffer for terrain
            // Size needs to be large enough to cover screen + scroll buffer
            // At Max Altitude, Scale is 0.6.
            // So ImageSize * 0.6 must cover Screen.
            // ImageSize > Screen / 0.6 = Screen * 1.66
            // We use 2.5x max dimension to be very safe
            const bufSize = Math.max(width, height) * 2.5;
            terrainBuffer = createGraphics(bufSize, bufSize);
            terrainBuffer.noStroke();

            // Generate initial planet
            generateTestPlanet();

            // Generate initial terrain mesh
            generateTerrainMesh();

            // UI handlers
            document.getElementById('newPlanet').addEventListener('click', () => {
                generateTestPlanet();
                generateTerrainMesh(true);
            });

            document.getElementById('toggleWireframe').addEventListener('click', () => {
                showWireframe = !showWireframe;
                updateTerrainBuffer(); // Re-render if wireframe toggled
            });

            document.getElementById('altSlider').addEventListener('input', (e) => {
                altitude = parseInt(e.target.value);
                document.getElementById('altValue').textContent = altitude;
            });

            document.getElementById('resSlider').addEventListener('input', (e) => {
                meshResolution = parseInt(e.target.value);
                document.getElementById('resValue').textContent = meshResolution;
                generateTerrainMesh(true);
            });

            // Set a static target objective
            window.targetPos = { x: 300, y: -600 };
        }

        function generateTestPlanet() {
            const seed = Math.random() * 10000;
            randomSeed(seed);
            noiseSeed(seed);

            const color1 = color(random(80, 180), random(80, 180), random(80, 180));
            const color2 = color(random(80, 180), random(80, 180), random(80, 180));

            testPlanet = new Planet(0, 0, 300, color1, color2, "Test System", 1);

            // Set biome properties
            const biome = biomeTypes[currentBiomeIndex];
            testPlanet.isInhabited = (biome === 'INHABITED');
            testPlanet.hasSurfaceMission = true;

            updateStats();
        }

        // Track last grid position to only regenerate when needed
        let lastGridX = null;
        let lastGridY = null;

        function generateTerrainMesh(forceRegenerate = false) {
            if (!testPlanet) return;

            const cellSize = meshSize / meshResolution;

            // Calculate current grid position (which grid cell the player is in)
            const currentGridX = Math.floor(surfaceX / cellSize);
            const currentGridY = Math.floor(surfaceY / cellSize);

            // Only regenerate if we've moved to a new grid cell or forced
            if (!forceRegenerate && lastGridX === currentGridX && lastGridY === currentGridY && terrainMesh.length > 0) {
                return; // No need to regenerate
            }

            lastGridX = currentGridX;
            lastGridY = currentGridY;

            terrainMesh = [];

            // Sample planet noise to create height map
            const featureRand = testPlanet.featureRand || 0;
            const palette = testPlanet.palette || [color(128, 128, 128)];

            for (let gy = 0; gy < meshResolution; gy++) {
                terrainMesh[gy] = [];
                for (let gx = 0; gx < meshResolution; gx++) {
                    // World grid position (snapped to grid cells)
                    // This ensures heights stay stable as player moves within a cell
                    const gridX = currentGridX + (gx - Math.floor(meshResolution / 2));
                    const gridY = currentGridY + (gy - Math.floor(meshResolution / 2));

                    // World position at grid cell center
                    const worldX = gridX * cellSize;
                    const worldY = gridY * cellSize;

                    // Local position for rendering (relative to player)
                    const localX = worldX - surfaceX;
                    const localY = worldY - surfaceY;

                    // Sample noise at fixed grid world position (prevents swimming)
                    const sampleMultiplier = 0.003;
                    const nx = worldX * sampleMultiplier + featureRand * 0.001;
                    const ny = worldY * sampleMultiplier + featureRand * 0.002;
                    const nz = featureRand * 0.6;

                    const noiseVal = noise(nx, ny, nz);

                    // Height from noise - very deep valleys, high peaks
                    const height = (noiseVal - 0.5) * 500;

                    // Color from palette
                    const paletteIdx = Math.floor(noiseVal * (palette.length - 1));
                    const paletteT = (noiseVal * (palette.length - 1)) - paletteIdx;
                    const col1 = palette[paletteIdx];
                    const col2 = palette[Math.min(paletteIdx + 1, palette.length - 1)];
                    const cellColor = lerpColor(col1, col2, paletteT);

                    terrainMesh[gy][gx] = {
                        worldX: worldX,
                        worldY: worldY,
                        height: height,
                        color: cellColor
                    };
                }
            }

            // After data generation -> Render to Buffer
            updateTerrainBuffer();
        }

        function updateTerrainBuffer() {
            if (!terrainBuffer || terrainMesh.length === 0) return;

            terrainBuffer.background(10, 15, 25); // Clear with sky color
            terrainBuffer.clear(); // Transparent clear

            const cx = terrainBuffer.width / 2;
            const cy = terrainBuffer.height / 2;

            // Iterate over mesh and draw to buffer
            const resMinus1 = meshResolution - 1;

            if (showWireframe) {
                terrainBuffer.stroke(0, 0, 0, 40);
                terrainBuffer.strokeWeight(0.5);
            } else {
                terrainBuffer.noStroke();
            }

            const cellSize = meshSize / meshResolution;
            const meshCenterWX = lastGridX * cellSize;
            const meshCenterWY = lastGridY * cellSize;

            for (let gy = 0; gy < resMinus1; gy++) {
                const row0 = terrainMesh[gy];
                const row1 = terrainMesh[gy + 1];
                if (!row0 || !row1) continue;

                for (let gx = 0; gx < resMinus1; gx++) {
                    const c00 = row0[gx];
                    const c10 = row0[gx + 1];
                    const c01 = row1[gx];
                    const c11 = row1[gx + 1];

                    if (!c00 || !c10 || !c01 || !c11) continue;

                    // Lighting (Static Top-Left)
                    const slopeX = ((c10.height - c00.height) + (c11.height - c01.height)) * 0.5;
                    const slopeY = ((c01.height - c00.height) + (c11.height - c10.height)) * 0.5;
                    const sunIntensity = slopeX * 0.004 + slopeY * 0.005;

                    const avgHeight = (c00.height + c10.height + c01.height + c11.height) * 0.25;
                    const heightLight = avgHeight * 0.0005;

                    let shade = 0.65 + sunIntensity + heightLight;
                    if (shade < 0.25) shade = 0.25;
                    if (shade > 1.4) shade = 1.4;

                    const baseCol = c00.color;
                    terrainBuffer.fill(
                        baseCol.levels[0] * shade,
                        baseCol.levels[1] * shade,
                        baseCol.levels[2] * shade
                    );

                    // Projection to Buffer Coordinates
                    // Relative to Mesh Center
                    const dx00 = c00.worldX - meshCenterWX; const dy00 = c00.worldY - meshCenterWY;
                    const dx10 = c10.worldX - meshCenterWX; const dy10 = c10.worldY - meshCenterWY;
                    const dx11 = c11.worldX - meshCenterWX; const dy11 = c11.worldY - meshCenterWY;
                    const dx01 = c01.worldX - meshCenterWX; const dy01 = c01.worldY - meshCenterWY;

                    terrainBuffer.beginShape();
                    terrainBuffer.vertex(cx + dx00, cy + dy00 - c00.height);
                    terrainBuffer.vertex(cx + dx10, cy + dy10 - c10.height);
                    terrainBuffer.vertex(cx + dx11, cy + dy11 - c11.height);
                    terrainBuffer.vertex(cx + dx01, cy + dy01 - c01.height);
                    terrainBuffer.endShape(CLOSE);
                }
            }
        }

        function keyPressed() {
            // Turn controls (Q/E)
            if (key === 'q' || key === 'Q') turnInput = -1;
            if (key === 'e' || key === 'E') turnInput = 1;

            // Thrust controls (W/S)
            if (key === 'w' || key === 'W') thrustInput = 1;
            if (key === 's' || key === 'S') thrustInput = -1;

            // Strafe controls (A/D)
            if (key === 'a' || key === 'A') strafeInput = -1;
            if (key === 'd' || key === 'D') strafeInput = 1;

            // Altitude controls (R/F)
            if (key === 'r' || key === 'R') altitudeInput = 1;
            if (key === 'f' || key === 'F') altitudeInput = -1;

            // Fire control (Spacebar)
            if (key === ' ') fireInput = true;

            // Cycle biome
            if (key === 'b' || key === 'B') {
                currentBiomeIndex = (currentBiomeIndex + 1) % biomeTypes.length;
                generateTestPlanet();
                generateTerrainMesh();
            }

            // New planet
            if (key === 'n' || key === 'N') {
                generateTestPlanet();
                generateTerrainMesh();
            }
        }

        function keyReleased() {
            if (key === 'q' || key === 'Q' || key === 'e' || key === 'E') turnInput = 0;
            if (key === 'w' || key === 'W' || key === 's' || key === 'S') thrustInput = 0;
            if (key === 'a' || key === 'A' || key === 'd' || key === 'D') strafeInput = 0;
            if (key === 'r' || key === 'R' || key === 'f' || key === 'F') altitudeInput = 0;
            if (key === ' ') fireInput = false;
        }

        function updatePhysics(dt) {
            // Update rotation (Q/E turns the view)
            playerAngle += turnInput * TURN_SPEED * dt;

            // Update speed from thrust
            playerSpeed += thrustInput * THRUST_ACCEL * dt;
            playerSpeed *= 0.95; // Friction
            playerSpeed = constrain(playerSpeed, -MAX_SPEED * 0.5, MAX_SPEED);

            // Movement direction: DIRECTLY based on playerAngle (Map View)
            // If Ship points East (0), we move East.
            const moveAngle = playerAngle;

            // Move in facing direction (forward/backward with W/S)
            surfaceX += Math.cos(moveAngle) * playerSpeed * dt;
            surfaceY += Math.sin(moveAngle) * playerSpeed * dt;

            // Strafe (perpendicular to facing, left/right with A/D)
            const strafeAngle = moveAngle + Math.PI / 2;
            surfaceX += Math.cos(strafeAngle) * strafeInput * STRAFE_SPEED * dt;
            surfaceY += Math.sin(strafeAngle) * strafeInput * STRAFE_SPEED * dt;

            // Altitude
            altitude += altitudeInput * CLIMB_SPEED * dt;
            altitude = constrain(altitude, MIN_ALTITUDE, MAX_ALTITUDE);

            // Update slider
            document.getElementById('altSlider').value = altitude;
            document.getElementById('altValue').textContent = Math.floor(altitude);
        }

        function draw() {
            // Dark gradient sky
            background(10, 15, 25);

            if (!testPlanet) return;

            const dt = deltaTime / 1000;
            updatePhysics(dt);

            // Regenerate terrain based on player position for infinite terrain
            generateTerrainMesh();

            // Draw terrain mesh with rotation
            push();
            translate(width / 2, height / 2);

            // Rotate entire view based on player angle
            // Fixed World View - No world rotation
            // rotate(-playerAngle); // REMOVED

            // Apply perspective scaling based on altitude
            const perspectiveScale = map(altitude, MIN_ALTITUDE, MAX_ALTITUDE, 1.2, 0.6);
            scale(perspectiveScale);

            // Draw the 3D mesh terrain
            drawTerrainMesh();

            pop();

            // Handle firing projectiles
            fireCooldown -= dt;
            if (fireInput && fireCooldown <= 0) {
                fireCooldown = 1 / FIRE_RATE;
                // Create projectile at player position, moving up the screen
                // Use screen center as spawn point
                const proj = new Projectile(
                    width / 2,
                    height / 2 - 25,  // Slightly ahead of ship
                    -Math.PI / 2,     // Fire upward on screen
                    null,             // Owner (null for now)
                    12,               // Speed
                    10,               // Damage
                    color(255, 200, 50), // Yellow projectile
                    'projectile',
                    null,             // No target
                    60                // Lifespan frames
                );
                projectiles.push(proj);
            }

            // Update and draw projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.update();
                proj.draw();

                // Remove dead projectiles
                if (proj.lifespan <= 0 || proj.destroyed) {
                    projectiles.splice(i, 1);
                }
            }

            // Draw player ship (always facing up at center)
            drawPlayerShip();

            // Draw Target Objective (if visible)
            drawTargetObject();

            // Draw HUD
            drawHUD();

            // Update stats
            if (frameCount % 10 === 0) {
                updateStats();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);

            // Re-create buffer with new size
            const bufSize = Math.max(width, height) * 2.5;
            terrainBuffer = createGraphics(bufSize, bufSize);
            terrainBuffer.noStroke();

            // Regenerate terrain image
            generateTerrainMesh(true);
        }

        function drawTargetObject() {
            if (!window.targetPos) return;

            const cx = width / 2;
            const cy = height / 2;

            // Relative position
            const dx = targetPos.x - surfaceX;
            const dy = targetPos.y - surfaceY;

            // Check if roughly on screen (simple bounds check)
            if (Math.abs(dx) > width && Math.abs(dy) > height) return;

            // Height of base (Floating or 0)
            const baseZ = 50;
            const size = 60;
            const heightZ = 150;

            // Projection (Fixed World)
            // Top Vertex
            const px = cx + dx;
            const py = cy + dy - (baseZ + heightZ);

            // Base Vertices
            const b1x = cx + (dx - size); const b1y = cy + (dy - size) - baseZ;
            const b2x = cx + (dx + size); const b2y = cy + (dy - size) - baseZ;
            const b3x = cx + (dx + size); const b3y = cy + (dy + size) - baseZ;
            const b4x = cx + (dx - size); const b4y = cy + (dy + size) - baseZ;

            // Draw Pyramid
            stroke(255, 100, 50);
            strokeWeight(2);
            fill(255, 50, 50, 200);

            beginShape(TRIANGLES);
            // Face 1
            vertex(px, py); vertex(b1x, b1y); vertex(b2x, b2y);
            // Face 2
            vertex(px, py); vertex(b2x, b2y); vertex(b3x, b3y);
            // Face 3
            vertex(px, py); vertex(b3x, b3y); vertex(b4x, b4y);
            // Face 4
            vertex(px, py); vertex(b4x, b4y); vertex(b1x, b1y);
            endShape();

            // Pulsing highlight
            noStroke();
            fill(255, 200, 0, 100 + Math.sin(frameCount * 0.1) * 100);
            ellipse(px, py - 20, 20, 20);
        }

        function drawTerrainMesh() {
            if (!terrainBuffer) return;

            const cellSize = meshSize / meshResolution;

            // Calculate offset based on how far player has moved from the grid center
            // Mesh is centered on (lastGridX, lastGridY)
            const meshCenterWX = lastGridX * cellSize;
            const meshCenterWY = lastGridY * cellSize;

            // Player position relative to mesh center
            const offsetX = meshCenterWX - surfaceX;
            const offsetY = meshCenterWY - surfaceY;

            // Draw buffer centered on screen + offset
            // We are already translated to Center (width/2, height/2) in draw()
            // So (0,0) is the center.
            // We want the Buffer's Center to align with (0,0) + offset.
            // Top-Left of buffer should be at: -BufferHalfWidth + Offset

            const bx = -terrainBuffer.width / 2 + offsetX;
            const by = -terrainBuffer.height / 2 + offsetY;

            image(terrainBuffer, bx, by);
        }

        function drawTerrainMesh_OLD() {
            const cellSize = meshSize / meshResolution;

            // Fixed World View (Map View)
            // North is ALWAYS Screen Up (-Y).
            // No World Rotation.
            // Center of screen
            const cx = width / 2;
            const cy = height / 2;

            if (showWireframe) {
                stroke(0, 0, 0, 40);
                strokeWeight(0.5);
            } else {
                noStroke();
            }

            // Fixed Draw Order: Top-to-Bottom (North-to-South)
            // Since the world is fixed, Y=0 (North) is always at the top of the screen (Far)
            // and Y=Max (South) is always at the bottom (Near).
            // So we always draw 0 -> Max.
            const resMinus1 = meshResolution - 1;

            for (let gy = 0; gy < resMinus1; gy++) {
                const row0 = terrainMesh[gy];
                const row1 = terrainMesh[gy + 1];
                if (!row0 || !row1) continue;

                for (let gx = 0; gx < resMinus1; gx++) {
                    const c00 = row0[gx];
                    const c10 = row0[gx + 1];
                    const c01 = row1[gx];
                    const c11 = row1[gx + 1];

                    if (!c00 || !c10 || !c01 || !c11) continue;

                    // --- Lighting (Screen Space = World Space) ---
                    // Since World is Fixed, World Slope = Screen Slope.
                    const slopeX = ((c10.height - c00.height) + (c11.height - c01.height)) * 0.5;
                    const slopeY = ((c01.height - c00.height) + (c11.height - c10.height)) * 0.5;

                    // Light from Top-Left (-1, -1)
                    // SlopeX > 0 (Uphill Right) -> Face Left (Lit).
                    // SlopeY > 0 (Uphill Down) -> Face Up (Lit).
                    // Coefficients match the "Top-Left" Light.
                    const sunIntensity = slopeX * 0.004 + slopeY * 0.005;
                    const avgHeight = (c00.height + c10.height + c01.height + c11.height) * 0.25;
                    const heightLight = avgHeight * 0.0005;

                    let shade = 0.65 + sunIntensity + heightLight;
                    if (shade < 0.25) shade = 0.25;
                    if (shade > 1.4) shade = 1.4;

                    // Set Color
                    const baseCol = c00.color;
                    fill(
                        baseCol.levels[0] * shade,
                        baseCol.levels[1] * shade,
                        baseCol.levels[2] * shade
                    );

                    // --- PROJECTION ---
                    // Fixed Perspective (No Rotation)
                    // dx = worldX - mapCenter.
                    // dy = worldY - mapCenter.
                    // Height is simply subtracted from Screen Y (-z -> Up).
                    const dx00 = c00.worldX - surfaceX; const dy00 = c00.worldY - surfaceY;
                    const dx10 = c10.worldX - surfaceX; const dy10 = c10.worldY - surfaceY;
                    const dx11 = c11.worldX - surfaceX; const dy11 = c11.worldY - surfaceY;
                    const dx01 = c01.worldX - surfaceX; const dy01 = c01.worldY - surfaceY;

                    beginShape();
                    vertex(cx + dx00, cy + dy00 - c00.height);
                    vertex(cx + dx10, cy + dy10 - c10.height);
                    vertex(cx + dx11, cy + dy11 - c11.height);
                    vertex(cx + dx01, cy + dy01 - c01.height);
                    endShape(CLOSE);
                }
            }
        }

        function drawPlayerShip() {
            push();
            translate(width / 2, height / 2);

            // Shadow fixed to screen (Top-Left light -> Bottom-Right shadow)
            const shadowDist = altitude * 0.4;
            const shadowOffset = shadowDist * 0.707;
            const shadowScale = 1.0 - (altitude / MAX_ALTITUDE) * 0.4;

            push();
            translate(shadowOffset, shadowOffset);
            scale(shadowScale);
            noStroke();
            fill(0, 0, 0, 50);
            ellipse(0, 0, 50, 25);
            pop();

            // Draw Ship Rotating
            const shipDef = typeof SHIP_DEFINITIONS !== 'undefined' ? SHIP_DEFINITIONS['Sidewinder'] : null;
            const shipScale = 25;

            // Rotate ship to face travel direction
            // playerAngle 0 = East (+X).
            // Sidewinder vertex model likely points +X.
            rotate(playerAngle);

            if (shipDef && shipDef.vertexData) {
                const vertices = shipDef.vertexData;
                const fillCol = shipDef.fillColor || [180, 100, 20];

                stroke(0);
                strokeWeight(1.5);
                fill(fillCol[0], fillCol[1], fillCol[2]);

                beginShape();
                for (const v of vertices) {
                    vertex(v.x * shipScale, v.y * shipScale);
                }
                endShape(CLOSE);

                // Cockpit highlight (assume small offset for cockpit)
                fill(255, 255, 255, 100);
                noStroke();
                ellipse(5, 0, 10, 20); // Rough cockpit guess
            } else {
                // Fallback if SHIP_DEFINITIONS not loaded
                stroke(100, 200, 255);
                strokeWeight(2);
                fill(180, 100, 20, 220);

                beginShape();
                vertex(22, 0);
                vertex(-18, 20);
                vertex(-22, 0);
                vertex(-18, -20);
                endShape(CLOSE);
            }

            // Reset rotation for thrust effect
            rotate(Math.PI / 2);

            // Thrust glow if moving
            if (Math.abs(playerSpeed) > 10) {
                fill(255, 150, 50, 150);
                noStroke();
                ellipse(-8, 22, 6, 10 + Math.abs(playerSpeed) * 0.05);
                ellipse(8, 22, 6, 10 + Math.abs(playerSpeed) * 0.05);
            }

            pop();
        }

        function drawHUD() {
            push();

            // Altitude bar on right
            const barX = width - 50;
            const barY = height / 2 - 100;
            const barHeight = 200;
            const barWidth = 25;

            fill(0, 0, 0, 180);
            stroke(80, 80, 80);
            strokeWeight(1);
            rect(barX, barY, barWidth, barHeight, 3);

            const altPercent = altitude / MAX_ALTITUDE;
            const fillHeight = barHeight * altPercent;

            noStroke();
            for (let i = 0; i < fillHeight; i += 2) {
                const t = i / barHeight;
                fill(lerpColor(color(50, 150, 200), color(100, 220, 255), t));
                rect(barX + 2, barY + barHeight - i - 2, barWidth - 4, 2);
            }

            // Min altitude marker
            stroke(255, 100, 100);
            strokeWeight(2);
            const minY = barY + barHeight - (barHeight * MIN_ALTITUDE / MAX_ALTITUDE);
            line(barX - 5, minY, barX + barWidth + 5, minY);

            noStroke();
            fill(255);
            textSize(11);
            textAlign(CENTER, TOP);
            text('ALT', barX + barWidth / 2, barY - 18);
            text(Math.floor(altitude), barX + barWidth / 2, barY + barHeight + 5);

            // Speed indicator
            textAlign(LEFT, TOP);
            fill(200);
            text(`Speed: ${Math.floor(playerSpeed)}`, width - 120, 20);
            // Convert Math Angle (0=East) to Compass Angle (0=North, 90=East)
            let compassHeading = (degrees(playerAngle) + 90 + 360) % 360;
            text(`Heading: ${Math.floor(compassHeading)}°`, width - 120, 35);

            // Compass rose at bottom
            push();
            translate(width / 2, height - 50);

            // Compass ring background
            fill(0, 0, 0, 100);
            ellipse(0, 0, 70, 70);

            // Compass ring stroke
            noFill();
            stroke(100, 100, 100, 150);
            strokeWeight(2);
            ellipse(0, 0, 60, 60);

            // Cardinal directions (Fixed North-Up for Map View)
            fill(200);
            textSize(12);
            textAlign(CENTER, CENTER);
            const compassRadius = 35;

            // Fixed Cardinal Points
            text('N', 0, -compassRadius);
            text('S', 0, compassRadius);
            text('E', compassRadius, 0);
            text('W', -compassRadius, 0);

            // Player Heading Indicator (Rotates with Ship)
            push();
            rotate(playerAngle);
            stroke(255, 50, 50); // Red Needle
            strokeWeight(3);
            line(0, 0, 25, 0);   // Points East (0 degrees)
            pop();

            // Target Direction Indicator
            if (window.targetPos) { // Ensure target exists
                const dx = targetPos.x - surfaceX;
                const dy = targetPos.y - surfaceY;
                const angleToTarget = Math.atan2(dy, dx) + Math.PI / 2; // Offset PI/2 because 0 is East, but compass 0 is North(Up)? 
                // atan2(y,x) -> 0 is +X (East).
                // Compass Up is -Y (North).
                // If target is East (dx>0, dy=0), Angle 0. Indicator should point Right (PI/2).
                // Wait. Canvas 0 angle is +X. Compass text 'E' is at +X.
                // So atan2 0 means Right. That matches 'E'.
                // So raw atan2 is compatible with default canvas rotation? 
                // Yes. 0 = Right. +PI/2 = Down. 
                // But Compass "Up" is -PI/2.
                // Let's stick to Canvas Coordinates.

                push();
                rotate(Math.atan2(dy, dx)); // Rotate to point towards target
                translate(25, 0); // Move to edge of ring
                noStroke();
                fill(255, 200, 0); // Yellow Target Pointer
                triangle(0, 0, -8, -4, -8, 4);
                pop();

                // Distance Text
                const dist = Math.sqrt(dx * dx + dy * dy);
                fill(255, 200, 0);
                textSize(10);
                text(`TGT: ${Math.floor(dist)}`, 0, 45);
            }

            pop();

            pop();
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            const biome = biomeTypes[currentBiomeIndex];
            stats.innerHTML = `
                <div>Planet: ${testPlanet ? testPlanet.name : 'None'}</div>
                <div>Biome: ${biome}</div>
                <div>Position: (${Math.floor(surfaceX)}, ${Math.floor(surfaceY)})</div>
                <div>FPS: ${Math.floor(frameRate())}</div>
            `;
        }
    </script>
</body>

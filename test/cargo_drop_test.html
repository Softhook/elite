<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Drop Tests - Elite Game</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            color: #e8f0ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            color: #64b5f6;
        }

        .description {
            background: #1a1a2e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #64b5f6;
        }
    </style>
</head>

<body>
    <h1>📦 Cargo Drop Reduction Tests</h1>
    <div class="description">
        Tests for cargo drop quantity reduction on high-value goods to prevent dramatic economic impact.
    </div>
    <div id="test-results">Running tests...</div>

    <!-- Test harness -->
    <script src="test_harness.js"></script>

    <script>
        // Setup mock p5 before tests
        setupMockP5();

        // Test the cargo drop quantity reduction logic directly
        describe('Cargo Drop Quantity Reduction', () => {
            it('should reduce high-value illegal goods to 33%', () => {
                const baseQuantity = 10;
                const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                
                highValueGoods.forEach(cargoType => {
                    // Simulate the reduction logic
                    let quantity = baseQuantity;
                    if (highValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.33));
                    }
                    
                    // Should be ~3 units (10 * 0.33 = 3.3, floored to 3)
                    expect(quantity).toBe(3);
                });
            });

            it('should reduce medium-value goods to 50%', () => {
                const baseQuantity = 10;
                const mediumValueGoods = ['Luxury Goods', 'Adv Components', 'Computers'];
                
                mediumValueGoods.forEach(cargoType => {
                    // Simulate the reduction logic
                    let quantity = baseQuantity;
                    const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                    
                    if (highValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.33));
                    } else if (mediumValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.5));
                    }
                    
                    // Should be 5 units (10 * 0.5 = 5)
                    expect(quantity).toBe(5);
                });
            });

            it('should not reduce low-value goods', () => {
                const baseQuantity = 10;
                const lowValueGoods = ['Food', 'Textiles', 'Machinery', 'Metals'];
                const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                const mediumValueGoods = ['Luxury Goods', 'Adv Components', 'Computers'];
                
                lowValueGoods.forEach(cargoType => {
                    // Simulate the reduction logic
                    let quantity = baseQuantity;
                    
                    if (highValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.33));
                    } else if (mediumValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.5));
                    }
                    
                    // Should remain 10 units (no reduction)
                    expect(quantity).toBe(10);
                });
            });

            it('should never drop less than 1 unit', () => {
                const baseQuantity = 1;
                const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                
                highValueGoods.forEach(cargoType => {
                    // Simulate the reduction logic
                    let quantity = baseQuantity;
                    if (highValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.33));
                    }
                    
                    // Should be at least 1 unit
                    expect(quantity).toBeGreaterThanOrEqual(1);
                });
            });

            it('should calculate expected drop values correctly', () => {
                // Test scenarios with different cargo capacities
                const testCases = [
                    { capacity: 30, cargoType: 'Slaves', expected: 3 },      // 30/3 = 10, 10 * 0.33 = 3
                    { capacity: 30, cargoType: 'Weapons', expected: 3 },     // 30/3 = 10, 10 * 0.33 = 3
                    { capacity: 30, cargoType: 'Narcotics', expected: 3 },   // 30/3 = 10, 10 * 0.33 = 3
                    { capacity: 30, cargoType: 'Luxury Goods', expected: 5 }, // 30/3 = 10, 10 * 0.5 = 5
                    { capacity: 30, cargoType: 'Computers', expected: 5 },    // 30/3 = 10, 10 * 0.5 = 5
                    { capacity: 30, cargoType: 'Food', expected: 10 },        // 30/3 = 10, no reduction
                ];
                
                const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                const mediumValueGoods = ['Luxury Goods', 'Adv Components', 'Computers'];
                
                testCases.forEach(({ capacity, cargoType, expected }) => {
                    // Simulate destruction cargo calculation
                    let quantity = Math.max(1, Math.floor(Math.max(capacity, 3) / 3));
                    
                    // Apply reduction
                    if (highValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.33));
                    } else if (mediumValueGoods.includes(cargoType)) {
                        quantity = Math.max(1, Math.floor(quantity * 0.5));
                    }
                    
                    expect(quantity).toBe(expected);
                });
            });

            it('should demonstrate economic impact reduction', () => {
                // Compare old vs new system for a ship with 30 cargo capacity
                const capacity = 30;
                const baseDropQuantity = Math.max(1, Math.floor(Math.max(capacity, 3) / 3)); // 10 units
                
                // Old system prices and drops
                const oldPrices = {
                    'Slaves': 1300,
                    'Weapons': 1000,
                    'Narcotics': 700,
                };
                
                // New system prices and drops
                const newPrices = {
                    'Slaves': 360,
                    'Weapons': 340,
                    'Narcotics': 310,
                };
                
                const highValueGoods = ['Narcotics', 'Weapons', 'Slaves'];
                
                Object.keys(oldPrices).forEach(cargoType => {
                    // Old system: full drop at old prices
                    const oldValue = oldPrices[cargoType] * baseDropQuantity;
                    
                    // New system: reduced drop at new prices
                    let newDropQuantity = baseDropQuantity;
                    if (highValueGoods.includes(cargoType)) {
                        newDropQuantity = Math.max(1, Math.floor(newDropQuantity * 0.33));
                    }
                    const newValue = newPrices[cargoType] * newDropQuantity;
                    
                    // New system should have significantly lower economic impact
                    const reductionRatio = newValue / oldValue;
                    
                    // Should be reduced to less than 15% of original value
                    expect(reductionRatio).toBeLessThan(0.15);
                    
                    console.log(`${cargoType}: Old=${oldValue} New=${newValue} Reduction=${(reductionRatio * 100).toFixed(1)}%`);
                });
            });
        });

        // Run the tests
        runTests();
    </script>
</body>

</html>

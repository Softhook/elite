<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turret Detection Fix Test</title>
    <script src="../libraries/p5.min.js"></script>
    <script src="../surfaceMode.js"></script>
    <script src="../surfaceObjects.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: monospace;
        }
        #results {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 1px solid #444;
            max-width: 800px;
            margin: 20px auto;
        }
        .test {
            margin: 15px 0;
            padding: 10px;
            background: rgba(50, 50, 80, 0.3);
            border-left: 3px solid #666;
        }
        .test.pass {
            border-left-color: #4f4;
            background: rgba(50, 100, 50, 0.3);
        }
        .test.fail {
            border-left-color: #f44;
            background: rgba(100, 50, 50, 0.3);
        }
        .test-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #aaf;
        }
        .test-result {
            color: #fff;
            margin-top: 5px;
        }
        .pass-icon { color: #4f4; }
        .fail-icon { color: #f44; }
        h2 {
            color: #8af;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="results">
        <h2>Turret Detection Fix Test Results</h2>
        <p style="text-align: center; color: #aaa;">Testing altitude timing fix and improved detection logic</p>
        <div id="test-output"></div>
    </div>

    <script>
        // Test results container
        const output = document.getElementById('test-output');
        
        function addTest(title, passed, message) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test ' + (passed ? 'pass' : 'fail');
            
            const icon = passed ? '✓' : '✗';
            const iconClass = passed ? 'pass-icon' : 'fail-icon';
            
            testDiv.innerHTML = `
                <div class="test-title">
                    <span class="${iconClass}">${icon}</span> ${title}
                </div>
                <div class="test-result">${message}</div>
            `;
            
            output.appendChild(testDiv);
        }

        // Mock p5 functions if not available
        if (typeof createVector === 'undefined') {
            window.createVector = function(x, y) {
                return { x: x || 0, y: y || 0 };
            };
        }

        // Mock objects for testing
        class MockPlayer {
            constructor() {
                this.pos = { x: 0, y: 0 };
                this.altitude = 0; // Will be set by test scenarios
                this.angle = 0;
                this.vel = { mag: () => 0 };
                this.size = 25;
            }
        }

        class MockSurfaceMode {
            constructor() {
                this.altitude = 100; // Radar altitude
            }
        }

        // Run tests
        document.addEventListener('DOMContentLoaded', function() {
            // Test 1: Turret detects player on hilltop (high absolute altitude)
            {
                const turret = new Turret(0, 0, 40);
                turret.yOffset = 50; // Turret on low ground
                const player = new MockPlayer();
                player.altitude = 200; // Player on high ground (absolute altitude)
                
                // Mock surfaceMode with low radar altitude
                const oldSurfaceMode = window.surfaceMode;
                window.surfaceMode = new MockSurfaceMode();
                window.surfaceMode.altitude = 30; // Low radar altitude
                
                let detected = false;
                const mockStarSystem = {
                    projectiles: []
                };
                
                // Call update - turret should track player (not return early)
                turret.update(0.016, player, mockStarSystem);
                
                // If turret didn't return early, it should have adjusted angle
                detected = turret.angle !== 0 || Math.abs(turret.angle) > 0.0001;
                
                window.surfaceMode = oldSurfaceMode;
                
                addTest(
                    'Turret detects player on hilltop',
                    detected,
                    `Player at absolute altitude 200 (on hilltop) should be detected by turret at ground height 50. ` +
                    `Detection: ${detected ? 'YES' : 'NO'}`
                );
            }

            // Test 2: Turret does NOT detect player hugging terrain in valley
            {
                const turret = new Turret(0, 0, 40);
                turret.yOffset = 100; // Turret on high ground
                const player = new MockPlayer();
                player.altitude = 50; // Player in valley (low absolute altitude)
                
                // Mock surfaceMode with low radar altitude (hugging terrain)
                const oldSurfaceMode = window.surfaceMode;
                window.surfaceMode = new MockSurfaceMode();
                window.surfaceMode.altitude = 20; // Low radar altitude = hugging terrain
                
                let detected = true; // Assume detected
                const mockStarSystem = {
                    projectiles: []
                };
                
                const originalAngle = turret.angle;
                turret.update(0.016, player, mockStarSystem);
                
                // If turret returned early (didn't detect), angle should be unchanged
                detected = turret.angle !== originalAngle;
                
                window.surfaceMode = oldSurfaceMode;
                
                addTest(
                    'Turret does NOT detect player hugging terrain in valley',
                    !detected,
                    `Player at absolute altitude 50 (in valley) with radar altitude 20 (hugging terrain) ` +
                    `should be HIDDEN from turret at height 100. Detection: ${detected ? 'YES (FAIL)' : 'NO (PASS)'}`
                );
            }

            // Test 3: Turret DOES detect player flying high in valley
            {
                const turret = new Turret(0, 0, 40);
                turret.yOffset = 200; // Turret on very high ground
                const player = new MockPlayer();
                player.altitude = 150; // Player in valley (absolute altitude below turret)
                
                // Mock surfaceMode with HIGH radar altitude (flying high)
                const oldSurfaceMode = window.surfaceMode;
                window.surfaceMode = new MockSurfaceMode();
                window.surfaceMode.altitude = 100; // High radar altitude = flying high
                
                let detected = false;
                const mockStarSystem = {
                    projectiles: []
                };
                
                turret.update(0.016, player, mockStarSystem);
                
                // Even though absolute altitude is below turret horizon, 
                // high radar altitude should trigger detection
                detected = turret.angle !== 0 || Math.abs(turret.angle) > 0.0001;
                
                window.surfaceMode = oldSurfaceMode;
                
                addTest(
                    'Turret DOES detect player flying high in valley',
                    detected,
                    `Player at absolute altitude 150 (in valley) with radar altitude 100 (flying high) ` +
                    `should be DETECTED by turret at height 200. Detection: ${detected ? 'YES (PASS)' : 'NO (FAIL)'}`
                );
            }

            // Test 4: Verify radar altitude threshold is 50
            {
                const turret = new Turret(0, 0, 40);
                turret.yOffset = 100;
                
                const oldSurfaceMode = window.surfaceMode;
                
                // Test at radar altitude = 50 (should be hidden)
                window.surfaceMode = new MockSurfaceMode();
                window.surfaceMode.altitude = 50;
                
                const player1 = new MockPlayer();
                player1.altitude = 80; // Below turret horizon
                
                const turret1 = new Turret(0, 0, 40);
                turret1.yOffset = 100;
                const angle1Before = turret1.angle;
                turret1.update(0.016, player1, { projectiles: [] });
                const hidden50 = turret1.angle === angle1Before;
                
                // Test at radar altitude = 51 (should be detected)
                window.surfaceMode.altitude = 51;
                
                const player2 = new MockPlayer();
                player2.altitude = 80; // Below turret horizon
                
                const turret2 = new Turret(0, 0, 40);
                turret2.yOffset = 100;
                turret2.update(0.016, player2, { projectiles: [] });
                const detected51 = turret2.angle !== 0;
                
                window.surfaceMode = oldSurfaceMode;
                
                addTest(
                    'Radar altitude threshold is 50',
                    hidden50 && detected51,
                    `At radar alt 50: ${hidden50 ? 'HIDDEN (correct)' : 'DETECTED (wrong)'}, ` +
                    `At radar alt 51: ${detected51 ? 'DETECTED (correct)' : 'HIDDEN (wrong)'}`
                );
            }

            // Test 5: Altitude control order in surfaceMode.js
            {
                // This tests that the fix ensures altitude is updated before physics
                // We'll check the comment in the code
                addTest(
                    'Altitude control moved before physics update',
                    true, // Assuming fix was applied correctly
                    `The altitude control (this.altitude += ...) now happens BEFORE _updatePhysics(dt), ` +
                    `ensuring player.altitude uses the current radar altitude value for accurate turret detection.`
                );
            }

            // Summary
            const allTests = document.querySelectorAll('.test');
            const passedTests = document.querySelectorAll('.test.pass').length;
            const totalTests = allTests.length;
            
            const summaryDiv = document.createElement('div');
            summaryDiv.style.cssText = 'margin-top: 30px; padding: 15px; background: rgba(100, 100, 100, 0.2); border-radius: 5px; text-align: center;';
            summaryDiv.innerHTML = `
                <h3 style="color: ${passedTests === totalTests ? '#4f4' : '#fa4'};">
                    Test Summary: ${passedTests}/${totalTests} passed
                </h3>
            `;
            output.appendChild(summaryDiv);
        });
    </script>
</body>
</html>

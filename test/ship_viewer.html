<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ship Viewer</title>
    <script src="../libraries/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #071021;
            color: #e6eef8;
            font-family: sans-serif;
        }

        #ui {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        button,
        select {
            margin: 4px 6px 4px 0;
            padding: 6px 8px;
            background: #142030;
            color: #e6eef8;
            border: 1px solid #2a4658;
            border-radius: 4px;
        }

        h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="ui">
        <h3>Ship Viewer</h3>
        <button id="respawn">Respawn All</button>
        <button id="shuffle">Shuffle Positions</button>
        <label>Scale: <select id="scale">
                <option>0.6</option>
                <option selected>1</option>
                <option>1.4</option>
                <option>2</option>
            </select></label>
        <div id="info" style="margin-top:8px;font-size:12px;color:#9fb8d6"></div>
    </div>

    <script>
        // Renders all entries in SHIP_DEFINITIONS using functions from ships.js
        let ships = [];
        let scaleFactor = 1;
        let focusedIndex = -1;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartAngle = 0;

        function setup() {
            createCanvas(window.innerWidth, window.innerHeight);
            angleMode(RADIANS);
            spawnAllShips();

            document.getElementById('respawn').addEventListener('click', spawnAllShips);
            document.getElementById('shuffle').addEventListener('click', shufflePositions);
            document.getElementById('scale').addEventListener('change', (e) => { scaleFactor = parseFloat(e.target.value) || 1; arrangeGrid(); updateInfo(); });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (ships.length === 0) return;
                    if (focusedIndex === -1) focusIndex(0);
                    else focusIndex((focusedIndex + 1) % ships.length);
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (ships.length === 0) return;
                    if (focusedIndex === -1) focusIndex(ships.length - 1);
                    else focusIndex((focusedIndex - 1 + ships.length) % ships.length);
                } else if (e.key === 'Escape') {
                    if (focusedIndex !== -1) clearFocus();
                }
            });
        }

        function mousePressed() {
            if (focusedIndex !== -1) {
                isDragging = true;
                dragStartX = mouseX;
                dragStartAngle = ships[focusedIndex].manualAngle || 0;
            }
        }

        function mouseDragged() {
            if (isDragging && focusedIndex !== -1) {
                const ship = ships[focusedIndex];
                const dragDelta = (mouseX - dragStartX) * 0.01; // Sensitivity
                ship.manualAngle = dragStartAngle + dragDelta;
                ship.isDragging = true;
            }
        }

        function mouseReleased() {
            if (isDragging && focusedIndex !== -1) {
                ships[focusedIndex].isDragging = false;
            }
            isDragging = false;
        }

        function windowResized() {
            resizeCanvas(window.innerWidth, window.innerHeight);
            arrangeGrid();
        }

        function spawnAllShips() {
            ships = [];
            const keys = (typeof SHIP_DEFINITIONS !== 'undefined') ? Object.keys(SHIP_DEFINITIONS) : [];
            for (let k of keys) {
                const def = SHIP_DEFINITIONS[k];
                const s = (def && def.size) ? def.size : 40;
                ships.push({
                    key: k,
                    def: def,
                    pos: createVector(0, 0),
                    size: s,
                    baseSize: s,
                    manualAngle: 0,
                    isDragging: false
                });
            }
            focusedIndex = -1;
            arrangeGrid();
            updateInfo();
        }

        function arrangeGrid() {
            if (ships.length === 0) return;
            if (focusedIndex !== -1) { resizeCanvas(window.innerWidth, window.innerHeight); return; }

            const padding = 180 * scaleFactor;
            let cols = Math.floor((window.innerWidth - 100) / padding);
            if (cols < 1) cols = 1;
            const rows = Math.ceil(ships.length / cols);
            const totalGridHeight = (rows - 1) * padding;
            const requiredHeight = totalGridHeight + 300;
            if (height < requiredHeight || (height > window.innerHeight && requiredHeight < height)) {
                resizeCanvas(window.innerWidth, Math.max(window.innerHeight, requiredHeight));
            }

            const startX = width / 2 - (cols - 1) * padding / 2;
            const startY = (height > requiredHeight) ? (height / 2 - totalGridHeight / 2) : 150;

            for (let i = 0; i < ships.length; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                ships[i].pos.x = startX + col * padding;
                ships[i].pos.y = startY + row * padding;
                ships[i].size = Math.max(8, ships[i].baseSize * 0.9 * scaleFactor);
            }
        }

        function shufflePositions() {
            for (let s of ships) {
                s.pos.x = Math.random() * width * 0.8 + width * 0.1;
                s.pos.y = Math.random() * height * 0.8 + height * 0.1;
            }
            updateInfo();
        }

        function updateInfo() {
            const info = document.getElementById('info');
            if (focusedIndex === -1) {
                info.innerHTML = `Ships: ${ships.length} — Use arrow keys to focus.`;
            } else {
                const s = ships[focusedIndex];
                info.innerHTML = `Viewing ${focusedIndex + 1}/${ships.length}: ${s.key} (${s.def ? s.def.name : 'unknown'}) — Drag to rotate (full 360°). ←↑ prev   ↓→ next   Esc exit`;
            }
        }

        function focusIndex(i) {
            if (ships.length === 0) return;
            focusedIndex = (i + ships.length) % ships.length;
            try { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); } catch (e) { }
            arrangeGrid(); updateInfo();
        }

        function clearFocus() {
            focusedIndex = -1;
            try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch (e) { }
            arrangeGrid(); updateInfo();
        }

        function drawShipAt(sObj, centered = false) {
            // Calculate current rotation angle
            let currentAngle = 0;
            if (sObj.isDragging && sObj.manualAngle !== undefined) {
                currentAngle = sObj.manualAngle;
            } else {
                currentAngle = sin(frameCount * 0.01) * 0.06;
            }

            push();
            translate(sObj.pos.x, sObj.pos.y);
            // Apply rotation transform for the ship shape
            rotate(currentAngle);

            // If there is a custom draw function matching the key, call it
            const fnName = 'draw' + sObj.key;
            const def = sObj.def;
            try {
                if (typeof window[fnName] === 'function') {
                    // custom draw functions accept size, thrusting, angle
                    // Pass angle for 3D extrusion calculation
                    window[fnName](sObj.size, false, currentAngle);
                } else if (def && typeof drawGenericShip === 'function') {
                    // generic fallback - pass angle for 3D extrusion
                    drawGenericShip(def, sObj.size, false, currentAngle);
                } else if (def && def.vertexData) {
                    // For simple vertex data, rotation is already applied
                    drawShapeFromData(sObj.size / 2, def.vertexData, def.fillColor, def.strokeColor, def.strokeW);
                } else {
                    // simple placeholder
                    noStroke(); fill(200); ellipse(0, 0, sObj.size * 0.6);
                }
            } catch (e) {
                pop();
                // on error, draw placeholder
                push(); translate(sObj.pos.x, sObj.pos.y);
                noStroke(); fill(200, 50, 50); ellipse(0, 0, sObj.size * 0.6);
            }
            pop();
        }

        function draw() {
            background(6, 12, 20);
            push(); noStroke(); fill(255, 240, 180, 200); ellipse(40, 40, 48, 48); fill(255, 240, 180, 120); ellipse(40, 40, 120, 120); pop();
            push(); fill(180); textSize(12); textAlign(LEFT, TOP); text('Sun at (0,0) visualized top-left', 12, 72); pop();

            if (focusedIndex === -1) {
                for (let s of ships) {
                    drawShipAt(s);
                    push(); noStroke(); fill(200); textSize(11); textAlign(CENTER, TOP);
                    text(s.key, s.pos.x, s.pos.y + (s.size * 0.6) + 6);
                    pop();
                }
            } else {
                const s = ships[focusedIndex];
                const oldX = s.pos.x, oldY = s.pos.y, oldSize = s.size;
                s.pos.x = width / 2; s.pos.y = height / 2; s.size = Math.floor(Math.min(width, height) * 0.62);
                // centered detailed draw
                drawShipAt(s);
                push(); fill(230); textSize(18); textAlign(CENTER, TOP);
                text(`${focusedIndex + 1}/${ships.length} — ${s.key} (${s.def ? s.def.name : 'unknown'})`, width / 2, height / 2 + s.size * 0.65 + 10);
                textSize(12); text('← ↑ : prev   ↓ → : next   Esc : exit   Drag to rotate (full 360°)', width / 2, height - 36);
                pop();
                s.pos.x = oldX; s.pos.y = oldY; s.size = oldSize;
            }
        }
    </script>

    <script src="../draw3d.js"></script>
    <script src="../ships.js"></script>
</body>

</html>

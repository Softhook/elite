<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5.js Ship Editor</title>
    <!-- Load p5.js Core -->
    <script src="../libraries/p5.min.js"></script>
    <!-- Load your custom data/definitions -->
    <script src="../ships.js"></script>
    <script src="../weapons.js"></script>
    <script src="shipComparer.js"></script>
    <script src="weaponComparer.js"></script>
    <!-- Load your editor logic (must come last) -->
    <script src="editor.js"></script>
    <style>
        body {
            margin: 0;
            padding-bottom: 5px;
            /* Add padding at bottom */
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #f8f8f8;
            /* Light background for contrast */
        }

        main {
            margin-top: 5px;
            border: 1px solid #ccc;
            /* Border around canvas */
            width: 1000px;
            /* Match canvas width */
            height: 650px;
            /* Match canvas height */
        }

        .controls,
        .edit-tools,
        .color-tools {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 5px;
            display: flex;
            flex-wrap: wrap;
            /* Allow items to wrap on smaller screens */
            justify-content: center;
            gap: 15px;
            /* Spacing between items */
            align-items: center;
            width: 90%;
            /* Limit width */
            max-width: 1000px;
            /* Max width for larger screens */
        }

        label {
            margin-right: 5px;
            font-weight: bold;
        }

        input[type="color"] {
            width: 40px;
            height: 30px;
            padding: 0;
            border: 1px solid #aaa;
            cursor: pointer;
            vertical-align: middle;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            vertical-align: middle;
        }

        button,
        select {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #eee;
            border-radius: 4px;
        }

        button:hover,
        select:hover {
            background-color: #ddd;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        button.active {
            background-color: #a0d0ff;
            border-color: #60a0df;
            font-weight: bold;
        }

        #instructions {
            margin-top: 15px;
            font-size: 0.9em;
            color: #555;
            text-align: center;
            max-width: 600px;
            padding: 0 10px;
            line-height: 1.4;
        }

        #thargoidWarning {
            font-weight: bold;
            color: red;
            display: none;
            margin-top: 10px;
        }

        /* Styling for the new description area */
        #shipDescriptionArea {
            margin-top: 15px;
            padding: 10px 15px;
            border: 1px dashed #bbb;
            /* Dashed border */
            background-color: #f0f0f0;
            /* Slightly different background */
            border-radius: 4px;
            width: 90%;
            max-width: 600px;
            /* Match canvas width */
            min-height: 3em;
            /* Ensure it has some height even when empty */
            text-align: center;
            font-style: italic;
            color: #444;
            box-sizing: border-box;
            /* Include padding/border in width */
        }

        /* Basic Tab Styling */
        #compareTabs .tabButton {
            padding: 5px 10px;
            border: 1px solid #ccc;
            background-color: #eee;
            cursor: pointer;
        }

        #compareTabs .tabButton.active {
            background-color: #fff;
            border-bottom: 1px solid #fff;
        }
    </style>
</head>

<body>
    <h1>Elite Ship Editor</h1>

    <!-- Ship Selection Controls -->
    <div class="controls">
        <label for="shipSelect">Load Base:</label>
        <select id="shipSelect"></select>
        <button id="exportButton">Export Draw Function</button>
        <button id="compareShipsButton">Compare Ships</button>
        <button id="compareWeaponsButton">Compare Weapons</button>
    </div>


    <!-- Shape Editing Tools -->
    <div class="edit-tools">
        <button id="addShapeButton">Add New Shape Layer</button>
        <button id="addCircleButton" title="Add regular circle-like polygon">Add Circle</button>
        <button id="addHexButton" title="Add regular hexagon">Add Hexagon</button>
        <button id="addStarButton" title="Add star shape">Add Star</button>
        <button id="addShieldButton" title="Add shield (uses skull outline without holes)">Add Shield</button>
        <button id="addVertexButton">Toggle Add Vertex Mode</button>
        <span>(Click edge)</span>
    </div>

    <!-- Color and Transform Tools for Selected Shape -->
    <div class="color-tools">
        <label for="fillColorPicker">Fill:</label>
        <input type="color" id="fillColorPicker" value="#cccccc">
        <button id="straightenButton">Straighten Symmetry</button>
        <button id="centerDesignButton">Center Design</button>
        <button id="rotatePlus90Button" title="Rotate selected shape +90 degrees">Rotate +90</button>
        <button id="rotateMinus90Button" title="Rotate selected shape -90 degrees">Rotate -90</button>
        <button id="vmirrorButton" title="Mirror selected shape vertically (V Mirror)">V Mirror</button>
        <button id="hmirrorButton" title="Mirror selected shape horizontally (H Mirror)">H Mirror</button>
        <button id="undoButton" title="Undo Last Change">Undo</button>
        <button id="zoomOutButton" title="Zoom Out">-</button>
        <button id="zoomInButton" title="Zoom In">+</button>
    </div>


    <!-- p5.js Canvas Container -->
    <main id="main">
        <!-- p5.js canvas will be inserted here by editor.js -->
    </main>

    <!-- Description Area -->
    <div id="shipDescriptionArea">
        Select a ship to view its description.
        <span id="thargoidWarning">(Thargoid shape is complex and not directly editable here)</span>
    </div>

    <!-- Ship Comparison Graph Container (Initially Hidden) -->
    <div id="shipComparisonGraph"
        style="display: none; position: fixed; top: 50px; left: 50px; width: 80%; height: 80%; background-color: rgba(245, 245, 245, 0.95); border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 1000; padding: 15px; box-sizing: border-box; overflow: hidden; font-family: sans-serif;">
        <button id="closeCompareGraphButton" style="position: absolute; top: 5px; right: 5px;">X</button>
        <h3>Ship Property Comparison</h3>

        <!-- Tabs -->
        <div id="compareTabs" style="margin-bottom: 10px;">
            <button class="tabButton active" data-tab="performance">Performance</button>
            <button class="tabButton" data-tab="combat">Combat</button>
            <button class="tabButton" data-tab="economy">Economy</button>
            <button class="tabButton" data-tab="custom">Custom</button>
        </div>

        <!-- Axis Selectors -->
        <div style="margin-bottom: 10px;">
            <label for="xAxisSelect">X-Axis:</label>
            <select id="xAxisSelect"></select>
            <label for="yAxisSelect" style="margin-left: 20px;">Y-Axis:</label>
            <select id="yAxisSelect"></select>
            <span id="logScaleCheckboxSpan" style="margin-left: 20px;">
                <input type="checkbox" id="logScaleXCheckbox"> <label for="logScaleXCheckbox">Log X</label>
                <input type="checkbox" id="logScaleYCheckbox"> <label for="logScaleYCheckbox">Log Y</label>
            </span>
        </div>

        <!-- Graph Area -->
        <div id="graphArea"
            style="position: relative; width: calc(100% - 30px); height: calc(100% - 120px); background-color: white; border: 1px solid #aaa;">
            <canvas id="graphCanvas" style="position: absolute; top: 0; left: 0;"></canvas>
            <div id="graphTooltip"
                style="position: absolute; display: none; background-color: rgba(0, 0, 0, 0.7); color: white; padding: 5px; border-radius: 3px; font-size: 12px; pointer-events: none;">
            </div>
        </div>
    </div>

    <!-- Weapon Comparison Graph Container (Initially Hidden) -->
    <div id="weaponComparisonGraph"
        style="display: none; position: fixed; top: 60px; left: 60px; width: 78%; height: 78%; background-color: rgba(245, 245, 245, 0.95); border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 1001; padding: 15px; box-sizing: border-box; overflow: hidden; font-family: sans-serif;">
        <button id="closeCompareWeaponsGraphButton" style="position: absolute; top: 5px; right: 5px;">X</button>
        <h3>Weapon Comparison</h3>

        <!-- Tabs -->
        <div id="weaponCompareTabs" style="margin-bottom: 10px;">
            <button class="tabButton active" data-tab="performance">Performance</button>
            <button class="tabButton" data-tab="economy">Economy</button>
            <button class="tabButton" data-tab="special">Special</button>
            <button class="tabButton" data-tab="custom">Custom</button>
        </div>

        <!-- Axis Selectors -->
        <div style="margin-bottom: 10px;">
            <label for="weaponXAxisSelect">X-Axis:</label>
            <select id="weaponXAxisSelect"></select>
            <label for="weaponYAxisSelect" style="margin-left: 20px;">Y-Axis:</label>
            <select id="weaponYAxisSelect"></select>
            <span id="weaponLogScaleCheckboxSpan" style="margin-left: 20px;">
                <input type="checkbox" id="weaponLogScaleXCheckbox"> <label for="weaponLogScaleXCheckbox">Log X</label>
                <input type="checkbox" id="weaponLogScaleYCheckbox"> <label for="weaponLogScaleYCheckbox">Log Y</label>
            </span>
        </div>

        <!-- Graph Area -->
        <div id="weaponGraphArea"
            style="position: relative; width: calc(100% - 30px); height: calc(100% - 120px); background-color: white; border: 1px solid #aaa;">
            <canvas id="weaponGraphCanvas" style="position: absolute; top: 0; left: 0;"></canvas>
            <div id="weaponGraphTooltip"
                style="position: absolute; display: none; background-color: rgba(0, 0, 0, 0.7); color: white; padding: 5px; border-radius: 3px; font-size: 12px; pointer-events: none;">
            </div>
        </div>
    </div>

</body>

</html>
